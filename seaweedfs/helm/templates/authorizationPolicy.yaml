{{- if .Values.ezua.authorizationPolicy.enabled }}
# Custom authorization policy that routes browser traffic to PCAI SSO (oauth2-proxy).
# It matches the filer UI host ONLY, so the S3 host published by virtualservice-s3.yaml
# keeps SigV4 authentication instead of being redirected to a login page.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ .Release.Name }}-auth-policy
  namespace: {{ .Values.ezua.authorizationPolicy.namespace }}
  labels:
    {{- include "seaweedfs.labels" . | nindent 4 }}
spec:
  action: CUSTOM
  provider:
    name: {{ .Values.ezua.authorizationPolicy.providerName }}
  rules:
    - to:
        - operation:
            hosts:
              - {{ .Values.ezua.virtualService.endpoint }}
  selector:
    matchLabels:
      istio: "ingressgateway"
{{- end }}
