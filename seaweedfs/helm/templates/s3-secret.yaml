{{- if and .Values.s3.enabled (not .Values.s3.existingConfigSecret) }}
{{- $secretKey := .Values.s3.auth.secretKey | default (randAlphaNum 32) -}}
# S3 identity config consumed by "weed s3 -config=". Key name and mount path mirror
# the upstream chart (key: seaweedfs_s3_config, path: /etc/sw/seaweedfs_s3_config).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "seaweedfs.s3SecretName" . }}
  labels:
    {{- include "seaweedfs.labels" . | nindent 4 }}
    app.kubernetes.io/component: s3
type: Opaque
stringData:
  seaweedfs_s3_config: |
    {
      "identities": [
        {
          "name": "admin",
          "credentials": [
            {
              "accessKey": {{ .Values.s3.auth.accessKey | quote }},
              "secretKey": {{ $secretKey | quote }}
            }
          ],
          "actions": ["Admin", "Read", "Write"]
        }
      ]
    }
{{- end }}
