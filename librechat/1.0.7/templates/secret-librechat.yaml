{{/*
Credentials Secret. All keys are injected into the app via envFrom in
deployment-librechat.yaml.

- Auto-generated secrets (JWT, creds, session, DB) are REUSED across upgrades
  via `lookup` so they stay stable - otherwise every `helm upgrade` invalidates
  issued tokens and breaks logins. A values override wins; otherwise an existing
  value is reused; otherwise a new random value is generated. Keys absent from an
  older Secret (e.g. OPENID_SESSION_SECRET added in 1.0.5) are generated on the
  first upgrade rather than coming back empty.
- User-provided values (HPE_MODEL_API_KEY) always reflect values.yaml so the key
  is never pinned stale by the reuse logic, and is kept OUT of the ConfigMap.
*/}}
{{- $secretName := printf "%s-credentials" (include "librechat.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $data := dict }}
{{- if $existing }}{{ $data = $existing.data }}{{ end }}
{{- $jwt := .Values.librechat.security.jwtSecret }}
{{- if not $jwt }}{{ if hasKey $data "JWT_SECRET" }}{{ $jwt = index $data "JWT_SECRET" | b64dec }}{{ else }}{{ $jwt = randAlphaNum 48 }}{{ end }}{{ end }}
{{- $jwtRefresh := .Values.librechat.security.jwtRefreshSecret }}
{{- if not $jwtRefresh }}{{ if hasKey $data "JWT_REFRESH_SECRET" }}{{ $jwtRefresh = index $data "JWT_REFRESH_SECRET" | b64dec }}{{ else }}{{ $jwtRefresh = randAlphaNum 48 }}{{ end }}{{ end }}
{{- $credsKey := .Values.librechat.security.credsKey }}
{{- if not $credsKey }}{{ if hasKey $data "CREDS_KEY" }}{{ $credsKey = index $data "CREDS_KEY" | b64dec }}{{ else }}{{ $credsKey = randAlphaNum 32 }}{{ end }}{{ end }}
{{- $credsIv := .Values.librechat.security.credsIv }}
{{- if not $credsIv }}{{ if hasKey $data "CREDS_IV" }}{{ $credsIv = index $data "CREDS_IV" | b64dec }}{{ else }}{{ $credsIv = randAlphaNum 16 }}{{ end }}{{ end }}
{{- $pgPassword := .Values.pgvector.password }}
{{- if not $pgPassword }}{{ if hasKey $data "PGVECTOR_PASSWORD" }}{{ $pgPassword = index $data "PGVECTOR_PASSWORD" | b64dec }}{{ else }}{{ $pgPassword = randAlphaNum 24 }}{{ end }}{{ end }}
{{- $meiliKey := .Values.meilisearch.masterKey }}
{{- if not $meiliKey }}{{ if hasKey $data "MEILI_MASTER_KEY" }}{{ $meiliKey = index $data "MEILI_MASTER_KEY" | b64dec }}{{ else }}{{ $meiliKey = randAlphaNum 32 }}{{ end }}{{ end }}
{{- $openidSession := "" }}
{{- if hasKey $data "OPENID_SESSION_SECRET" }}{{ $openidSession = index $data "OPENID_SESSION_SECRET" | b64dec }}{{ else }}{{ $openidSession = randAlphaNum 32 }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "librechat.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ $jwt | quote }}
  JWT_REFRESH_SECRET: {{ $jwtRefresh | quote }}
  CREDS_KEY: {{ $credsKey | quote }}
  CREDS_IV: {{ $credsIv | quote }}
  PGVECTOR_PASSWORD: {{ $pgPassword | quote }}
  MEILI_MASTER_KEY: {{ $meiliKey | quote }}
  OPENID_SESSION_SECRET: {{ $openidSession | quote }}
  HPE_MODEL_API_KEY: {{ .Values.hpeModel.apiKey | default "" | quote }}
  {{- if and .Values.ragApi.enabled .Values.ragApi.embeddings.apiKey }}
  RAG_EMBEDDINGS_API_KEY: {{ .Values.ragApi.embeddings.apiKey | quote }}
  {{- end }}
