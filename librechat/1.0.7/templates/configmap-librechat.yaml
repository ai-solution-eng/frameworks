apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "librechat.fullname" . }}-config
  labels:
    {{- include "librechat.labels" . | nindent 4 }}
data:
  librechat.yaml: |
    version: 1.3.13
    cache: true

    # Route uploaded files (PDFs etc.) through the RAG API / vector store
    # instead of sending them inline to the model. vLLM-served models
    # (e.g. via LiteLLM) reject "file"-type message content parts.
    fileConfig:
      fileStrategy: "rag"

    interface:
      privacyPolicy:
        externalUrl: "https://www.hpe.com/privacy"
        openNewTab: true
      endpointsMenu: true
      modelSelect: true
      parameters: true
      sidePanel: true
      presets: true
      prompts: true
      bookmarks: true
      multiConvo: true

    endpoints:
      custom:
        - name: "{{ .Values.hpeModel.displayName }}"
          # Key is read from env (injected from the credentials Secret), not
          # stored in this ConfigMap. See HPE_MODEL_API_KEY in secret-librechat.yaml.
          apiKey: "${HPE_MODEL_API_KEY}"
          baseURL: "{{ .Values.hpeModel.baseURL }}"
          models:
            default:
              - "{{ .Values.hpeModel.defaultModel }}"
            fetch: {{ .Values.hpeModel.fetchModels }}
          titleConvo: true
          titleModel: "{{ .Values.hpeModel.defaultModel }}"
          summarize: true
          modelParameters:
            num_ctx: {{ .Values.hpeModel.contextWindow }}

    modelSpecs:
      enforce: false
      prioritize: true
      list:
        - name: "hpe-ai"
          label: "{{ .Values.hpeModel.displayName }}"
          description: "Enterprise model deployed on HPE Private Cloud AI platform"
          showcase: true
          preset:
            endpoint: "{{ .Values.hpeModel.displayName }}"
            model: "{{ .Values.hpeModel.defaultModel }}"

    {{- if .Values.searxng.enabled }}
    webSearch:
      searchProvider: "searxng"
      # MUST be an env-var reference: a literal URL here is rejected by
      # LibreChat at startup ("contains an actual value instead of an
      # environment variable reference"). SEARXNG_INSTANCE_URL is set on the
      # api pod in deployment-librechat.yaml.
      searxngInstanceUrl: "${SEARXNG_INSTANCE_URL}"
    {{- end }}
