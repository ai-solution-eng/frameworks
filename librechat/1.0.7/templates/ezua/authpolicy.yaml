{{- if .Values.ezua.authorizationPolicy.enabled }}
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ printf "%s-%s-auth-policy" .Release.Name .Chart.Name }}
  namespace: {{ .Values.ezua.authorizationPolicy.namespace }}
  labels:
    {{- include "librechat.labels" . | nindent 4 }}
spec:
  action: CUSTOM
  provider:
    name: {{ .Values.ezua.authorizationPolicy.providerName }}
  rules:
    - to:
        - operation:
            hosts:
              - {{ .Values.ezua.virtualService.endpoint | required ".Values.ezua.virtualService.endpoint is required !\n" }}
  selector:
    matchLabels:
      {{- toYaml .Values.ezua.authorizationPolicy.matchLabels | nindent 6 }}
{{- end }}
