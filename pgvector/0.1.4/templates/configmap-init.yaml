apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pgvector.fullname" . }}-initdb
  namespace: {{ include "pgvector.namespace" . }}
  labels:
    {{- include "pgvector.labels" . | nindent 4 }}
data:
  init.sql: |
    {{- if .Values.pgvector.enabled }}
    CREATE EXTENSION IF NOT EXISTS vector;
    {{- end }}