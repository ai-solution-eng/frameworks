# Optional override for resource names.
# If empty, Helm will use: <release-name>-pgvector
fullnameOverride: ""

# Optional namespace override.
# If empty, Helm uses .Release.Namespace.
namespaceOverride: ""

# Optional override for the base name of the application (chart name).
# If empty, Helm uses .Chart.Name (pgvector).
nameOverride: ""

image:
  repository: pgvector/pgvector
  tag: "pg18"
  pullPolicy: IfNotPresent

postgresql:
  username: postgres
  # Default credentials for initial deployment only. Change them for any
  # non-test environment, or reference a pre-created Secret via existingSecret
  # (it must contain the keys POSTGRES_USER and POSTGRES_PASSWORD).
  password: postgres
  existingSecret: ""
  database: postgres
  port: 5432

service:
  type: ClusterIP
  port: 5432

persistence:
  size: 10Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: "1"
    memory: "1Gi"
  limits:
    cpu: "4"
    memory: "4Gi"

podSecurityContext:
  enabled: true
  fsGroup: 1001

containerSecurityContext:
  enabled: true
  runAsUser: 1001
  runAsNonRoot: true

nodeSelector: {}

tolerations: []

affinity: {}

extraEnv: []

# Platform related options (HPE AI Essentials / PCAI).
# No virtualService / authorizationPolicy: pgvector exposes only an internal
# PostgreSQL service and has no web application endpoint.
ezua: {}
