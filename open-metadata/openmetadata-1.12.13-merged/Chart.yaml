annotations:
  artifacthub.io/images: |
    - name: openmetadata-server
      image: docker.io/openmetadata/server:1.12.13
  artifacthub.io/license: Apache-2.0
  artifacthub.io/recommendations: |
    - name: bitnami/mysql
    - name: apache/airflow
    - name: opensearchproject/opensearch
  artifacthub.io/support: https://github.com/open-metadata/openmetadata-helm-charts/issues
  kubeVersion: '>=1.24'
apiVersion: v2
appVersion: 1.12.13
dependencies:
- condition: mysql.enabled
  name: mysql
  repository: https://charts.bitnami.com/bitnami
  version: 14.0.2
- condition: airflow.enabled
  name: airflow
  repository: https://airflow.apache.org
  version: 1.18.0
- condition: opensearch.enabled
  name: opensearch
  repository: https://opensearch-project.github.io/helm-charts/
  version: 3.3.2
- condition: fuseki.enabled
  name: fuseki
  repository: ""
  version: 0.1.0
description: A Helm chart for OpenMetadata on Kubernetes
home: https://open-metadata.org/
icon: https://open-metadata.org/assets/favicon.png
keywords:
- metadata
- data-science
- data
- machine-learning
- automation
- big-data
- bigdata
- artificial-intelligence
- datascience
- data-engineering
- data-catalog
- metadata-api
- governance
- data-profiling
- metadata-management
- dataengineering
- dataquality
- bigdataanalytics
- datadiscovery
maintainers:
- email: support@open-metadata.org
  name: OpenMetadata
name: openmetadata
sources:
- https://github.com/open-metadata/OpenMetadata
- https://github.com/open-metadata/openmetadata-helm-charts
type: application
version: 1.12.13
