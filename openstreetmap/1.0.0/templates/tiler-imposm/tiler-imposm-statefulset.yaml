{{- if .Values.tilerImposm.enabled -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-tiler-imposm-sts
  labels:
    app: {{ template "osm-seed.name" . }}
    component: tiler-imposm
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
    "hpe-ezua/type": vendor-service
    "hpe-ezua/app": {{ .Chart.Name }}
spec:
  selector:
    matchLabels:
      app:  {{ .Release.Name }}-tiler-imposm-sts
  serviceName: {{ .Release.Name }}-tiler-imposm
  replicas: 1
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-tiler-imposm-sts
        "hpe-ezua/type": vendor-service
        "hpe-ezua/app": {{ .Chart.Name }}
    spec:
      {{- if .Values.tilerImposm.serviceAccount.enabled }}
      serviceAccountName: {{ .Values.tilerImposm.serviceAccount.name }}
      automountServiceAccountToken: true
      {{- end }}
      priorityClassName: {{ .Release.Name }}-{{ .Values.tilerImposm.priorityClass | default "medium-priority" }}
{{ include "osm-seed.certsInitBlock" . | nindent 6 }}
      containers:
      - name: {{ .Release.Name }}-tiler-imposm-sts
        image: {{ .Values.tilerImposm.image.name }}:{{ .Values.tilerImposm.image.tag }}
        command: ['./start.sh']
        {{- if .Values.tilerImposm.livenessProbe.enabled }}
        livenessProbe:
            exec:
              command:
              - /bin/bash
              - -c
              - ./liveness.sh
            initialDelaySeconds: {{ .Values.tilerImposm.livenessProbe.initialDelaySeconds | default 7200 }}
            timeoutSeconds: {{ .Values.tilerImposm.livenessProbe.timeoutSeconds | default 5 }}
            periodSeconds: {{ .Values.tilerImposm.livenessProbe.periodSeconds | default 10 }}
            failureThreshold: {{ .Values.tilerImposm.livenessProbe.failureThreshold | default 3 }}
        {{- end }}
        {{- if .Values.tilerImposm.resources.enabled }}
        resources:
          {{- if .Values.tilerImposm.resources.requests.enabled }}
          requests:
            memory: {{ .Values.tilerImposm.resources.requests.memory }}
            cpu: {{ .Values.tilerImposm.resources.requests.cpu }}
          {{- end }}
          {{- if .Values.tilerImposm.resources.limits.enabled }}
          limits:
            memory: {{ .Values.tilerImposm.resources.limits.memory }}
            cpu: {{ .Values.tilerImposm.resources.limits.cpu }}
          {{- end }}
        {{- end }}
        env:
{{ include "osm-seed.proxyCertsEnv" . | nindent 10 }}
          {{- range $k, $v := .Values.tilerImposm.env }}
          {{- if and (eq $.Values.s3.provider "minio") (or (eq $k "AWS_S3_BUCKET") (eq $k "AWS_ACCESS_KEY_ID") (eq $k "AWS_SECRET_ACCESS_KEY")) }}
          {{- else }}
          - name: {{ $k }}
            value: {{ $v | quote }}
          {{- end }}
          {{- end }}
{{ include "osm-seed.s3Env" . | nindent 10 }}
        envFrom:
        - configMapRef:
            name: {{ .Release.Name }}-tiler-db-cm
        volumeMounts:
{{ include "osm-seed.certsVolumeMountsEntry" . | nindent 8 }}
        - mountPath: {{ .Values.tilerImposm.persistenceDisk.mountPath }}
          name: tiler-imposm-storage
      restartPolicy: Always
      volumes:
{{ include "osm-seed.certsVolumesEntry" . | nindent 8 }}
        - name: tiler-imposm-storage
        {{- if .Values.tilerImposm.persistenceDisk.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-tiler-imposm-pv-claim
        {{- else }}
          emptyDir: {}
        {{- end }}
      {{- if .Values.tilerImposm.nodeSelector.enabled }}
      nodeSelector:
        {{ .Values.tilerImposm.nodeSelector.label_key }} : {{ .Values.tilerImposm.nodeSelector.label_value }}
      {{- end }}
      # Affinity settings
      {{- if .Values.tilerImposm.nodeAffinity.enabled }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: {{ .Values.tilerImposm.nodeAffinity.key }}
                    operator: In
                    values:
                    {{- range .Values.tilerImposm.nodeAffinity.values }}
                      - {{ . | quote }}
                    {{- end }}
      {{- end }}
{{- end }}
