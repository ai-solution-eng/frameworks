# More information https://docs.ezmeral.hpe.com/unified-analytics/15/ManageClusters/importing-applications.html?hl=import
# Exposes the app through the PCAI EzUA gateway. ${DOMAIN_NAME} is substituted by PCAI at import time.
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ include "osm-seed.fullname" . }}
  labels:
    app: {{ template "osm-seed.name" . }}
    component: ezua-virtualservice
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
    "hpe-ezua/type": vendor-service
    "hpe-ezua/app": {{ .Chart.Name }}
spec:
  gateways:
    - {{ .Values.ezua.virtualService.istioGateway }}
  hosts:
    - {{ .Values.ezua.virtualService.endpoint | required "\nValid .Values.ezua.virtualService.endpoint is required !" }}
  http:
    - match:
        - uri:
            prefix: ""
      route:
        - destination:
            host: {{ .Values.ezua.virtualService.destinationService | default (printf "%s-service-web" .Release.Name) }}.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.ezua.virtualService.destinationPort | default 80 }}
