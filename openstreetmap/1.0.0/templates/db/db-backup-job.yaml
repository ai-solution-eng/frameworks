{{- range $i, $job := .Values.dbBackupRestore.cronjobs }}
{{- if $job.enabled -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $.Release.Name }}-{{ $job.name }}-backup-job
  labels:
    component: {{ $job.name }}-job
    environment: {{ $.Values.environment }}
    release: {{ $.Release.Name }}
    "hpe-ezua/type": vendor-service
    "hpe-ezua/app": {{ $.Chart.Name }}
spec:
  schedule: {{ quote $job.schedule }}
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  startingDeadlineSeconds: 100
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 300
      template:
        metadata:
          labels:
            app: {{ template "osm-seed.name" $ }}
            release: {{ $.Release.Name }}
            "hpe-ezua/type": vendor-service
            "hpe-ezua/app": {{ $.Chart.Name }}
        spec:
          {{- if $job.serviceAccount.enabled }}
          serviceAccountName: {{ $job.serviceAccount.name }}
          automountServiceAccountToken: true
          {{- end }}
{{ include "osm-seed.certsInitBlock" $ | nindent 10 }}
          containers:
          - name: {{ $job.name }}-backup-job
            image: {{ $.Values.dbBackupRestore.image.name }}:{{ $.Values.dbBackupRestore.image.tag }}
            command: ['/start.sh']
            env:
{{ include "osm-seed.proxyCertsEnv" $ | nindent 14 }}
            # Env vars for api-web database
            {{ if eq $job.name "web-db" }}
              # DB credentials
              - name: POSTGRES_HOST
                value: {{ $.Release.Name }}-db
              - name: POSTGRES_DB
                value: {{ $.Values.db.env.POSTGRES_DB }}
              - name: POSTGRES_PASSWORD
                value: {{ quote $.Values.db.env.POSTGRES_PASSWORD }}
              - name: POSTGRES_USER
                value: {{ $.Values.db.env.POSTGRES_USER }}
              # DB action: backup/restore
              - name: DB_ACTION
                value: {{quote $job.env.DB_ACTION }}
              # Backup naming 
              - name: SET_DATE_AT_NAME
                value: {{quote $job.env.SET_DATE_AT_NAME }}
              - name: BACKUP_CLOUD_FOLDER
                value: {{ $job.env.BACKUP_CLOUD_FOLDER }}
              - name: BACKUP_CLOUD_FILE
                value: {{ $job.env.BACKUP_CLOUD_FILE }}
              # MinIO / S3-compatible backend: patched backup-restore start.sh reads AWS_S3_BUCKET_NAME
              - name: AWS_S3_BUCKET
                value: {{ if eq $.Values.s3.provider "minio" }}{{ printf "s3://%s" $.Values.s3.minio.bucket | quote }}{{ else }}{{ $job.env.AWS_S3_BUCKET | quote }}{{ end }}
              - name: AWS_S3_BUCKET_NAME
                value: {{ if eq $.Values.s3.provider "minio" }}{{ $.Values.s3.minio.bucket | quote }}{{ else }}{{ $job.env.AWS_S3_BUCKET | quote }}{{ end }}
              # Minute replication stream. The backup reads its state.txt to store
              # the seqno next to the dump, so planet dumps know their position.
              - name: MINUTE_REPLICATION_URL
                value: {{ $job.env.MINUTE_REPLICATION_URL }}
              # Clean up options
              - name: CLEANUP_BACKUPS
                value: {{ quote $job.env.CLEANUP_BACKUPS }}
              - name: RETENTION_DAYS
                value: {{ quote $job.env.RETENTION_DAYS }}
              # In case DB_ACTION=restore, adn the backup url
              - name: RESTORE_URL_FILE
                value: {{ $job.env.RESTORE_URL_FILE}}
            {{- end }}
            # Env vars for osmcha database
            {{ if eq $job.name "tm-db" }}
              # DB credentials
              - name: POSTGRES_HOST
                value: {{ $.Release.Name }}-tasking-manager-db
              - name: POSTGRES_DB
                value: {{ $.Values.tmDb.env.POSTGRES_DB }}
              - name: POSTGRES_PASSWORD
                value: {{ quote $.Values.tmDb.env.POSTGRES_PASSWORD }}
              - name: POSTGRES_USER
                value: {{ $.Values.tmDb.env.POSTGRES_USER }}
              # DB action: backup/restore
              - name: DB_ACTION
                value: {{ quote $job.env.DB_ACTION }}
              # Backup naming
              - name: SET_DATE_AT_NAME
                value: {{quote $job.env.SET_DATE_AT_NAME }}
              - name: BACKUP_CLOUD_FOLDER
                value: {{ $job.env.BACKUP_CLOUD_FOLDER }}
              - name: BACKUP_CLOUD_FILE
                value: {{ $job.env.BACKUP_CLOUD_FILE }}
              # MinIO / S3-compatible backend: patched backup-restore start.sh reads AWS_S3_BUCKET_NAME
              - name: AWS_S3_BUCKET
                value: {{ if eq $.Values.s3.provider "minio" }}{{ printf "s3://%s" $.Values.s3.minio.bucket | quote }}{{ else }}{{ $job.env.AWS_S3_BUCKET | quote }}{{ end }}
              - name: AWS_S3_BUCKET_NAME
                value: {{ if eq $.Values.s3.provider "minio" }}{{ $.Values.s3.minio.bucket | quote }}{{ else }}{{ $job.env.AWS_S3_BUCKET | quote }}{{ end }}
              # Clean up options
              - name: CLEANUP_BACKUPS
                value: {{ quote $job.env.CLEANUP_BACKUPS }}
              - name: RETENTION_DAYS
                value: {{ quote $job.env.RETENTION_DAYS }}
              # In case DB_ACTION=restore, adn the backup url
              - name: RESTORE_URL_FILE
                value: {{ $job.env.RESTORE_URL_FILE}}
            {{- end }}
            # Env vars for osmcha database
            {{ if eq $job.name "osmcha-db" }}
              # DB credentials
              - name: POSTGRES_HOST
                value: {{ $.Release.Name }}-osmcha-db
              - name: POSTGRES_DB
                value: {{ $.Values.osmchaDb.env.POSTGRES_DB }}
              - name: POSTGRES_PASSWORD
                value: {{ quote $.Values.osmchaDb.env.POSTGRES_PASSWORD }}
              - name: POSTGRES_USER
                value: {{ $.Values.osmchaDb.env.POSTGRES_USER }}
              # DB action: backup/restore
              - name: DB_ACTION
                value: {{ quote $job.env.DB_ACTION }}
              # Backup naming
              - name: SET_DATE_AT_NAME
                value: {{quote $job.env.SET_DATE_AT_NAME }}
              - name: BACKUP_CLOUD_FOLDER
                value: {{ $job.env.BACKUP_CLOUD_FOLDER }}
              - name: BACKUP_CLOUD_FILE
                value: {{ $job.env.BACKUP_CLOUD_FILE }}
              # MinIO / S3-compatible backend: patched backup-restore start.sh reads AWS_S3_BUCKET_NAME
              - name: AWS_S3_BUCKET
                value: {{ if eq $.Values.s3.provider "minio" }}{{ printf "s3://%s" $.Values.s3.minio.bucket | quote }}{{ else }}{{ $job.env.AWS_S3_BUCKET | quote }}{{ end }}
              - name: AWS_S3_BUCKET_NAME
                value: {{ if eq $.Values.s3.provider "minio" }}{{ $.Values.s3.minio.bucket | quote }}{{ else }}{{ $job.env.AWS_S3_BUCKET | quote }}{{ end }}
              # Clean up options
              - name: CLEANUP_BACKUPS
                value: {{ quote $job.env.CLEANUP_BACKUPS }}
              - name: RETENTION_DAYS
                value: {{ quote $job.env.RETENTION_DAYS }}
              # In case DB_ACTION=restore, adn the backup url
              - name: RESTORE_URL_FILE
                value: {{ $job.env.RESTORE_URL_FILE}}
            {{- end }}
              # Cloud provider
              - name: CLOUDPROVIDER
                value: {{ $.Values.cloudProvider }}
              # MinIO / S3-compatible backend credentials
{{ include "osm-seed.s3Creds" $ | nindent 14 }}
              # Credentials or configurations for each cloud provider
            # {{- if eq $.Values.cloudProvider "aws" }}
            #   - name: AWS_S3_BUCKET
            #     value: {{ $job.env.AWS_S3_BUCKET }}
            # {{- end }}
            {{- if eq $.Values.cloudProvider "gcp" }}
              - name: GCP_STORAGE_BUCKET
                value: {{ $job.env.GCP_STORAGE_BUCKET }}
            {{- end }}
            {{- if eq $.Values.cloudProvider "azure" }}
              - name: AZURE_STORAGE_ACCOUNT
                value: {{ $.Values.AZURE_STORAGE_ACCOUNT }}
              - name: AZURE_CONTAINER_NAME
                value: {{ $job.AZURE_CONTAINER_NAME }}
              - name: AZURE_STORAGE_CONNECTION_STRING
                value: {{ $.Values.AZURE_STORAGE_CONNECTION_STRING }}
            {{- end }}
            # Node selector
            {{- if $job.resources.enabled }}
            resources:
              requests:
                memory: {{ $job.resources.requests.memory }}
                cpu: {{ $job.resources.requests.cpu }}
              limits:
                memory: {{ $job.resources.limits.memory }}
                cpu: {{ $job.resources.limits.cpu }}
            {{- end }}
{{ include "osm-seed.certsVolumeMountsBlock" $ | nindent 12 }}
{{ include "osm-seed.certsVolumesBlock" $ | nindent 10 }}
          restartPolicy: OnFailure
          {{- if $job.nodeSelector.enabled }}
          nodeSelector:
            {{ $job.nodeSelector.label_key }} : {{ $job.nodeSelector.label_value }}
          {{- end }}
          {{- if $job.nodeAffinity.enabled }}
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: {{ $job.nodeAffinity.key }}
                        operator: In
                        values:
                        {{- range $job.nodeAffinity.values }}
                          - {{ . | quote }}
                        {{- end }}
          {{- end }}
---
{{- end }}
{{- end }}
