{{- if .Values.nominatimApi.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-nominatim
  labels:
    app: {{ template "osm-seed.name" . }}
    component: nominatim-api-statefulset
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
    "hpe-ezua/type": vendor-service
    "hpe-ezua/app": {{ .Chart.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ template "osm-seed.name" . }}
      release: {{ .Release.Name }}
      run: {{ .Release.Name }}-nominatim
  serviceName: {{ .Release.Name }}-nominatim
  template:
    metadata:
      labels:
        app: {{ template "osm-seed.name" . }}
        release: {{ .Release.Name }}
        run: {{ .Release.Name }}-nominatim
        "hpe-ezua/type": vendor-service
        "hpe-ezua/app": {{ .Chart.Name }}
    spec:
      priorityClassName: {{ .Release.Name }}-{{ .Values.nominatimApi.priorityClass | default "medium-priority" }}
{{ include "osm-seed.certsInitBlock" . | nindent 6 }}
      containers:
        - name: nominatim-api
          image: "{{ .Values.nominatimApi.image.name }}:{{ .Values.nominatimApi.image.tag }}"
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
            - name: api
              containerPort: 8080
              protocol: TCP
          env:
{{ include "osm-seed.proxyCertsEnv" . | nindent 12 }}
            {{- range $k, $v := .Values.nominatimApi.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- if .Values.nominatimApi.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.nominatimApi.startupProbe.path | default "/status" }}
              port: {{ .Values.nominatimApi.startupProbe.port | default 8080 }}
            periodSeconds: {{ .Values.nominatimApi.startupProbe.periodSeconds | default 60 }}
            timeoutSeconds: {{ .Values.nominatimApi.startupProbe.timeoutSeconds | default 30 }}
            failureThreshold: {{ .Values.nominatimApi.startupProbe.failureThreshold | default 1440 }}
          {{- end }}
          {{- if .Values.nominatimApi.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.nominatimApi.livenessProbe.path | default "/status" }}
              port: {{ .Values.nominatimApi.livenessProbe.port | default 8080 }}
            periodSeconds: {{ .Values.nominatimApi.livenessProbe.periodSeconds | default 60 }}
            timeoutSeconds: {{ .Values.nominatimApi.livenessProbe.timeoutSeconds | default 30 }}
            failureThreshold: {{ .Values.nominatimApi.livenessProbe.failureThreshold | default 6 }}
          {{- end }}
          volumeMounts:
{{ include "osm-seed.certsVolumeMountsEntry" . | nindent 12 }}
            - name: nominatim-pgconf
              mountPath: /etc/postgresql/16/main/conf.d/nominatim.conf
              subPath: nominatim.conf
              readOnly: true
            - name: nominatim-db-storage
              mountPath: {{ .Values.nominatimApi.persistenceDisk.mountPath }}
              subPath: {{ .Values.nominatimApi.persistenceDisk.subPath }}
          {{- if .Values.nominatimApi.resources.enabled }}
          resources:
            {{- if .Values.nominatimApi.resources.requests.enabled }}
            requests:
              memory: {{ .Values.nominatimApi.resources.requests.memory }}
              cpu: {{ .Values.nominatimApi.resources.requests.cpu }}
            {{- end }}
            {{- if .Values.nominatimApi.resources.limits.enabled }}
            limits:
              memory: {{ .Values.nominatimApi.resources.limits.memory }}
              cpu: {{ .Values.nominatimApi.resources.limits.cpu }}
            {{- end }}
          {{- end }}
          
        {{- if and .Values.nominatimApi.enabled .Values.nominatimUI.enabled }}
        - name: nominatim-ui
{{ include "osm-seed.certsVolumeMountsBlock" . | nindent 10 }}
          env:
{{ include "osm-seed.proxyCertsEnv" . | nindent 12 }}

          image: "{{ .Values.nominatimUI.image.name }}:{{ .Values.nominatimUI.image.tag }}"
          ports:
            - containerPort: 80
              name: ui
              protocol: TCP
          command: ["/bin/sh", "-c"]
          args:
            - >
              echo "Nominatim_Config.Nominatim_API_Endpoint = 'https://{{ .Values.nominatimApi.env.NOMINATIM_API_ENDPOINT }}/';"
              >> /usr/share/nginx/html/ui/theme/config.theme.js &&
              nginx -g "daemon off;"
        {{- end }}
      volumes:
{{ include "osm-seed.certsVolumesEntry" . | nindent 8 }}
        - name: nominatim-pgconf
          configMap:
            name: {{ .Release.Name }}-nominatim-pgconf
        - name: nominatim-db-storage
        {{- if .Values.nominatimApi.persistenceDisk.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-nominatim-pv-claim
        {{- else }}
          emptyDir: {}
        {{- end }}
      {{- if .Values.nominatimApi.nodeSelector.enabled }}
      nodeSelector:
        {{ .Values.nominatimApi.nodeSelector.label_key }} : {{ .Values.nominatimApi.nodeSelector.label_value }}
      {{- end }}
      # Affinity settings
      {{- if .Values.nominatimApi.nodeAffinity.enabled }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: {{ .Values.nominatimApi.nodeAffinity.key }}
                    operator: In
                    values:
                    {{- range .Values.nominatimApi.nodeAffinity.values }}
                      - {{ . | quote }}
                    {{- end }}
      {{- end }}
{{- end }}
