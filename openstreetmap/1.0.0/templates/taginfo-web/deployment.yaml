{{- if .Values.taginfoWeb.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-taginfo-web
  labels:
    app: {{ template "osm-seed.name" . }}
    component: taginfo-web-deployment
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
    "hpe-ezua/type": vendor-service
    "hpe-ezua/app": {{ .Chart.Name }}
spec:
  replicas: {{ .Values.taginfoWeb.replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ template "osm-seed.name" . }}
      release: {{ .Release.Name }}
      run: {{ .Release.Name }}-taginfo-web
  template:
    metadata:
      labels:
        app: {{ template "osm-seed.name" . }}
        release: {{ .Release.Name }}
        run: {{ .Release.Name }}-taginfo-web
        "hpe-ezua/type": vendor-service
        "hpe-ezua/app": {{ .Chart.Name }}
    spec:
      {{- if .Values.taginfoWeb.serviceAccount.enabled }}
      serviceAccountName: {{ .Values.taginfoWeb.serviceAccount.name }}
      automountServiceAccountToken: true
      {{- end }}
      priorityClassName: {{ .Release.Name }}-{{ .Values.taginfoWeb.priorityClass | default "medium-priority" }}
{{ include "osm-seed.certsInitBlock" . | nindent 6 }}
      containers:
        - name: {{ .Chart.Name }}-taginfo-web
          image: "{{ .Values.taginfoWeb.image.name }}:{{ .Values.taginfoWeb.image.tag }}"
          command:
            - /bin/sh
            - -c
            - |
              /usr/src/app/start.sh web
          ports:
            - name: http
              containerPort: 4567
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          {{- if .Values.taginfoWeb.resources.enabled }}
          resources:
            {{- if .Values.taginfoWeb.resources.requests.enabled }}
            requests:
              memory: {{ .Values.taginfoWeb.resources.requests.memory }}
              cpu: {{ .Values.taginfoWeb.resources.requests.cpu }}
            {{- end }}
            {{- if .Values.taginfoWeb.resources.limits.enabled }}
            limits:
              memory: {{ .Values.taginfoWeb.resources.limits.memory }}
              cpu: {{ .Values.taginfoWeb.resources.limits.cpu }}
            {{- end }}
          {{- end }}
          env:
{{ include "osm-seed.proxyCertsEnv" . | nindent 12 }}
            {{- range $k, $v := .Values.taginfoWeb.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
{{ include "osm-seed.certsVolumeMountsBlock" . | nindent 10 }}
{{ include "osm-seed.certsVolumesBlock" . | nindent 6 }}
      {{- if .Values.taginfoWeb.nodeSelector.enabled }}
      nodeSelector:
        {{ .Values.taginfoWeb.nodeSelector.label_key }} : {{ .Values.taginfoWeb.nodeSelector.label_value }}
      {{- end }}
      {{- if .Values.taginfoWeb.nodeAffinity.enabled }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: {{ .Values.taginfoWeb.nodeAffinity.key }}
                    operator: In
                    values:
                    {{- range .Values.taginfoWeb.nodeAffinity.values }}
                      - {{ . | quote }}
                    {{- end }}
      {{- end }}
{{- end }}
