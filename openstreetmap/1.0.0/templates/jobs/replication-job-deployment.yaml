{{- if .Values.replicationJob.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-replication-job
  labels:
    app: {{ template "osm-seed.name" . }}
    component: replication-job
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
    "hpe-ezua/type": vendor-service
    "hpe-ezua/app": {{ .Chart.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ template "osm-seed.name" . }}
  template:
    metadata:
      labels:
        app: {{ template "osm-seed.name" . }}
        "hpe-ezua/type": vendor-service
        "hpe-ezua/app": {{ .Chart.Name }}
    spec:
      {{- if .Values.replicationJob.serviceAccount.enabled }}
      serviceAccountName: {{ .Values.replicationJob.serviceAccount.name }}
      automountServiceAccountToken: true
      {{- end }}
      priorityClassName: {{ .Release.Name }}-{{ .Values.replicationJob.priorityClass | default "high-priority" }}
{{ include "osm-seed.certsInitBlock" . | nindent 6 }}
      containers:
        - name: {{ .Release.Name }}-replication-job-deployment
          image: {{ .Values.replicationJob.image.name }}:{{ .Values.replicationJob.image.tag }}
          command: ['/start.sh']
          livenessProbe:
            exec:
              command:
              - /bin/bash
              - -c
              - /liveness.sh
            initialDelaySeconds: 60
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          {{- if .Values.replicationJob.resources.enabled }}
          resources:
            requests:
              memory: {{ .Values.replicationJob.resources.requests.memory }}
              cpu: {{ .Values.replicationJob.resources.requests.cpu }}
            limits:
              memory: {{ .Values.replicationJob.resources.limits.memory }}
              cpu: {{ .Values.replicationJob.resources.limits.cpu }}
          {{- end }}
          env:
{{ include "osm-seed.proxyCertsEnv" . | nindent 12 }}
            - name: POSTGRES_HOST
              value: {{ .Release.Name }}-db
            - name: POSTGRES_DB
              value: {{ .Values.db.env.POSTGRES_DB }}
            - name: POSTGRES_PASSWORD
              value: {{ quote .Values.db.env.POSTGRES_PASSWORD }}
            - name: POSTGRES_USER
              value: {{ .Values.db.env.POSTGRES_USER }}
            - name: POSTGRES_PORT
              value: {{ .Values.db.env.POSTGRES_PORT | quote}}
            - name: REPLICATION_FOLDER
              value: replication/minute
            - name: CLOUDPROVIDER
              value: {{ .Values.cloudProvider }}
            # MinIO / S3-compatible backend
            {{- if eq .Values.s3.provider "minio" }}
{{ include "osm-seed.s3Env" . | nindent 12 }}
            {{- else if eq .Values.cloudProvider "aws" }}
            # In case cloudProvider=aws
            - name: AWS_S3_BUCKET
              value: {{ .Values.AWS_S3_BUCKET }}
            {{- end }}
            # In case cloudProvider=gcp
            {{- if eq .Values.cloudProvider "gcp" }}
            - name: GCP_STORAGE_BUCKET
              value: {{ .Values.GCP_STORAGE_BUCKET }}
            {{- end }}
            # In case cloudProvider=azure
            {{- if eq .Values.cloudProvider "azure" }}
            - name: AZURE_STORAGE_ACCOUNT
              value: {{ .Values.AZURE_STORAGE_ACCOUNT }}
            - name: AZURE_CONTAINER_NAME
              value: {{ .Values.AZURE_CONTAINER_NAME }}
            - name: AZURE_STORAGE_CONNECTION_STRING
              value: {{ .Values.AZURE_STORAGE_CONNECTION_STRING }}
            {{- end }}
              # Memory optimization for osmosis
            {{- if .Values.replicationJob.resources.enabled }}
            - name: MEMORY_JAVACMD_OPTIONS
              value: {{ .Values.replicationJob.resources.requests.memory | default "2Gi" | quote}}
            {{- end }}
            - name: ENABLE_SEND_SLACK_MESSAGE
              value: {{ .Values.replicationJob.env.ENABLE_SEND_SLACK_MESSAGE | quote}}
            - name: SLACK_WEBHOOK_URL
              value: {{ .Values.replicationJob.env.SLACK_WEBHOOK_URL | quote}}
            - name: ENVIROMENT
              value: {{ .Values.environment | quote}}
{{ include "osm-seed.certsVolumeMountsBlock" . | nindent 10 }}
{{ include "osm-seed.certsVolumesBlock" . | nindent 6 }}
      {{- if .Values.replicationJob.nodeSelector.enabled }}
      nodeSelector:
        {{ .Values.replicationJob.nodeSelector.label_key }} : {{ .Values.replicationJob.nodeSelector.label_value }}
      {{- end }}
      # Affinity settings
      {{- if .Values.replicationJob.nodeAffinity.enabled }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: {{ .Values.replicationJob.nodeAffinity.key }}
                    operator: In
                    values:
                    {{- range .Values.replicationJob.nodeAffinity.values }}
                      - {{ . | quote }}
                    {{- end }}
      {{- end }}
{{- end }}