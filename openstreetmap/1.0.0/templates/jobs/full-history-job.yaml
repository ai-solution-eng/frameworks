{{- if .Values.fullHistory.enabled -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-full-history-job
  labels:
    app: {{ template "osm-seed.name" . }}
    component: full-history-job
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
    "hpe-ezua/type": vendor-service
    "hpe-ezua/app": {{ .Chart.Name }}
spec:
  schedule: {{ quote .Values.fullHistory.schedule }}
  startingDeadlineSeconds: 100
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 300
      template:
        metadata:
          labels:
            app: {{ template "osm-seed.name" . }}
            release: {{ .Release.Name }}
            "hpe-ezua/type": vendor-service
            "hpe-ezua/app": {{ .Chart.Name }}
        spec:
          {{- if .Values.fullHistory.serviceAccount.enabled }}
          serviceAccountName: {{ .Values.fullHistory.serviceAccount.name }}
          automountServiceAccountToken: true
          {{- end }}
{{ include "osm-seed.certsInitBlock" . | nindent 10 }}
          containers:
          - name: {{ .Release.Name }}-full-history-job
            image: {{ .Values.fullHistory.image.name }}:{{ .Values.fullHistory.image.tag }}
            command: ['/start.sh']
            {{- if .Values.fullHistory.resources.enabled }}   
            resources:
              requests:
                memory: {{ .Values.fullHistory.resources.requests.memory }}
                cpu: {{ .Values.fullHistory.resources.requests.cpu }}
              limits:
                memory: {{ .Values.fullHistory.resources.limits.memory }}
                cpu: {{ .Values.fullHistory.resources.limits.cpu }}
            {{- end }}
            env:
{{ include "osm-seed.proxyCertsEnv" . | nindent 14 }}
              - name: POSTGRES_HOST
                value: {{ .Release.Name }}-db
              - name: POSTGRES_DB
                value: {{ .Values.db.env.POSTGRES_DB }}
              - name: POSTGRES_PASSWORD
                value: {{ quote .Values.db.env.POSTGRES_PASSWORD }}
              - name: POSTGRES_USER
                value: {{ .Values.db.env.POSTGRES_USER }}
              - name: OVERWRITE_FHISTORY_FILE
                value: {{ .Values.fullHistory.env.OVERWRITE_FHISTORY_FILE | quote}}
              - name: CLOUDPROVIDER
                value: {{ .Values.cloudProvider }}
              - name: PLANET_EXPORT_METHOD
                value: {{ .Values.fullHistory.env.PLANET_EXPORT_METHOD | quote}}
              - name: DUMP_CLOUD_URL
                value: {{ if eq .Values.s3.provider "minio" }}{{ printf "s3://%s/db.dump" .Values.s3.minio.bucket | quote }}{{ else }}{{ .Values.fullHistory.env.DUMP_CLOUD_URL | quote }}{{ end }}
              - name: PLANET_EPOCH_DATE
                value: {{ .Values.fullHistory.env.PLANET_EPOCH_DATE | quote}}
              - name: PLANET_DUMP_NG_METADATA_URL
                value: {{ .Values.fullHistory.env.PLANET_DUMP_NG_METADATA_URL | quote}}
              # MinIO / S3-compatible backend
              {{- if eq .Values.s3.provider "minio" }}
{{ include "osm-seed.s3Env" . | nindent 14 }}
              {{- else if eq .Values.cloudProvider "aws" }}
              # In case cloudProvider=aws
              - name: AWS_S3_BUCKET
                value: {{ .Values.AWS_S3_BUCKET }}
              {{- end }}
              # In case cloudProvider=gcp
              {{- if eq .Values.cloudProvider "gcp" }}
              - name: GCP_STORAGE_BUCKET
                value: {{ .Values.GCP_STORAGE_BUCKET }}
              {{- end }}
            # In case cloudProvider=azure
            {{- if eq .Values.cloudProvider "azure" }}
            - name: AZURE_STORAGE_ACCOUNT
              value: {{ .Values.AZURE_STORAGE_ACCOUNT }}
            - name: AZURE_CONTAINER_NAME
              value: {{ .Values.AZURE_CONTAINER_NAME }}
            - name: AZURE_STORAGE_CONNECTION_STRING
              value: {{ .Values.AZURE_STORAGE_CONNECTION_STRING }}
            {{- end }}
              # Memory optimization for osmosis
              {{- if .Values.fullHistory.resources.enabled }}   
              - name: MEMORY_JAVACMD_OPTIONS
                value: {{ .Values.fullHistory.resources.requests.memory | default "2Gi" | quote}}
              {{- end }}
{{ include "osm-seed.certsVolumeMountsBlock" . | nindent 12 }}
          restartPolicy: OnFailure
{{ include "osm-seed.certsVolumesBlock" . | nindent 10 }}
          {{- if .Values.fullHistory.nodeSelector.enabled }}
          nodeSelector:
            {{ .Values.fullHistory.nodeSelector.label_key }} : {{ .Values.fullHistory.nodeSelector.label_value }}
          {{- end }}
          # Affinity settings
          {{- if .Values.fullHistory.nodeAffinity.enabled }}
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: {{ .Values.fullHistory.nodeAffinity.key }}
                        operator: In
                        values:
                        {{- range .Values.fullHistory.nodeAffinity.values }}
                          - {{ . | quote }}
                        {{- end }}
          {{- end }}
      backoffLimit: 3
{{- end }}