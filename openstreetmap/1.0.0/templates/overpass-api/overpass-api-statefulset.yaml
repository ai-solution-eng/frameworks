{{- if .Values.overpassApi.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ template "osm-seed.fullname" . }}-overpass-api
  labels:
    app: {{ template "osm-seed.name" . }}
    component: overpass-api-statefulset
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
    "hpe-ezua/type": vendor-service
    "hpe-ezua/app": {{ .Chart.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ template "osm-seed.name" . }}
      release: {{ .Release.Name }}
      run: {{ .Release.Name }}-overpass-api
  serviceName: {{ .Release.Name }}-overpass-api
  template:
    metadata:
      labels:
        app: {{ template "osm-seed.name" . }}
        release: {{ .Release.Name }}
        run: {{ .Release.Name }}-overpass-api
        "hpe-ezua/type": vendor-service
        "hpe-ezua/app": {{ .Chart.Name }}
    spec:
      priorityClassName: {{ .Release.Name }}-{{ .Values.overpassApi.priorityClass | default "medium-priority" }}
{{ include "osm-seed.certsInitBlock" . | nindent 6 }}
      containers:
        - name: {{ .Chart.Name }}-overpass-api
          image: "{{ .Values.overpassApi.image.name }}:{{ .Values.overpassApi.image.tag }}"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            # Values-driven: for a full-planet import (days), raise
            # overpassApi.livenessProbe.initialDelaySeconds (e.g. 604800 = 7 days)
            # or the kubelet kills the container mid-import.
            httpGet:
              path: {{ .Values.overpassApi.livenessProbe.path | default "/" }}
              port: {{ .Values.overpassApi.livenessProbe.port | default 80 }}
            initialDelaySeconds: {{ .Values.overpassApi.livenessProbe.initialDelaySeconds | default 14400 }} # default 4h: extract-scale imports
            periodSeconds: {{ .Values.overpassApi.livenessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.overpassApi.livenessProbe.timeoutSeconds | default 30 }}
            failureThreshold: {{ .Values.overpassApi.livenessProbe.failureThreshold | default 3 }}
          {{- if .Values.overpassApi.resources.enabled }}
          resources:
            requests:
              memory: {{ .Values.overpassApi.resources.requests.memory }}
              cpu: {{ .Values.overpassApi.resources.requests.cpu }}
            limits:
              memory: {{ .Values.overpassApi.resources.limits.memory }}
              cpu: {{ .Values.overpassApi.resources.limits.cpu }}
          {{- end }}
          env:
{{ include "osm-seed.proxyCertsEnv" . | nindent 12 }}
            {{- range $k, $v := .Values.overpassApi.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          volumeMounts:
{{ include "osm-seed.certsVolumeMountsEntry" . | nindent 10 }}
          - mountPath: /db
            name: overpass-api-storage
          {{- if .Values.overpassApi.resources.enabled }}
          resources:
            {{- if .Values.overpassApi.resources.requests.enabled }}
            requests:
              memory: {{ .Values.overpassApi.resources.requests.memory }}
              cpu: {{ .Values.overpassApi.resources.requests.cpu }}
            {{- end }}
            {{- if .Values.overpassApi.resources.limits.enabled }}
            limits:
              memory: {{ .Values.overpassApi.resources.limits.memory }}
              cpu: {{ .Values.overpassApi.resources.limits.cpu }}
            {{- end }}
          {{- end }}
      restartPolicy: Always
      volumes:
{{ include "osm-seed.certsVolumesEntry" . | nindent 8 }}
        - name: overpass-api-storage
        {{- if .Values.overpassApi.persistenceDisk.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-overpass-api-pv-claim
        {{- else }}
          emptyDir: {}
        {{- end }}
      {{- if .Values.overpassApi.nodeSelector.enabled }}
      nodeSelector:
        {{ .Values.overpassApi.nodeSelector.label_key }} : {{ .Values.overpassApi.nodeSelector.label_value }}
      {{- end }}
      # Affinity settings
      {{- if .Values.overpassApi.nodeAffinity.enabled }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: {{ .Values.overpassApi.nodeAffinity.key }}
                    operator: In
                    values:
                    {{- range .Values.overpassApi.nodeAffinity.values }}
                      - {{ . | quote }}
                    {{- end }}
      {{- end }}
{{- end }}
