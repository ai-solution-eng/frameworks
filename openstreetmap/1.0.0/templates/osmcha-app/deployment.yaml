{{- if .Values.osmchaApi.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-osmcha-app
  labels:
    app: {{ template "osm-seed.name" . }}
    component: osmcha-app-deployment
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
    "hpe-ezua/type": vendor-service
    "hpe-ezua/app": {{ .Chart.Name }}
spec:
  replicas: {{ .Values.osmchaApi.replicaCount }}
  selector:
    matchLabels:
      app: {{ template "osm-seed.name" . }}
      release: {{ .Release.Name }}
      run: {{ .Release.Name }}-osmcha-app
  template:
    metadata:
      labels:
        app: {{ template "osm-seed.name" . }}
        release: {{ .Release.Name }}
        run: {{ .Release.Name }}-osmcha-app
        "hpe-ezua/type": vendor-service
        "hpe-ezua/app": {{ .Chart.Name }}
    spec:
      initContainers:
{{ include "osm-seed.certsInitEntry" . | nindent 6 }}
      - name: osmcha-init
        image: "{{ .Values.osmchaApi.image.name }}:{{ .Values.osmchaApi.image.tag }}"
        command:
          - /bin/sh
          - -c
          - python manage.py migrate
          - python manage.py collectstatic --noinput
        env:
{{ include "osm-seed.proxyCertsEnv" . | nindent 10 }}
        envFrom:
        - configMapRef:
            name: {{ .Release.Name }}-osmcha-common-env
        volumeMounts:
{{ include "osm-seed.certsVolumeMountsEntry" . | nindent 8 }}
        - name: staticfiles
          mountPath: /app/staticfiles
      priorityClassName: {{ .Release.Name }}-{{ .Values.osmchaApi.priorityClass | default "medium-priority" }}
      containers:
      - name: osmcha-api
        image: "{{ .Values.osmchaApi.image.name }}:{{ .Values.osmchaApi.image.tag }}"
        env:
{{ include "osm-seed.proxyCertsEnv" . | nindent 10 }}
        args: ["gunicorn", "config.wsgi", "-b", "0.0.0.0:5000", "--access-logfile", "-", "--timeout", "120", "--workers", "4", "--threads", "16"]
        ports:
        - containerPort: 5000
        livenessProbe:
          # This osmcha-django build has no /api/v1/health route (404 → kubelet
          # kills the healthy gunicorn); use a process-level TCP check instead.
          tcpSocket:
            port: 5000
          initialDelaySeconds: 60
          timeoutSeconds: 30
          
        volumeMounts:
{{ include "osm-seed.certsVolumeMountsEntry" . | nindent 8 }}
        - name: staticfiles
          mountPath: /staticfiles
        envFrom:
        - configMapRef:
            name: {{ .Release.Name }}-osmcha-common-env
        {{- if .Values.osmchaApi.resources.enabled }}
        resources:
          requests:
            memory: {{ .Values.osmchaApi.resources.requests.memory }}
            cpu: {{ .Values.osmchaApi.resources.requests.cpu }}
          limits:
            memory: {{ .Values.osmchaApi.resources.limits.memory }}
            cpu: {{ .Values.osmchaApi.resources.limits.cpu }}
        {{- end }}

      - name: frontend-nginx
        image: "{{ .Values.osmchaWeb.image.name }}:{{ .Values.osmchaWeb.image.tag }}"
        ports:
        - containerPort: 80
        env:
{{ include "osm-seed.proxyCertsEnv" . | nindent 8 }}
        - name: BACKEND_URL
          value: http://localhost:5000
        volumeMounts:
{{ include "osm-seed.certsVolumeMountsEntry" . | nindent 10 }}
          - name: staticfiles
            mountPath: /srv/www/static/django
            readOnly: true
      - name: osmcha-redis
        image: "redis:latest"
        env:
{{ include "osm-seed.proxyCertsEnv" . | nindent 10 }}
{{ include "osm-seed.certsVolumeMountsBlock" . | nindent 8 }}
        ports:
        - containerPort: 6379
      volumes:
{{ include "osm-seed.certsVolumesEntry" . | nindent 8 }}
        - name: staticfiles
          emptyDir: {}
      {{- if .Values.osmchaApi.nodeSelector.enabled }}
      nodeSelector:
        {{ .Values.osmchaApi.nodeSelector.label_key }} : {{ .Values.osmchaApi.nodeSelector.label_value }}
      {{- end }}
      # Affinity settings
      {{- if .Values.osmchaApi.nodeAffinity.enabled }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: {{ .Values.osmchaApi.nodeAffinity.key }}
                    operator: In
                    values:
                    {{- range .Values.osmchaApi.nodeAffinity.values }}
                      - {{ . | quote }}
                    {{- end }}
      {{- end }}
{{- end }}

