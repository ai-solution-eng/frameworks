# ====================================================================================================
# Variables for tiler-db
# ====================================================================================================
tilerDb:
  enabled: true
  image:
    name: "developmentseed/osmseed-tiler-db"
    tag: "1.0.0-dev.hb293d54"
  priorityClass: "medium-priority"
  env:
    POSTGRES_HOST: tiler-db
    POSTGRES_DB: tiler-osm
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: "1234"
    POSTGRES_PORT: 5432
  persistenceDisk:
    enabled: true
    accessMode: ReadWriteOnce
    mountPath: /var/lib/postgresql/data
    subPath: postgresql-d
    # pvc mode: storageClassName empty => cluster default StorageClass
    storageClassName: ""
    size: 20Gi
    # k3s: staticHostPath=true uses a fixed hostPath dir (reusable across releases); false = dynamic local-path
    staticHostPath: false
    localVolumeHostPath: /mnt/tiler-db-data
    localVolumeSize: 10Gi
    # AWS
    AWS_ElasticBlockStore_volumeID: vol-0cf316caac04fc623
    AWS_ElasticBlockStore_size: 20Gi
  sharedMemorySize: 64Mi
  resources:
    enabled: false
    requests:
      enabled: false
      memory: "1Gi"
      cpu: "2"
    limits:
      enabled: false
      memory: "2Gi"
      cpu: "2"
  # To use postgresqlConfig, you need to have already $PGDATA set up in a persistent disk
  postgresqlConfig:
    enabled: false
    values: |
      listen_addresses = '*'
      max_connections = 100
      shared_buffers = 128MB
      effective_cache_size = 256MB
      maintenance_work_mem = 64MB
      checkpoint_completion_target = 0.7
      wal_buffers = 16MB
      default_statistics_target = 100
      random_page_cost = 1.1
      effective_io_concurrency = 200
      work_mem = 4MB
      min_wal_size = 80MB
      max_wal_size = 1GB
      max_worker_processes = 4
      max_parallel_workers_per_gather = 2
      max_parallel_workers = 4
  nodeSelector:
    enabled: false
    label_key: nodegroup_type
    label_value: web
  nodeAffinity:
    enabled: false
    key: "nodegroup_type"
    values: ["web"]

# ====================================================================================================
# Variables for tiler-imposm
# ====================================================================================================
tilerImposm:
  enabled: true
  image:
    name: "developmentseed/osmseed-tiler-imposm"
    tag: "1.0.0-dev.hb293d54"
  serviceAccount:
    # false by default on PCAI: the named SA (S3 access) is created outside this chart.
    enabled: false
    name: ohm-web-s3-bucket-access-staging
  priorityClass: "medium-priority"
  livenessProbe:
    enabled: true
    initialDelaySeconds: 43200
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  env:
    TILER_IMPORT_FROM: osm
    # Extract from BBBike (geofabrik blocks datacenter IPs); replication diffs from osm-fr.
    TILER_IMPORT_PBF_URL: https://data.bbbike.org/osm/pbf/region/europe/monaco.osm.pbf
    REPLICATION_URL: https://download.openstreetmap.fr/replication/europe/monaco/minute/   
    # TILER_IMPORT_PBF_URL: https://data.bbbike.org/osm/pbf/region/north-america/us/michigan.osm.pbf
    # REPLICATION_URL: https://download.openstreetmap.fr/replication/north-america/us-midwest/michigan/minute/
    SEQUENCE_NUMBER: "0"
    OVERWRITE_STATE: false
    UPLOAD_EXPIRED_FILES: true
    IMPORT_NATURAL_EARTH: true
    IMPORT_OSM_LAND: true
    IMPOSM3_IMPORT_LAYERS: all
    # Refresh/recreate materialized views during replication updates
    REFRESH_MVIEWS: false
    RECREATE_MVIEWS_ON_UPDATE: false
    # Upload of expired-tiles files needs CLOUDPROVIDER set (aws|gcp) + bucket/creds.
    # If CLOUDPROVIDER is unset the upload is skipped.
    CLOUDPROVIDER: aws
    AWS_S3_BUCKET: ""
    AWS_ACCESS_KEY_ID: ""
    AWS_SECRET_ACCESS_KEY: ""
  persistenceDisk:
    enabled: true
    accessMode: ReadWriteOnce
    mountPath: /mnt/data
    # pvc mode: storageClassName empty => cluster default StorageClass
    storageClassName: ""
    size: 50Gi
    # k3s: staticHostPath=true uses a fixed hostPath dir (reusable across releases); false = dynamic local-path
    staticHostPath: false
    localVolumeHostPath: /mnt/tiler-imposm-data
    localVolumeSize: 10Gi
    # AWS
    AWS_ElasticBlockStore_volumeID: vol-1234bcd
    AWS_ElasticBlockStore_size: 50Gi
  resources:
    enabled: false
    requests:
      enabled: false
      memory: "1Gi"
      cpu: "2"
    limits:
      enabled: false
      memory: "2Gi"
      cpu: "2"
  nodeSelector:
    enabled: false
    label_key: nodegroup_type
    label_value: web
  nodeAffinity:
    enabled: false
    key: "nodegroup_type"
    values: ["web"]
# ====================================================================================================
# Variables for tiler-server
# ====================================================================================================
tilerServer:
  enabled: true
  image:
    name: "developmentseed/osmseed-tiler-server"
    tag: "1.0.0-dev.hb293d54"
  priorityClass: "medium-priority"
  serviceAccount:
    # false by default on PCAI: the named SA (S3 access) is created outside this chart.
    enabled: false
    name: ohm-s3-bucket-access-staging
  replicaCount: 1
  serviceAnnotations: {}
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - tiler2.dev.openhistoricalmap.org
    tls:
      enabled: false
      secretName: ""
  env:
    TILER_SERVER_PORT: 9090
    # file cache => StatefulSet + local PVC (self-contained, works on PCAI without S3).
    # Switch to s3 for the Deployment variant + S3 tile cache.
    TILER_CACHE_TYPE: file
    TILER_CACHE_BASEPATH: /mnt/data
    TILER_CACHE_MAX_ZOOM: 22
    # in case s3
    TILER_CACHE_BUCKET: osmseed-tiler
