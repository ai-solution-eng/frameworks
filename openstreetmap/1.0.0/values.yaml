# ====================================================================================================
# Variables for overpass-api
# ====================================================================================================
overpassApi:
  enabled: true
  image:
    name: "developmentseed/osmseed-overpass-api"
    tag: "1.0.0-dev.hb293d54"
  priorityClass: "medium-priority"
  serviceAnnotations: {}
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - overpass-api.osmseed.org
    tls:
      enabled: false
      secretName: ""
  env:
    OVERPASS_META: "yes"
    OVERPASS_MODE: init
    # Geofabrik blocks datacenter IPs; BBBike region mirror (path: /osm/pbf/region/...).
    # The default OVERPASS_PLANET_PREPROCESS converts the downloaded .pbf into .osm.bz2.
    # For a FULL-PLANET import use: https://planet.openstreetmap.org/pbf/planet-latest.osm.pbf (~85GB)
    OVERPASS_PLANET_URL: https://data.bbbike.org/osm/pbf/region/europe/monaco.osm.pbf
    OVERPASS_DIFF_URL: https://download.openstreetmap.fr/replication/europe/monaco/minute/
    
    # OVERPASS_PLANET_URL: https://data.bbbike.org/osm/pbf/region/north-america/us/michigan.osm.pbf
    # OVERPASS_DIFF_URL: https://download.openstreetmap.fr/replication/north-america/us-midwest/michigan/minute/
    OVERPASS_RULES_LOAD: 10
    OVERPASS_PLANET_PREPROCESS: 'mv /db/planet.osm.bz2 /db/planet.osm.pbf && osmium
      cat -o /db/planet.osm.bz2 /db/planet.osm.pbf && rm /db/planet.osm.pbf'
    OVERPASS_REPLICATION_SEQUENCE_NUMBER: 7276553
    OVERPASS_ALLOW_DUPLICATE_QUERIES: "yes"
  # Liveness: 12h budget suits a Michigan/extract import. For a full-planet
  # import (multi-day), raise initialDelaySeconds (e.g. 604800 = 7 days) or the
  # kubelet kills the container mid-import.
  livenessProbe:
    path: "/"
    port: 80
    initialDelaySeconds: 43200
    periodSeconds: 10
    timeoutSeconds: 30
    failureThreshold: 3
  persistenceDisk:
    enabled: true
    accessMode: ReadWriteOnce
    mountPath: /db
    # pvc mode: storageClassName empty => cluster default StorageClass
    storageClassName: ""
    size: 50Gi
    # k3s: staticHostPath=true uses a fixed hostPath dir (reusable across releases); false = dynamic local-path
    staticHostPath: false
    localVolumeHostPath: /mnt/overpass-api-db-data
    localVolumeSize: 10Gi
    # AWS
    AWS_ElasticBlockStore_volumeID: vol-1234bcd
    AWS_ElasticBlockStore_size: 50Gi
  resources:
    enabled: false
    requests:
      enabled: false
      memory: "1Gi"
      cpu: "2"
    limits:
      enabled: false
      memory: "2Gi"
      cpu: "2"
  nodeSelector:
    enabled: false
    label_key: nodegroup_type
    label_value: web
  nodeAffinity:
    enabled: false
    key: "nodegroup_type"
    values: ["web"]
