# Image group version: https://github.com/orgs/osm-seed/packages
osmSeedVersion: v1
environment: development

# ====================================================================================================
# HPE Private Cloud AI (PCAI) exposure via the EzUA gateway.
# ${DOMAIN_NAME} is substituted by PCAI at import time — keep it verbatim.
# ====================================================================================================
ezua:
  domainName: "${DOMAIN_NAME}"
  # Application endpoint served through the platform gateway
  virtualService:
    endpoint: "openstreetmap.${DOMAIN_NAME}"
    istioGateway: "istio-system/ezaf-gateway"
    # Destination Service (short name) and port the VirtualService routes to.
    # Empty destinationService defaults to the OSM web UI/API (<release>-service-web).
    destinationService: ""
    destinationPort: 80
  # oauth2-proxy backed AuthorizationPolicy for the endpoint
  # enabled: false serves the app ANONYMOUSLY through the gateway (verified on
  # dc15: no gateway default-deny without the policy). Set true to require SSO.
  authorizationPolicy:
    namespace: "istio-system"
    providerName: "oauth2-proxy"
    enabled: false

# ====================================================================================================
# Object storage (S3) configuration.
# provider "minio" (default): a dedicated MinIO server is deployed as part of THIS release
#   (StatefulSet + PVC + Service + bucket-creation hook job) — fully self-contained, no
#   dependency on any pre-existing MinIO app in the cluster. Consumers get the in-chart
#   endpoint automatically (http://<release>-minio.<ns>.svc.cluster.local:9000).
# provider "aws": use real AWS S3 — no MinIO is deployed; components use their own AWS_* env
#   values (upstream behavior).
# NOTE: tiler-cache requires AWS SQS, which MinIO cannot provide — keep tilerCache.enabled=false
#       when using MinIO. The image scripts still expect CLOUDPROVIDER=aws for any S3-compatible
#       backend — do not change it for MinIO.
# ====================================================================================================
s3:
  provider: minio
  minio: # the bundled MinIO server (deployed when provider=minio)
    image:
      name: "quay.io/minio/minio"
      tag: "RELEASE.2025-07-23T15-54-02Z"
    mcImage:
      name: "quay.io/minio/mc"
      tag: "RELEASE.2025-08-13T08-35-41Z"  
  
    bucket: "openstreetmap"
    region: "us-east-1"
    # Also used as MINIO_ROOT_USER / MINIO_ROOT_PASSWORD of the bundled server,
    # so server and consumers can never drift. Rotate for anything beyond a demo.
    accessKey: "djwzHyQxSXjXQ7hWAEJu"
    secretKey: "pkOJHe5EJZqq2VxPWqBPaUCkVXYe3IViIDSxPdR6"
    persistenceDisk:
      enabled: true
      size: 20Gi
      storageClassName: "" # empty => cluster default StorageClass
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"
    priorityClass: "medium-priority"


# Where to deploy: aws, gcp, azure, k3s, pvc
# "pvc" is the generic Kubernetes mode used on HPE PCAI: standalone PersistentVolumeClaims
# provisioned by the cluster's default StorageClass (see each component's persistenceDisk).
cloudProvider: pvc
# Cloud storage bucket for the provider set above
AWS_S3_BUCKET: s3://osm-seed

# Service type: NodePort, ClusterIP or LoadBalancer. ClusterIP is recommended;
serviceType: ClusterIP

# Create a cert-manager ClusterIssuer (Let's Encrypt). Opt-in.
createClusterIssuer: false

# Default ingress class for all components. Override per component with
# <component>.ingress.className. Leave empty if you expose services another way.
ingressClassName: ""

# Base domain. Components default to <name>.<domain>, e.g. web.osmseed.org.
domain: osmseed.org

# Email for Let's Encrypt expiry notices.
adminEmail: admin@osmseed.org

# ====================================================================================================
# Web Api Database
# ====================================================================================================

db:
  enabled: true
  image:
    name: "developmentseed/osmseed-db"
    tag: "1.0.0-dev.hb293d54"
  priorityClass: "high-priority"
  env:
    POSTGRES_DB: openstreetmap
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: "1234"
    PGDATA: /var/lib/postgresql/data/pgdata
    ENVIRONMENT: "production"
  persistenceDisk:
    enabled: true
    mountPath: /var/lib/postgresql/data
    subPath: postgresql-db
    # pvc mode: storageClassName empty => cluster default StorageClass
    storageClassName: ""
    size: 50Gi
    # k3s (local-path dynamic / static hostPath)
    localVolumeHostPath: /mnt/db-data
    localVolumeSize: 10Gi
    # AWS
    AWS_ElasticBlockStore_volumeID: vol-06a278f66b15d4b3c
    AWS_ElasticBlockStore_size: 50Gi
  resources:
    enabled: false
    requests:
      enabled: false
      memory: "1Gi"
      cpu: "2"
    limits:
      enabled: false
      memory: "2Gi"
      cpu: "2"
  nodeSelector:
    enabled: false
  sharedMemorySize: 64Mi
  # To use postgresqlConfig, you need to have already $PGDATA set up
  postgresqlConfig:
    enabled: false
    values: |
      listen_addresses = '*'
      max_connections = 100
      shared_buffers = 128MB
      effective_cache_size = 256MB
      maintenance_work_mem = 64MB
      checkpoint_completion_target = 0.7
      wal_buffers = 16MB
      default_statistics_target = 100
      random_page_cost = 1.1
      effective_io_concurrency = 200
      work_mem = 4MB
      min_wal_size = 80MB
      max_wal_size = 1GB
      max_worker_processes = 4
      max_parallel_workers_per_gather = 2
      max_parallel_workers = 4
  nodeAffinity:
    enabled: false
    key: "nodegroup_type"
    values: ["database"]
# ====================================================================================================
# Variables for osm-seed website
# ====================================================================================================
web:
  enabled: true
  image:
    name: "ghcr.io/osm-seed/web"
    tag: "0.1.0-0.dev.git.998.h9d7a9f9"
  serviceAccount:
    # false by default on PCAI: the named SA (S3 access) is created outside this chart.
    enabled: false
    name: ohm-web-s3-bucket-access-staging
  priorityClass: "high-priority"
  replicaCount: 1
  serviceAnnotations: {}
  # Per-component Ingress. enabled toggles creation; className falls back to the
  # global ingressClassName; annotations are passed verbatim (provider-specific
  # lives here); hosts default to web/api/apex of domain; tls is opt-in.
  ingress:
    enabled: false
    className: ""
    hosts:
      - www.osmseed.org
      - dev.osmseed.org
      - api.osmseed.org
    annotations: {}
    tls:
      enabled: false
      secretName: ""
  env:
    SERVER_URL: "www.osmseed.org"
    SERVER_PROTOCOL: "https"
    MAILER_ADDRESS: smtp.gmail.com
    MAILER_DOMAIN: gmail.com
    MAILER_USERNAME: example@gmail.com
    MAILER_PASSWORD: "1234"
    MAILER_FROM: no-reply@example.com
    MAILER_PORT: 25
    NOMINATIM_URL: "nominatim"
    OVERPASS_URL: "overpassApi"
    OAUTH_CLIENT_ID: "abcd" # Create client ID and key as OAuth2 Application
    OAUTH_KEY: "xyz"
    ORGANIZATION_NAME: "OSMSeed"
    WEBSITE_STATUS: "online"
    API_TIMEOUT: 30
    WEB_TIMEOUT: 30
    # Empty = keep the image's build-time dummy credentials (the start.sh only
    # overwrites config/master.key + credentials.yml.enc when RAILS_MASTER_KEY is
    # non-empty; placeholder strings like "none" corrupt them and Rails fails to
    # boot with MessageEncryptor::InvalidMessage). For production, generate a real
    # pair: RAILS_MASTER_KEY = key content, RAILS_CREDENTIALS_YML_ENC = encrypted
    # credentials produced with that same key.
    RAILS_MASTER_KEY: ""
    RAILS_CREDENTIALS_YML_ENC: ""
    RAILS_LOG_LEVEL: info
    RAILS_STORAGE_SERVICE: local
    RAILS_STORAGE_REGION: us-east-1
    RAILS_STORAGE_BUCKET: osmseed-website-bucket
    PASSENGER_MAX_POOL_SIZE: 6
    OPENSTREETMAP_AUTH_ID: ""
    OPENSTREETMAP_AUTH_SECRET: ""
  resources:
    enabled: false
    requests:
      enabled: false
      memory: "1Gi"
      cpu: "2"
    limits:
      enabled: false
      memory: "2Gi"
      cpu: "2"
  nodeSelector:
    enabled: false
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 6
    cpuUtilization:
      enable: false
      value: 85
    memoryUtilization:
      enable: false
      value: 85
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 60
        policyValue: 100
        periodSeconds: 60
      scaleDown:
        stabilizationWindowSeconds: 60
        policyValue: 50
        periodSeconds: 60
  sharedMemorySize: 256Mi
  livenessProbeExec: true

  nodeAffinity:
    # Upstream expects nodes labeled nodegroup_type=web; PCAI clusters don't
    # carry those labels, so affinity would leave the web pod Pending forever.
    enabled: false
    key: "nodegroup_type"
    values: ["web"]
  podAntiAffinity: # To set that no two pods are scheduled on the same node
    enabled: false
# ====================================================================================================
# Variables for memcached. Memcached is used to store session cookies
# ====================================================================================================
memcached:
  enabled: true
  priorityClass: "high-priority"
  resources:
    enabled: false
