    UPDATE_MODE: continuous #Options: `continuous`/`once`/`catch-up`/`none` (default: `none`)
    OSMSEED_WEB_API_DOMAIN: www.openstreetmap.org
    # Public host the UI calls for the Nominatim API. Should match ingress.hosts[0].
