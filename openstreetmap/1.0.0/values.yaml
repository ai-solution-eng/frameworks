# ====================================================================================================
# Variables for osm-seed database backup and restore
# ====================================================================================================
dbBackupRestore:
  image:
    name: "developmentseed/osmseed-backup-restore"
    tag: "1.0.0-dev.hb293d54"
  cronjobs:
    - name: web-db
      serviceAccount:
        enabled: true
        name: ohm-web-s3-bucket-access-staging
      enabled: false
      schedule: "* * * * *"
      env:
        # DB action: backup/restore
        DB_ACTION: backup
        # Naming backup files
        SET_DATE_AT_NAME: true
        BACKUP_CLOUD_FOLDER: database/web-db
        BACKUP_CLOUD_FILE: osmseed-api-web-db
        AWS_S3_BUCKET: secure-bucket
        # Replication stream read at backup time to store the seqno next to the dump.
        # Generic OSM default; deployments override it with their own stream.
        MINUTE_REPLICATION_URL: https://planet.openstreetmap.org/replication/minute
        # Clean up backups options
        CLEANUP_BACKUPS: true
        RETENTION_DAYS: "30"
      resources:
        enabled: false
        requests:
          enabled: false
          memory: "1Gi"
          cpu: "2"
        limits:
          enabled: false
          memory: "2Gi"
          cpu: "2"
      nodeSelector:
        enabled: false
        label_key: nodegroup_type
        label_value: web
      nodeAffinity:
        enabled: false
        key: "nodegroup_type"
        values: ["web"]
    - name: osmcha-db
      enabled: false
      serviceAccount:
        enabled: true
        name: ohm-web-s3-bucket-access-staging
      schedule: "* * * * *"
      env:
        # DB action: backup/restore
        DB_ACTION: backup
        # Naming backup files
        SET_DATE_AT_NAME: true
        BACKUP_CLOUD_FOLDER: database/osmcha-db
        BACKUP_CLOUD_FILE: osmseed-osmcha-db
        AWS_S3_BUCKET: secure-bucket
        # Clean up backups options
        CLEANUP_BACKUPS: true
        RETENTION_DAYS: "30"
      resources:
        enabled: false
        requests:
          enabled: false
          memory: "1Gi"
          cpu: "2"
        limits:
          enabled: false
          memory: "2Gi"
          cpu: "2"
      nodeSelector:
        enabled: false
        label_key: nodegroup_type
        label_value: web
      nodeAffinity:
        enabled: false
        key: "nodegroup_type"
        values: ["web"]
