apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-toolkit.fullname" . }}
  labels:
    {{- include "ai-toolkit.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ai-toolkit.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "ai-toolkit.labels" . | nindent 8 }}
        hpe-ezua/app: {{ .Chart.Name }}
        hpe-ezua/component: {{ .Chart.Name }}
        hpe-ezua/type: vendor-service
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ai-toolkit.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.persistence.data.enabled .Values.persistence.config.enabled }}
      initContainers:
        - name: init-persistence
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              {{- if .Values.persistence.data.enabled }}
              # Seed the SQLite database the first time only. Its schema is applied
              # at image build time (prisma db push); the runtime start command does
              # not create it, so an empty volume would leave the app with no tables.
              if [ ! -f /mnt/data/aitk_db.db ]; then
                echo "Seeding aitk_db.db into data volume..."
                cp -a /app/ai-toolkit/aitk_db.db /mnt/data/aitk_db.db
              fi
              {{- end }}
              {{- if .Values.persistence.config.enabled }}
              # Seed the bundled example configs the first time only.
              if [ -z "$(ls -A /mnt/config 2>/dev/null)" ]; then
                echo "Seeding default config into config volume..."
                cp -a /app/ai-toolkit/config/. /mnt/config/ 2>/dev/null || true
              fi
              {{- end }}
          volumeMounts:
            {{- if .Values.persistence.data.enabled }}
            - name: data
              mountPath: /mnt/data
            {{- end }}
            {{- if .Values.persistence.config.enabled }}
            - name: config
              mountPath: /mnt/config
            {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.persistence.data.enabled .Values.persistence.datasets.enabled .Values.persistence.output.enabled .Values.persistence.config.enabled .Values.persistence.huggingface.enabled .Values.volumeMounts }}
          volumeMounts:
            {{- if .Values.persistence.data.enabled }}
            - name: data
              mountPath: /app/ai-toolkit/aitk_db.db
              subPath: aitk_db.db
            {{- end }}
            {{- if .Values.persistence.datasets.enabled }}
            - name: datasets
              mountPath: /app/ai-toolkit/datasets
            {{- end }}
            {{- if .Values.persistence.output.enabled }}
            - name: output
              mountPath: /app/ai-toolkit/output
            {{- end }}
            {{- if .Values.persistence.config.enabled }}
            - name: config
              mountPath: /app/ai-toolkit/config
            {{- end }}
            {{- if .Values.persistence.huggingface.enabled }}
            - name: huggingface
              mountPath: /root/.cache/huggingface/hub
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.persistence.data.enabled .Values.persistence.datasets.enabled .Values.persistence.output.enabled .Values.persistence.config.enabled .Values.persistence.huggingface.enabled .Values.volumes }}
      volumes:
        {{- if .Values.persistence.data.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "ai-toolkit.fullname" . }}-data
        {{- end }}
        {{- if .Values.persistence.datasets.enabled }}
        - name: datasets
          persistentVolumeClaim:
            claimName: {{ include "ai-toolkit.fullname" . }}-datasets
        {{- end }}
        {{- if .Values.persistence.output.enabled }}
        - name: output
          persistentVolumeClaim:
            claimName: {{ include "ai-toolkit.fullname" . }}-output
        {{- end }}
        {{- if .Values.persistence.config.enabled }}
        - name: config
          persistentVolumeClaim:
            claimName: {{ include "ai-toolkit.fullname" . }}-config
        {{- end }}
        {{- if .Values.persistence.huggingface.enabled }}
        - name: huggingface
          persistentVolumeClaim:
            claimName: {{ include "ai-toolkit.fullname" . }}-huggingface
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
