{{- if .Values.worker.enabled }}
{{- $ctx := dict "ctx" . "component" "worker" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "argilla.fullname" . }}-worker
  labels:
    {{- include "argilla.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "argilla.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "argilla.podLabels" $ctx | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: argilla-worker
          image: "{{ .Values.argilla.image.repository }}:{{ .Values.argilla.image.tag }}"
          imagePullPolicy: {{ .Values.argilla.image.pullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              {{- include "argilla.waitFor" . | nindent 14 }}
              exec python -m argilla_server worker --num-workers "${BACKGROUND_NUM_WORKERS}"
          env:
            {{- include "argilla.commonEnv" . | nindent 12 }}
            - name: BACKGROUND_NUM_WORKERS
              value: {{ .Values.worker.numWorkers | quote }}
            {{- with .Values.argilla.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: home
              mountPath: {{ .Values.argilla.persistence.mountPath }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        # Metadata lives in PostgreSQL, so the worker only needs a scratch home dir.
        - name: home
          emptyDir: {}
      {{- with .Values.argilla.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.argilla.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
