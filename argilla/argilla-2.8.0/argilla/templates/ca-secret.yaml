{{- if and .Values.ezua.sso.enabled (not .Values.ezua.sso.caCert.secretName) }}
{{- $pem := include "argilla.caPem" . }}
{{- if $pem }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "argilla.fullname" . }}-ca
  labels:
    {{- include "argilla.labels" (dict "ctx" . "component" "server") | nindent 4 }}
type: Opaque
stringData:
  ca.crt: |
    {{- $pem | trim | nindent 4 }}
{{- end }}
{{- end }}
