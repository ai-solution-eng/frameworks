{{- $fullname := include "argilla.fullname" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "argilla.labels" (dict "ctx" . "component" "server") | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.argilla.auth.existingSecret }}
  username: {{ .Values.argilla.auth.username | quote }}
  password: {{ include "argilla.secretValue" (dict "ctx" . "secret" $fullname "key" "password" "value" .Values.argilla.auth.password "length" 16) | quote }}
  api-key: {{ include "argilla.secretValue" (dict "ctx" . "secret" $fullname "key" "api-key" "value" .Values.argilla.auth.apiKey "length" 32) | quote }}
  auth-secret-key: {{ include "argilla.secretValue" (dict "ctx" . "secret" $fullname "key" "auth-secret-key" "value" .Values.argilla.auth.secretKey "length" 48) | quote }}
  {{- end }}
  {{- if .Values.postgresql.enabled }}
  {{- $pgPassword := include "argilla.secretValue" (dict "ctx" . "secret" $fullname "key" "postgres-password" "value" .Values.postgresql.password "length" 24) }}
  postgres-password: {{ $pgPassword | quote }}
  database-url: {{ printf "postgresql+asyncpg://%s:%s@%s:5432/%s" .Values.postgresql.username $pgPassword (include "argilla.postgresql.fullname" .) .Values.postgresql.database | quote }}
  {{- else if and .Values.externalDatabase.url (not .Values.externalDatabase.existingSecret) }}
  {{- /* Argilla rewrites "postgresql" -> "postgresql+asyncpg" with a global re.sub, which also
         mangles hostnames containing "postgresql". Pass the asyncpg scheme explicitly. */}}
  database-url: {{ regexReplaceAll "^postgres(ql)?(\\+psycopg2)?://" .Values.externalDatabase.url "postgresql+asyncpg://" | quote }}
  {{- end }}
  {{- if .Values.ezua.sso.enabled }}
  oauth.yaml: |
    allow_http_redirect: {{ .Values.ezua.sso.allowHttpRedirect }}
    providers:
      - name: keycloak
        client_id: {{ .Values.ezua.oidc.client_id | quote }}
        client_secret: {{ .Values.ezua.oidc.client_secret | quote }}
        redirect_uri: {{ printf "https://%s/oauth/keycloak/callback" .Values.ezua.virtualService.endpoint | quote }}
    {{- with .Values.ezua.sso.allowedWorkspaces }}
    allowed_workspaces:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
