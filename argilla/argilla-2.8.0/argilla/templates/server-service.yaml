{{- $ctx := dict "ctx" . "component" "server" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "argilla.fullname" . }}
  labels:
    {{- include "argilla.labels" $ctx | nindent 4 }}
spec:
  type: {{ .Values.argilla.service.type }}
  selector:
    {{- include "argilla.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.argilla.service.port }}
      targetPort: http
      protocol: TCP
