{{- if ne .Values.ezua.authorizationPolicy.providerName "oauth2-proxy" }}
{{- fail (printf "ezua.authorizationPolicy.providerName must be \"oauth2-proxy\" (got %q). Istio allows one CUSTOM provider per workload and all PCAI tiles on the ingress gateway use oauth2-proxy; a different provider makes the gateway deny ALL traffic." .Values.ezua.authorizationPolicy.providerName) }}
{{- end }}
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ printf "%s-%s-auth-policy" .Release.Name .Chart.Name }}
  namespace: {{ .Values.ezua.authorizationPolicy.namespace | required ".Values.ezua.authorizationPolicy.namespace is required !\n" }}
  labels:
    {{- include "argilla.labels" (dict "ctx" . "component" "server") | nindent 4 }}
spec:
  action: CUSTOM
  provider:
    name: {{ .Values.ezua.authorizationPolicy.providerName | required ".Values.ezua.authorizationPolicy.providerName is required !\n" }}
  rules:
    - to:
        - operation:
            hosts:
            - {{ .Values.ezua.virtualService.endpoint | required ".Values.ezua.virtualService.endpoint is required !\n" }}
  selector:
    {{- with .Values.ezua.authorizationPolicy.matchLabels }}
    matchLabels:
      {{- toYaml . | nindent 6 }}
    {{- end }}
