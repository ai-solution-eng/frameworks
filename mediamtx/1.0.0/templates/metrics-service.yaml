{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mediamtx.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mediamtx.labels" . | nindent 4 }}
    {{- include "mediamtx.ezuaLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "mediamtx.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
{{- end }}