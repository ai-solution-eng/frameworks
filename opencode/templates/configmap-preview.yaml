    tbody tr.selected { background: var(--bg-active); }
    .file-icon { width: 18px; display: inline-block; text-align: center; }
    .file-name { font-weight: 500; }
    .file-size, .file-mtime, .file-mode { color: var(--text-muted); font-size: 12px; }
    th input[type="checkbox"], td input[type="checkbox"] { cursor: pointer; }
    .empty-state {
