apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-preview-config
  namespace: {{ .Release.Namespace }}
  labels:
    hpe-ezua/type: vendor-service
    hpe-ezua/app: {{ .Chart.Name }}
data:
  nginx.conf: |
    worker_processes 1;
    events {
      worker_connections 1024;
    }
    http {
      map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
      }
      server {
        listen 8082;
        server_name _;

        set $target_port "";

        if ($host ~* '^u-[a-f0-9]{12}-p-([0-9]{4,5})\.{{ include "opencode-web.escapeDomain" .Values.previewDomain }}$') {
          set $target_port $1;
        }
        if ($target_port = "") {
          return 404;
        }
        if ($target_port !~ '^[1-9][0-9]{3,4}$') {
          return 403;
        }
        location / {
          proxy_pass http://127.0.0.1:$target_port;
          proxy_http_version 1.1;
          proxy_set_header Host 127.0.0.1:$target_port;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_buffering off;
          proxy_read_timeout 660s;
          proxy_send_timeout 660s;
        }
      }
    }
  port_watcher.mjs: |
    import fs from 'node:fs/promises'
    import path from 'node:path'

    const domain = process.env.PREVIEW_DOMAIN_SUFFIX || '{{ .Values.previewDomain }}'
    const userSlug = process.env.PREVIEW_USER_SLUG || 'shared'
    const stateFile = process.env.PREVIEW_STATE_FILE || '/var/opencode/state/preview-ports.txt'
    const minPort = Number(process.env.PREVIEW_MIN_PORT || '3000')
    const maxPort = Number(process.env.PREVIEW_MAX_PORT || '9999')
    const exclude = new Set(
      (process.env.PREVIEW_EXCLUDE_PORTS || '4096,8082,7681')
        .split(',')
        .map((value) => Number(value.trim()))
        .filter((value) => Number.isInteger(value)),
    )

    function url(port) {
      return `https://u-${userSlug}-p-${port}.${domain}`
    }

    async function broadcast(message) {
      const line = `\r\n${message}\r\n`
      try {
        const entries = await fs.readdir('/dev/pts')
        await Promise.all(
          entries
            .filter((entry) => /^\d+$/.test(entry))
            .map((entry) => fs.writeFile(`/dev/pts/${entry}`, line, { flag: 'a' }).catch(() => {})),
        )
      } catch {
        // Ignore PTY broadcast failures.
      }
    }

    async function listPorts(path) {
      try {
        const content = await fs.readFile(path, 'utf8')
        return content
          .split('\n')
          .slice(1)
          .flatMap((line) => {
            const parts = line.trim().split(/\s+/)
            if (parts.length < 4 || parts[3] !== '0A') return []
            const address = parts[1] || ''
            const portHex = address.split(':').pop()
            if (!portHex) return []
            const port = Number.parseInt(portHex, 16)
            if (exclude.has(port) || port < minPort || port > maxPort) return []
            return [port]
          })
      } catch {
        return []
      }
    }

    async function previewPorts() {
      const ports = new Set()
      for (const path of ['/proc/net/tcp', '/proc/net/tcp6']) {
        for (const port of await listPorts(path)) {
          ports.add(port)
        }
      }
      return ports
    }

    async function writeState(ports) {
      await fs.mkdir(path.dirname(stateFile), { recursive: true })
      const content = [...ports].sort((left, right) => left - right).map((port) => `${port} ${url(port)}`).join('\n')
      await fs.writeFile(stateFile, content ? `${content}\n` : '', 'utf8')
    }

    let seen = new Set()

    async function tick() {
      const current = await previewPorts()
      const currentPorts = [...current].sort((left, right) => left - right)
      const seenPorts = [...seen].sort((left, right) => left - right)

      for (const port of currentPorts) {
        if (!seen.has(port)) {
          const message = `[preview] Preview available for port ${port}: ${url(port)}`
          console.log(message)
          await broadcast(message)
        }
      }

      for (const port of seenPorts) {
        if (!current.has(port)) {
          const message = `[preview] Preview closed for port ${port}: ${url(port)}`
          console.log(message)
          await broadcast(message)
        }
      }

      if (currentPorts.join(',') !== seenPorts.join(',')) {
        await writeState(current)
        seen = current
      }
    }

    await tick()
    setInterval(() => {
      tick().catch((error) => console.error('[preview] watcher failed', error))
    }, 3000)
  preview-url: |
    #!/bin/sh
    DOMAIN="${PREVIEW_DOMAIN_SUFFIX:-'{{ .Values.previewDomain }}'}"
    STATE_FILE="${PREVIEW_STATE_FILE:-/var/opencode/state/preview-ports.txt}"
    USER_SLUG="${PREVIEW_USER_SLUG:-shared}"

    if [ "$#" -gt 1 ]; then
      echo "usage: preview-url [port]" >&2
      exit 1
    fi

    if [ "$#" -eq 1 ]; then
      case "$1" in
        ''|*[!0-9]*)
          echo "port must be numeric" >&2
          exit 1
          ;;
      esac
      echo "https://u-$USER_SLUG-p-$1.$DOMAIN"
      exit 0
    fi

    if [ -s "$STATE_FILE" ]; then
      cat "$STATE_FILE"
      exit 0
    fi

    echo "No active preview ports detected."
  opencode_supervisor.mjs: |
    import { spawn } from 'node:child_process'
    import fs from 'node:fs'
    import net from 'node:net'
    import path from 'node:path'

    const primaryConfigPath = process.env.OPENCODE_CONFIG || process.env.OPENCODE_CONFIG_PATH || '/var/opencode/home/.config/opencode/opencode.json'
    const configDir = path.dirname(primaryConfigPath)
    const watchedConfigFiles = [
      ...new Set(
        (process.env.OPENCODE_WATCH_CONFIG_FILES || 'opencode.json,config.json,opencode.jsonc')
          .split(',')
          .map((value) => value.trim())
          .filter(Boolean)
          .concat(path.basename(primaryConfigPath)),
      ),
    ]
    const watchedConfigDirs = [
      ...new Set(
        (process.env.OPENCODE_WATCH_CONFIG_DIRS || 'skills,agents')
          .split(',')
          .map((value) => value.trim())
          .filter(Boolean),
      ),
    ]
    const webPort = Number(process.env.OPENCODE_WEB_PORT || '4096')
    const webHost = process.env.OPENCODE_WEB_HOST || '0.0.0.0'
    const portCheckHost = process.env.OPENCODE_WEB_CHECK_HOST || '127.0.0.1'
    const opencodeArgs = ['--print-logs', 'web', '--port', String(webPort), '--hostname', webHost]

    let child = null
    let restartTimer = null
    let restartInProgress = false
    let stopping = false
    let lastConfigSignature = readConfigSignature()
    let restartBackoffMs = 1000

    function readConfigSignature() {
      const signature = {}
      for (const file of watchedConfigFiles) {
        const filePath = path.join(configDir, file)
        try {
          const stat = fs.statSync(filePath)
          signature[`file:${file}`] = `${stat.mtimeMs}:${stat.size}`
        } catch {
          signature[`file:${file}`] = 'missing'
        }
      }
      for (const dir of watchedConfigDirs) {
        signature[`dir:${dir}`] = readDirectorySignature(path.join(configDir, dir))
      }
      return signature
    }

    function readDirectorySignature(dirPath) {
      const entries = []

      function walk(currentPath, relativePath = '') {
        let dirEntries = []
        try {
          dirEntries = fs.readdirSync(currentPath, { withFileTypes: true })
        } catch {
          entries.push(`${relativePath || '.'}:missing`)
          return
        }

        for (const entry of dirEntries) {
          const entryRelativePath = relativePath ? `${relativePath}/${entry.name}` : entry.name
          const entryPath = path.join(currentPath, entry.name)

          if (entry.isDirectory()) {
            entries.push(`${entryRelativePath}/:dir`)
            walk(entryPath, entryRelativePath)
            continue
          }

          if (!entry.isFile()) continue

          try {
            const stat = fs.statSync(entryPath)
            entries.push(`${entryRelativePath}:${stat.mtimeMs}:${stat.size}`)
          } catch {
            entries.push(`${entryRelativePath}:missing`)
          }
        }
      }

      walk(dirPath)
      return entries.sort().join('|') || 'empty'
    }

    function changedConfigFiles(nextSignature) {
      const keys = new Set([...Object.keys(nextSignature), ...Object.keys(lastConfigSignature)])
      return [...keys]
        .filter((key) => nextSignature[key] !== lastConfigSignature[key])
        .map((key) => key.replace(/^file:/, '').replace(/^dir:/, ''))
    }

    function isPrimaryConfigValid() {
      try {
        JSON.parse(fs.readFileSync(primaryConfigPath, 'utf8'))
        return true
      } catch (error) {
        console.error(`[opencode] skipping restart: ${primaryConfigPath} is invalid JSON: ${error.message}`)
        return false
      }
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms))
    }

    function isPortOpen() {
      return new Promise((resolve) => {
        const socket = net.createConnection({ host: portCheckHost, port: webPort })
        const finish = (open) => {
          socket.removeAllListeners()
          socket.destroy()
          resolve(open)
        }

        socket.setTimeout(500)
        socket.once('connect', () => finish(true))
        socket.once('timeout', () => finish(false))
        socket.once('error', () => finish(false))
      })
    }

    function listeningSocketInodes(port) {
      const inodes = new Set()
      const portHex = port.toString(16).toUpperCase().padStart(4, '0')

      for (const procFile of ['/proc/net/tcp', '/proc/net/tcp6']) {
        try {
          const lines = fs.readFileSync(procFile, 'utf8').split('\n').slice(1)
          for (const line of lines) {
            const parts = line.trim().split(/\s+/)
            const localAddress = parts[1] || ''
            const state = parts[3]
            const inode = parts[9]
            const localPortHex = localAddress.split(':').pop()?.toUpperCase()
            if (state === '0A' && localPortHex === portHex && inode) {
              inodes.add(inode)
            }
          }
        } catch {}
      }

      return inodes
    }

    function processCommand(pid) {
      try {
        const command = fs.readFileSync(`/proc/${pid}/cmdline`, 'utf8').replace(/\0/g, ' ').trim()
        if (command) return command
      } catch {}

      try {
        return fs.readFileSync(`/proc/${pid}/comm`, 'utf8').trim()
      } catch {
        return ''
      }
    }

    function portOwnerProcesses(port) {
      const inodes = listeningSocketInodes(port)
      if (inodes.size === 0) return []

      const owners = []
      let procEntries = []
      try {
        procEntries = fs.readdirSync('/proc', { withFileTypes: true })
      } catch {
        return owners
      }

      for (const entry of procEntries) {
        if (!entry.isDirectory() || !/^\d+$/.test(entry.name)) continue

        const pid = Number(entry.name)
        if (pid === process.pid) continue

        const fdDir = `/proc/${pid}/fd`
        try {
          for (const fd of fs.readdirSync(fdDir)) {
            const target = fs.readlinkSync(path.join(fdDir, fd))
            const match = target.match(/^socket:\[(\d+)\]$/)
            if (match && inodes.has(match[1])) {
              owners.push({ pid, command: processCommand(pid) })
              break
            }
          }
        } catch {}
      }

      return owners
    }

    function canKillPortOwner(owner) {
      const command = owner.command.toLowerCase()
      if (!command) return false
      if (command.includes('opencode_supervisor') || command.includes('port_watcher')) return false
      if (command.includes('opencode')) return true
      if ((command.includes('node') || command.includes('bun')) && command.includes(`--port ${webPort}`)) return true
      return false
    }

    function signalPortOwners(signal) {
      const owners = portOwnerProcesses(webPort)
      const eligible = owners.filter(canKillPortOwner)

      if (owners.length > 0) {
        console.log(
          `[opencode] port ${webPort} owners: ${owners
            .map((owner) => `${owner.pid} ${owner.command || '<unknown>'}`)
            .join('; ')}`,
        )
      }

      for (const owner of eligible) {
        try {
          console.log(`[opencode] sending ${signal} to port ${webPort} owner pid=${owner.pid}`)
          process.kill(owner.pid, signal)
        } catch (error) {
          console.error(`[opencode] failed to signal port ${webPort} owner pid=${owner.pid}`, error)
        }
      }

      return eligible.length
    }

    async function cleanupPortOwner() {
      const signaled = signalPortOwners('SIGTERM')
      if (signaled === 0) return

      await sleep(2000)
      if (await isPortOpen()) {
        signalPortOwners('SIGKILL')
        await sleep(500)
      }
    }

    async function waitForPortFree(timeoutMs = 30000, cleanupOwners = false) {
      const start = Date.now()
      let cleanupAttempted = false
      let lastLogAt = 0

      while (await isPortOpen()) {
        const elapsed = Date.now() - start
        if (cleanupOwners && !cleanupAttempted && elapsed >= timeoutMs) {
          console.log(`[opencode] port ${webPort} is still busy after ${timeoutMs}ms; checking for orphaned web process`)
          cleanupAttempted = true
          await cleanupPortOwner()
        } else if (elapsed >= timeoutMs && Date.now() - lastLogAt >= 10000) {
          console.log(`[opencode] port ${webPort} is still busy after ${timeoutMs}ms; waiting`)
          lastLogAt = Date.now()
        }
        await sleep(500)
      }
    }

    function signalProcessGroup(proc, signal) {
      try {
        process.kill(-proc.pid, signal)
      } catch {
        try {
          proc.kill(signal)
        } catch {}
      }
    }

    async function startOpencode() {
      await waitForPortFree(30000, true)
      if (stopping || child) return

      console.log('[opencode] starting web process')
      const proc = spawn('/usr/local/bin/opencode', opencodeArgs, {
        detached: true,
        stdio: 'inherit',
        env: process.env,
      })
      child = proc

      proc.on('exit', (code, signal) => {
        if (child === proc) child = null
        if (!stopping && !restartInProgress) {
          const delay = restartBackoffMs
          restartBackoffMs = Math.min(restartBackoffMs * 2, 15000)
          console.log(`[opencode] web process exited code=${code} signal=${signal}; restarting in ${delay}ms`)
          setTimeout(() => {
            startOpencode().catch((error) => console.error('[opencode] restart failed', error))
          }, delay)
        }
      })

      setTimeout(() => {
        if (child === proc) restartBackoffMs = 1000
      }, 10000)
    }

    function stopOpencode() {
      return new Promise((resolve) => {
        if (!child) {
          resolve()
          return
        }

        const proc = child
        let done = false
        const finish = async () => {
          if (done) return
          done = true
          clearTimeout(timeout)
          if (child === proc) child = null
          await waitForPortFree(30000, true)
          resolve()
        }

        const timeout = setTimeout(() => {
          signalProcessGroup(proc, 'SIGKILL')
        }, 8000)

        proc.once('exit', finish)

        try {
          signalProcessGroup(proc, 'SIGTERM')
        } catch {
          finish()
        }
      })
    }

    function scheduleRestart(reason) {
      if (stopping) return
      clearTimeout(restartTimer)
      restartTimer = setTimeout(async () => {
        if (restartInProgress) return
        restartInProgress = true
        console.log(`[opencode] ${reason}; restarting web process`)
        await stopOpencode()
        if (!stopping) await startOpencode()
        restartInProgress = false
      }, 750)
    }

    function maybeRestart() {
      const nextSignature = readConfigSignature()
      const changedFiles = changedConfigFiles(nextSignature)
      if (changedFiles.length === 0) return
      lastConfigSignature = nextSignature
      if (!isPrimaryConfigValid()) return
      scheduleRestart(`config changed: ${changedFiles.join(', ')}`)
    }

    try {
      fs.watch(configDir, (_event, filename) => {
        const changedFile = filename?.toString()
        if (!changedFile || watchedConfigFiles.includes(changedFile)) {
          setTimeout(() => maybeRestart(), 250)
        }
      })
    } catch (error) {
      console.error('[opencode] config watch setup failed', error)
    }

    setInterval(() => maybeRestart(), 3000)

    async function shutdown(signal) {
      stopping = true
      clearTimeout(restartTimer)
      console.log(`[opencode] received ${signal}; stopping web process`)
      await stopOpencode()
      process.exit(0)
    }

    process.on('SIGINT', () => shutdown('SIGINT'))
    process.on('SIGTERM', () => shutdown('SIGTERM'))

    startOpencode().catch((error) => console.error('[opencode] start failed', error))

  data_manager.mjs: |
    import http from 'node:http'
    import fs from 'node:fs'
    import fsp from 'node:fs/promises'
    import path from 'node:path'
    import { spawn } from 'node:child_process'
    
    const PORT = parseInt(process.env.DATA_MANAGER_PORT || '7682', 10)
    const HOST = '0.0.0.0'
    const BASE = '/data_manager'
    const MAX_TEXT_SIZE = 5 * 1024 * 1024
    const MAX_UPLOAD_SIZE = parseInt(process.env.DATA_MANAGER_MAX_UPLOAD_MB || '1024', 10) * 1024 * 1024
    
    const ROOTS = [
      { key: 'personal', label: 'Personal', path: '/workspace/personal', navigable: true, shared: false },
      { key: 'shared', label: 'Shared', path: '/workspace/shared', navigable: true, shared: true },
      { key: 'state', label: 'State', path: '/var/opencode', navigable: false, shared: false },
    ]
    
    const NAVIGABLE_ROOTS = ROOTS.filter((r) => r.navigable)
    const NAVIGABLE_PATHS = NAVIGABLE_ROOTS.map((r) => r.path)
    
    let storageCache = null
    let storageCacheTime = 0
    const STORAGE_CACHE_MS = 2000
    
    function json(res, code, data) {
      res.writeHead(code, { 'content-type': 'application/json' })
      res.end(JSON.stringify(data))
    }
    
    function sendError(res, code, msg) {
      json(res, code, { error: msg })
    }
    
    async function resolveSafe(inputPath) {
      if (!inputPath || typeof inputPath !== 'string') return null
      const resolved = path.resolve(inputPath)
      const underRoot = NAVIGABLE_PATHS.some(
        (rp) => resolved === rp || resolved.startsWith(rp + path.sep),
      )
      if (!underRoot) return null
      try {
        const real = await fsp.realpath(resolved)
        const realSafe = NAVIGABLE_PATHS.some(
          (rp) => real === rp || real.startsWith(rp + path.sep),
        )
        return realSafe ? real : null
      } catch {
        try {
          const parentReal = await fsp.realpath(path.dirname(resolved))
          const parentSafe = NAVIGABLE_PATHS.some(
            (rp) => parentReal === rp || parentReal.startsWith(rp + path.sep),
          )
          return parentSafe ? resolved : null
        } catch {
          return null
        }
      }
    }
    
    function formatBytes(bytes) {
      if (bytes === 0) return '0 B'
      const units = ['B', 'KB', 'MB', 'GB', 'TB']
      const i = Math.floor(Math.log(bytes) / Math.log(1024))
      return (bytes / Math.pow(1024, i)).toFixed(i > 0 ? 1 : 0) + ' ' + units[i]
    }
    
    function parseMultipart(body, boundary) {
      const parts = []
      const boundaryBuf = Buffer.from('--' + boundary)
      let pos = body.indexOf(boundaryBuf)
      if (pos === -1) return parts
      pos += boundaryBuf.length
    
      while (pos < body.length) {
        if (body[pos] === 0x2d && body[pos + 1] === 0x2d) break
        if (body[pos] === 0x0d && body[pos + 1] === 0x0a) pos += 2
    
        const headerEnd = body.indexOf(Buffer.from('\r\n\r\n'), pos)
        if (headerEnd === -1) break
    
        const headerStr = body.slice(pos, headerEnd).toString('utf8')
        pos = headerEnd + 4
    
        const nextBoundary = body.indexOf(Buffer.from('\r\n--' + boundary), pos)
        if (nextBoundary === -1) break
    
        const partData = body.slice(pos, nextBoundary)
    
        const headers = {}
        for (const line of headerStr.split('\r\n')) {
          const idx = line.indexOf(':')
          if (idx > 0) {
            headers[line.slice(0, idx).trim().toLowerCase()] = line.slice(idx + 1).trim()
          }
        }
    
        const cd = headers['content-disposition'] || ''
        const nameMatch = cd.match(/name="([^"]+)"/)
        const filenameMatch = cd.match(/filename="([^"]*)"/)
    
        parts.push({
          name: nameMatch ? nameMatch[1] : null,
          filename: filenameMatch ? filenameMatch[1] : null,
          contentType: headers['content-type'] || 'application/octet-stream',
          data: partData,
        })
    
        pos = nextBoundary + 2 + boundaryBuf.length
      }
    
      return parts
    }
    
    async function handleRoots(req, res) {
      json(res, 200, NAVIGABLE_ROOTS.map((r) => ({
        key: r.key,
        label: r.label,
        path: r.path,
        shared: r.shared,
      })))
    }
    
    async function handleList(req, res, url) {
      const dirPath = url.searchParams.get('path') || NAVIGABLE_PATHS[0]
      const safePath = await resolveSafe(dirPath)
      if (!safePath) {
        sendError(res, 403, 'Forbidden path')
        return
      }
      try {
        const stat = await fsp.stat(safePath)
        if (!stat.isDirectory()) {
          sendError(res, 400, 'Not a directory')
          return
        }
        const entries = await fsp.readdir(safePath, { withFileTypes: true })
        const items = await Promise.all(
          entries
            .filter((e) => !e.name.startsWith('.'))
            .map(async (e) => {
              try {
                const full = path.join(safePath, e.name)
                const s = await fsp.stat(full)
                return {
                  name: e.name,
                  type: e.isDirectory() ? 'dir' : 'file',
                  size: s.size,
                  mtime: s.mtime.toISOString(),
                  mode: s.mode,
                  ext: e.isFile() ? path.extname(e.name).slice(1).toLowerCase() : '',
                }
              } catch {
                return { name: e.name, type: e.isDirectory() ? 'dir' : 'file', size: 0, mtime: null, mode: 0, ext: '' }
              }
            }),
        )
        items.sort((a, b) => {
          if (a.type !== b.type) return a.type === 'dir' ? -1 : 1
          return a.name.localeCompare(b.name)
        })
        json(res, 200, { path: safePath, entries: items })
      } catch (err) {
        sendError(res, 500, err.message)
      }
    }
    
    async function handleDownload(req, res, url) {
      const filePath = url.searchParams.get('path')
      const customName = url.searchParams.get('name')
      const safePath = await resolveSafe(filePath)
      if (!safePath) {
        sendError(res, 403, 'Forbidden path')
        return
      }
      try {
        const stat = await fsp.stat(safePath)
        if (!stat.isFile()) {
          sendError(res, 400, 'Not a file')
          return
        }
        const filename = customName || path.basename(safePath)
        res.writeHead(200, {
          'content-type': 'application/octet-stream',
          'content-length': stat.size,
          'content-disposition': 'attachment; filename="' + filename.replace(/"/g, '\\"') + '"',
        })
        fs.createReadStream(safePath).pipe(res)
      } catch (err) {
        sendError(res, 500, err.message)
      }
    }
    
    async function handleArchive(req, res, body) {
      const selectedPaths = body.paths
      const format = body.format || 'tar.gz'
      const archiveName = (body.name || 'archive').replace(/[^a-zA-Z0-9._-]/g, '_')
    
      if (!Array.isArray(selectedPaths) || selectedPaths.length === 0) {
        sendError(res, 400, 'No paths specified')
        return
      }
    
      const safePaths = []
      for (const p of selectedPaths) {
        const safe = await resolveSafe(p)
        if (!safe) {
          sendError(res, 403, 'Forbidden path: ' + p)
          return
        }
        safePaths.push(safe)
      }
    
      const root = NAVIGABLE_ROOTS.find((r) =>
        safePaths.every((p) => p === r.path || p.startsWith(r.path + path.sep)),
      )
      if (!root) {
        sendError(res, 400, 'Cannot archive files from different roots')
        return
      }
    
      const relPaths = safePaths.map((p) => path.relative(root.path, p))
      const ext = format === 'tar.gz' ? '.tar.gz' : '.zip'
      const contentType = format === 'tar.gz' ? 'application/gzip' : 'application/zip'
    
      res.writeHead(200, {
        'content-type': contentType,
        'content-disposition': 'attachment; filename="' + archiveName + ext + '"',
      })
    
      const cmd = format === 'tar.gz'
        ? spawn('tar', ['czf', '-', ...relPaths], { cwd: root.path })
        : spawn('zip', ['-rq', '-', ...relPaths], { cwd: root.path })
    
      cmd.stdout.pipe(res)
      cmd.stderr.on('data', (d) => console.error('[data_manager] archive stderr:', d.toString()))
      cmd.on('error', (err) => {
        console.error('[data_manager] archive error:', err)
        if (!res.writableEnded) res.end()
      })
      cmd.on('close', () => {
        if (!res.writableEnded) res.end()
      })
    }
    
    async function handleUpload(req, res, url) {
      const targetPath = url.searchParams.get('path')
      const safePath = await resolveSafe(targetPath)
      if (!safePath) {
        sendError(res, 403, 'Forbidden path')
        return
      }
    
      const contentType = req.headers['content-type'] || ''
      const boundaryMatch = contentType.match(/boundary=(?:"([^"]+)"|([^;]+))/)
      if (!boundaryMatch) {
        sendError(res, 400, 'Missing multipart boundary')
        return
      }
    
      const boundary = boundaryMatch[1] || boundaryMatch[2]
      const contentLength = parseInt(req.headers['content-length'] || '0', 10)
      if (contentLength > MAX_UPLOAD_SIZE) {
        sendError(res, 413, 'Upload too large')
        return
      }
    
      const chunks = []
      let totalSize = 0
      for await (const chunk of req) {
        totalSize += chunk.length
        if (totalSize > MAX_UPLOAD_SIZE) {
          sendError(res, 413, 'Upload too large')
          return
        }
        chunks.push(chunk)
      }
      const body = Buffer.concat(chunks)
      const parts = parseMultipart(body, boundary)
      const uploaded = []
    
      for (const part of parts) {
        if (!part.filename) continue
        const filePath = path.join(safePath, part.filename)
        const safeFilePath = await resolveSafe(filePath)
        if (!safeFilePath) {
          uploaded.push({ name: part.filename, error: 'Forbidden path' })
          continue
        }
        await fsp.mkdir(path.dirname(safeFilePath), { recursive: true })
        await fsp.writeFile(safeFilePath, part.data)
        uploaded.push({ name: part.filename, size: part.data.length })
      }
    
      json(res, 200, { uploaded })
    }
    
    async function handleRead(req, res, url) {
      const filePath = url.searchParams.get('path')
      const safePath = await resolveSafe(filePath)
      if (!safePath) {
        sendError(res, 403, 'Forbidden')
        return
      }
      try {
        const stat = await fsp.stat(safePath)
        if (!stat.isFile()) {
          sendError(res, 400, 'Not a file')
          return
        }
        if (stat.size > MAX_TEXT_SIZE) {
          json(res, 200, { tooLarge: true, size: stat.size })
          return
        }
        const fd = await fsp.open(safePath, 'r')
        const probeSize = Math.min(8192, stat.size)
        const probe = Buffer.alloc(probeSize)
        await fd.read(probe, 0, probeSize, 0)
        await fd.close()
        if (probe.includes(0)) {
          json(res, 200, { binary: true, size: stat.size })
          return
        }
        const content = await fsp.readFile(safePath, 'utf8')
        json(res, 200, { content, size: stat.size })
      } catch (err) {
        sendError(res, 500, err.message)
      }
    }
    
    async function handleWrite(req, res, url, body) {
      const filePath = url.searchParams.get('path')
      const safePath = await resolveSafe(filePath)
      if (!safePath) {
        sendError(res, 403, 'Forbidden')
        return
      }
      try {
        await fsp.mkdir(path.dirname(safePath), { recursive: true })
        const tmpPath = safePath + '.tmp-' + Date.now()
        await fsp.writeFile(tmpPath, body.content || '', 'utf8')
        await fsp.rename(tmpPath, safePath)
        json(res, 200, { ok: true, path: safePath })
      } catch (err) {
        sendError(res, 500, err.message)
      }
    }
    
    async function handleMkdir(req, res, body) {
      const dirPath = body.path
      const safePath = await resolveSafe(dirPath)
      if (!safePath) {
        sendError(res, 403, 'Forbidden')
        return
      }
      try {
        await fsp.mkdir(safePath, { recursive: true })
        json(res, 200, { ok: true, path: safePath })
      } catch (err) {
        sendError(res, 500, err.message)
      }
    }
    
    async function handleDelete(req, res, body) {
      const paths = body.paths
      if (!Array.isArray(paths) || paths.length === 0) {
        sendError(res, 400, 'No paths specified')
        return
      }
      const deleted = []
      for (const p of paths) {
        const safe = await resolveSafe(p)
        if (!safe) {
          deleted.push({ path: p, error: 'Forbidden' })
          continue
        }
        try {
          await fsp.rm(safe, { recursive: true })
          deleted.push({ path: p, ok: true })
        } catch (err) {
          deleted.push({ path: p, error: err.message })
        }
      }
      json(res, 200, { deleted })
    }
    
    async function handleRename(req, res, body) {
      const from = body.from
      const to = body.to
      const safeFrom = await resolveSafe(from)
      const safeTo = await resolveSafe(to)
      if (!safeFrom || !safeTo) {
        sendError(res, 403, 'Forbidden')
        return
      }
      try {
        await fsp.mkdir(path.dirname(safeTo), { recursive: true })
        await fsp.rename(safeFrom, safeTo)
        json(res, 200, { ok: true, from: safeFrom, to: safeTo })
      } catch (err) {
        sendError(res, 500, err.message)
      }
    }
    
    async function handleStorage(req, res) {
      const now = Date.now()
      if (storageCache && now - storageCacheTime < STORAGE_CACHE_MS) {
        json(res, 200, storageCache)
        return
      }
      const results = []
      for (const root of ROOTS) {
        try {
          const stats = await fsp.statfs(root.path)
          const total = stats.blocks * stats.bsize
          const free = stats.bfree * stats.bsize
          const available = stats.bavail * stats.bsize
          const used = total - free
          const percent = total > 0 ? Math.round((used / total) * 100) : 0
          const inodesTotal = stats.files
          const inodesFree = stats.ffree
          const inodesUsed = inodesTotal - inodesFree
          const inodesPercent = inodesTotal > 0 ? Math.round((inodesUsed / inodesTotal) * 100) : 0
          results.push({
            key: root.key,
            label: root.label,
            path: root.path,
            navigable: root.navigable,
            shared: root.shared,
            total,
            used,
            available,
            free,
            percent,
            inodesTotal,
            inodesUsed,
            inodesFree,
            inodesPercent,
          })
        } catch (err) {
          results.push({
            key: root.key,
            label: root.label,
            path: root.path,
            navigable: root.navigable,
            shared: root.shared,
            error: err.message,
          })
        }
      }
      storageCache = results
      storageCacheTime = now
      json(res, 200, results)
    }
    
    function loadSpaHtml() {
      try {
        return fs.readFileSync('/opt/preview/data_manager.html', 'utf8')
      } catch {
        return '<!DOCTYPE html><html><body><h1>Data Manager</h1><p>SPA file not found. Ensure data_manager.html is mounted.</p></body></html>'
      }
    }
    
    let spaHtml = null
    
    async function handleRequest(req, res) {
      const url = new URL(req.url, 'http://internal')
      const pathname = url.pathname
    
      if (!pathname.startsWith(BASE)) {
        sendError(res, 404, 'Not found')
        return
      }
    
      const subPath = pathname.slice(BASE.length)
    
      if (subPath === '' || subPath === '/' || subPath === '/index.html') {
        if (!spaHtml) spaHtml = loadSpaHtml()
        res.writeHead(200, { 'content-type': 'text/html; charset=utf-8' })
        res.end(spaHtml)
        return
      }
    
      if (subPath === '/api/healthz') {
        json(res, 200, { ok: true })
        return
      }
    
      if (subPath === '/api/roots' && req.method === 'GET') {
        return handleRoots(req, res)
      }
    
      if (subPath === '/api/list' && req.method === 'GET') {
        return handleList(req, res, url)
      }
    
      if (subPath === '/api/download' && req.method === 'GET') {
        return handleDownload(req, res, url)
      }
    
      if (subPath === '/api/archive' && req.method === 'POST') {
        const chunks = []
        for await (const chunk of req) chunks.push(chunk)
        const body = JSON.parse(Buffer.concat(chunks).toString())
        return handleArchive(req, res, body)
      }
    
      if (subPath === '/api/upload' && req.method === 'POST') {
        return handleUpload(req, res, url)
      }
    
      if (subPath === '/api/read' && req.method === 'GET') {
        return handleRead(req, res, url)
      }
    
      if (subPath === '/api/write' && req.method === 'PUT') {
        const chunks = []
        for await (const chunk of req) chunks.push(chunk)
        const body = JSON.parse(Buffer.concat(chunks).toString())
        return handleWrite(req, res, url, body)
      }
    
      if (subPath === '/api/mkdir' && req.method === 'POST') {
        const chunks = []
        for await (const chunk of req) chunks.push(chunk)
        const body = JSON.parse(Buffer.concat(chunks).toString())
        return handleMkdir(req, res, body)
      }
    
      if (subPath === '/api/delete' && req.method === 'POST') {
        const chunks = []
        for await (const chunk of req) chunks.push(chunk)
        const body = JSON.parse(Buffer.concat(chunks).toString())
        return handleDelete(req, res, body)
      }
    
      if (subPath === '/api/rename' && req.method === 'POST') {
        const chunks = []
        for await (const chunk of req) chunks.push(chunk)
        const body = JSON.parse(Buffer.concat(chunks).toString())
        return handleRename(req, res, body)
      }
    
      if (subPath === '/api/storage' && req.method === 'GET') {
        return handleStorage(req, res)
      }
    
      sendError(res, 404, 'Not found: ' + subPath)
    }
    
    const server = http.createServer(handleRequest)
    server.listen(PORT, HOST, () => {
      console.log('[data_manager] listening on ' + HOST + ':' + PORT)
    })
    
  data_manager.html: |
    <!DOCTYPE html>
