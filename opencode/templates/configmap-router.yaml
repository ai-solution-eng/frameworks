      <label style="display:flex;align-items:center;gap:6px;margin-top:6px;"><input type="checkbox" id="p-show" style="width:auto;"> show password</label>
      <button id="create">Create user</button>
      <div class="msg" id="create-msg"></div>
    </div>

    <div class="card">
      <h2>Users</h2>
      <div id="list" class="empty">Loading&hellip;</div>
    </div>

    <div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);align-items:center;justify-content:center;z-index:20;">
      <div class="card" style="max-width:380px;width:100%;">
        <h2 id="modal-title"></h2>
        <label id="modal-label" style="display:none;">New username</label>
        <input id="modal-username" type="text" style="display:none;">
        <label id="modal-pass-label" style="display:none;">New password</label>
        <input id="modal-pass" type="password" style="display:none;">
        <label id="modal-pass-show-wrap" style="display:none;align-items:center;gap:6px;margin-top:6px;"><input type="checkbox" id="modal-pass-show" style="width:auto;"> show password</label>
        <div class="msg err" id="modal-msg"></div>
        <button id="modal-ok">OK</button>
        <button id="modal-cancel">Cancel</button>
      </div>
    </div>

    <script>
    var listEl = document.getElementById('list');
    var pollTimer = null;
    var modalMode = null;
    var modalUser = null;
    function msg(id, text, ok) {
      var el = document.getElementById(id);
      el.style.display = 'block';
      el.className = 'msg ' + (ok ? 'ok' : 'err');
      el.textContent = text;
      if (ok) setTimeout(function () { el.style.display = 'none'; }, 2500);
    }
    async function api(path, method, body) {
      var res = await fetch(path, { method: method || 'GET', headers: { 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
      var data = null; try { data = await res.json(); } catch (e) {}
      if (res.status >= 400) throw new Error((data && data.error) || ('Error ' + res.status));
      return data;
    }
    function openModal(mode, username) {
      modalMode = mode;
      modalUser = username;
      var isReset = mode === 'reset';
      document.getElementById('modal-title').textContent = (isReset ? 'Reset password' : 'Rename') + ' for ' + username;
      document.getElementById('modal-msg').style.display = 'none';
      document.getElementById('modal-username').style.display = isReset ? 'none' : 'block';
      document.getElementById('modal-label').style.display = isReset ? 'none' : 'block';
      document.getElementById('modal-pass-label').style.display = isReset ? 'block' : 'none';
      document.getElementById('modal-pass').style.display = isReset ? 'block' : 'none';
      document.getElementById('modal-pass-show').checked = false;
      document.getElementById('modal-pass').type = 'password';
      document.getElementById('modal-pass-show-wrap').style.display = isReset ? 'flex' : 'none';
      document.getElementById('modal-username').value = '';
      document.getElementById('modal-pass').value = '';
      document.getElementById('modal').style.display = 'flex';
    }
    function closeModal() {
      document.getElementById('modal').style.display = 'none';
      modalMode = null;
      modalUser = null;
    }
    document.getElementById('modal-cancel').addEventListener('click', closeModal);
    document.getElementById('modal-pass-show').addEventListener('change', function () {
      document.getElementById('modal-pass').type = this.checked ? 'text' : 'password';
    });
    document.getElementById('modal-ok').addEventListener('click', async function () {
      if (!modalMode || !modalUser) return;
      var btn = document.getElementById('modal-ok');
      btn.disabled = true;
      try {
        if (modalMode === 'reset') {
          var pass = document.getElementById('modal-pass').value;
          if (!pass) throw new Error('password required');
          await api('/__oc_admin/api/reset-password', 'POST', { username: modalUser, password: pass });
        } else {
          var nu = document.getElementById('modal-username').value.trim();
          if (!nu) throw new Error('new username required');
          await api('/__oc_admin/api/rename', 'POST', { username: modalUser, newUsername: nu });
        }
        closeModal();
        await loadUsers();
      } catch (e) {
        var me = document.getElementById('modal-msg');
        me.style.display = 'block';
        me.textContent = e.message;
      } finally {
        btn.disabled = false;
      }
    });
    async function loadUsers() {
      try {
        var data = await api('/__oc_admin/api/users');
        var users = data.users || [];
        if (users.length === 0) {
          listEl.innerHTML = '<div class="empty">No users.</div>';
          syncPoll(users);
          return;
        }
        listEl.innerHTML = '<table><thead><tr><th>Username</th><th>Slug</th><th>Status</th><th></th></tr></thead><tbody>' +
          users.map(function (u) {
            return '<tr><td>' + u.username + '</td><td><code>' + u.slug + '</code></td><td>' + statusHtml(u) + '</td>' +
              '<td style="white-space:nowrap;">' +
              '<button data-act="rename" data-u="' + u.username + '" style="padding:6px 10px;font-size:12px;margin-right:6px;">Rename</button>' +
              '<button data-act="reset" data-u="' + u.username + '" style="padding:6px 10px;font-size:12px;margin-right:6px;">Reset</button>' +
              '<button class="danger" data-act="delete" data-u="' + u.username + '" style="padding:6px 10px;font-size:12px;">Delete</button>' +
              '</td></tr>';
          }).join('') + '</tbody></table>';
        syncPoll(users);
        listEl.querySelectorAll('button[data-u]').forEach(function (b) {
          b.addEventListener('click', async function () {
            var u = b.getAttribute('data-u');
            var act = b.getAttribute('data-act');
            if (act === 'rename') { openModal('rename', u); return; }
            if (act === 'reset') { openModal('reset', u); return; }
            b.disabled = true;
            b.innerHTML = '&hellip;';
            try { await api('/__oc_admin/api/delete', 'POST', { username: u }); } catch (e) { alert(e.message); }
            await loadUsers();
          });
        });
      } catch (e) {
        listEl.innerHTML = '<div class="empty">' + e.message + '</div>';
      }
    }
    function statusHtml(u) {
      if (u.ready) return '<span class="ready">&#10003; ready</span>';
      if (u.exists) return '<span class="spinner"></span>creating&hellip;';
      return '<span class="none-dot">&mdash;</span>';
    }
    function syncPoll(users) {
      var anyCreating = users.some(function (u) { return u.exists && !u.ready; });
      if (anyCreating && !pollTimer) pollTimer = setInterval(loadUsers, 4000);
      else if (!anyCreating && pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }
    document.getElementById('p-show').addEventListener('change', function () {
      document.getElementById('p').type = this.checked ? 'text' : 'password';
    });
    document.getElementById('create').addEventListener('click', async function () {
      var btn = document.getElementById('create');
      var u = document.getElementById('u').value.trim();
      var p = document.getElementById('p').value;
      if (!u || !p) { msg('create-msg', 'username and password required', false); return; }
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Creating&hellip;';
      try {
        await api('/__oc_admin/api/create', 'POST', { username: u, password: p });
        msg('create-msg', 'created ' + u, true);
        document.getElementById('u').value = '';
        document.getElementById('p').value = '';
        document.getElementById('p-show').checked = false;
        document.getElementById('p').type = 'password';
        await loadUsers();
      } catch (e) {
        msg('create-msg', e.message, false);
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Create user';
      }
    });
    loadUsers();
    </script>
    </body>
    </html>`
    }

    function serveAdminPage(response) {
      response.writeHead(200, {
        'content-type': 'text/html; charset=utf-8',
        'cache-control': 'no-store, no-cache, must-revalidate, max-age=0',
      })
      response.end(adminPageHtml())
    }

    const server = http.createServer(async (request, response) => {
      const url = new URL(request.url || '/', 'http://internal')
      const pathname = url.pathname
      const method = request.method || 'GET'

      if (pathname === '/healthz') {
        json(response, 200, { ok: true })
        return
      }

      if (pathname === '/__oc_login' && method === 'POST') {
        const body = await readJsonBody(request).catch(() => null)
        const identity = (body?.username || '').trim().toLowerCase()
        const password = body?.password || ''
        if (!identity || !password) {
          json(response, 400, { error: 'username and password are required' })
          return
        }
        if (!(await verifyUser(identity, password))) {
          json(response, 401, { error: 'invalid username or password' })
          return
        }
        jsonWithCookie(response, 200, { ok: true, redirect: '/__oc_start' }, sessionCookieHeader(identity, false))
        return
      }

      if (pathname === '/__oc_register' && method === 'POST') {
        const body = await readJsonBody(request).catch(() => null)
        const identity = (body?.username || '').trim().toLowerCase()
        const password = body?.password || ''
        if (!/^[a-z0-9._-]{3,64}$/.test(identity)) {
          json(response, 400, { error: 'username must be 3-64 chars (lowercase letters, digits, . _ -)' })
          return
        }
        if (password.length < 6) {
          json(response, 400, { error: 'password must be at least 6 characters' })
          return
        }
        try {
          await registerUser(identity, password)
        } catch (error) {
          json(response, error.statusCode || 500, { error: error.message })
          return
        }
        jsonWithCookie(response, 200, { ok: true, redirect: '/__oc_start' }, sessionCookieHeader(identity, false))
        return
      }

      if (pathname === '/__oc_sso' && method === 'POST') {
        const ssoIdentity = (userFromHeaders(request.headers) || '').trim().toLowerCase()
        if (!ssoIdentity) {
          json(response, 401, { error: 'not authenticated via SSO' })
          return
        }
        jsonWithCookie(response, 200, { ok: true, redirect: '/__oc_start' }, sessionCookieHeader(ssoIdentity, false))
        return
      }

      if (pathname === '/__oc_logout' && (method === 'GET' || method === 'POST')) {
        response.writeHead(302, { location: '/', 'set-cookie': [sessionCookieHeader('', true)] })
        response.end()
        return
      }

      // Admin console (basic-auth gated)
      if (pathname === '/__oc_admin_login' && method === 'POST') {
        const body = await readJsonBody(request).catch(() => null)
        const u = (body?.username || '').trim()
        const p = body?.password || ''
        if (u === adminUsername && p === adminPassword) {
          jsonWithCookie(response, 200, { ok: true, redirect: '/__oc_admin' }, adminSessionCookieHeader())
          return
        }
        json(response, 401, { error: 'invalid admin credentials' })
        return
      }
      if (pathname === '/__oc_admin_logout' && (method === 'GET' || method === 'POST')) {
        response.writeHead(302, { location: '/', 'set-cookie': [clearAdminCookieHeader()] })
        response.end()
        return
      }
      if (pathname === '/__oc_admin' && method === 'GET') {
        if (!isAdmin(request)) {
          response.writeHead(401, { 'www-authenticate': 'Basic realm="opencode-admin"' })
          response.end()
          return
        }
        serveAdminPage(response)
        return
      }
      if (pathname === '/__oc_admin/api/users' && method === 'GET') {
        if (!isAdmin(request)) {
          json(response, 401, { error: 'unauthorized' })
          return
        }
        const users = await loadUserRegistry()
        const deployments = await listUserDeployments()
        const list = Object.keys(users).map((username) => {
          const slug = slugForUser(username)
          const dep = deployments.find((d) => {
            const labels = d.metadata?.labels || {}
            return labels['opencode-user-slug'] === slug
              || (labels['opencode-user-warmpool'] === 'true' && labels['opencode-user-owner'] === slug)
          })
          return {
            username,
            slug,
            exists: !!dep,
            ready: !!dep && (dep.status?.readyReplicas || 0) >= 1,
          }
        })
        json(response, 200, { users: list })
        return
      }
      if (pathname === '/__oc_admin/api/create' && method === 'POST') {
        if (!isAdmin(request)) {
          json(response, 401, { error: 'unauthorized' })
          return
        }
        const body = await readJsonBody(request).catch(() => null)
        const identity = (body?.username || '').trim().toLowerCase()
        const password = body?.password || ''
        if (!/^[a-z0-9._-]{3,64}$/.test(identity)) {
          json(response, 400, { error: 'username must be 3-64 chars (lowercase letters, digits, . _ -)' })
          return
        }
        if (password.length < 6) {
          json(response, 400, { error: 'password must be at least 6 characters' })
          return
        }
        try {
          await registerUser(identity, password)
        } catch (error) {
          json(response, error.statusCode || 500, { error: error.message })
          return
        }
        try {
          // Provision the pod immediately so the account is "ready" up front.
          await resolveUserEnvironment(identity)
        } catch (error) {
          console.error('admin create provisioning failed', error)
        }
        json(response, 200, { ok: true, username: identity })
        return
      }
      if (pathname === '/__oc_admin/api/delete' && method === 'POST') {
        if (!isAdmin(request)) {
          json(response, 401, { error: 'unauthorized' })
          return
        }
        const body = await readJsonBody(request).catch(() => null)
        const identity = (body?.username || '').trim().toLowerCase()
        if (!identity) {
          json(response, 400, { error: 'username is required' })
          return
        }
        try {
          await deleteUserEnvironment(slugForUser(identity))
          const users = await loadUserRegistry()
          if (users[identity]) {
            delete users[identity]
            await saveUserRegistry(users)
          }
          json(response, 200, { ok: true, username: identity })
        } catch (error) {
          console.error('admin delete failed', error)
          json(response, 500, { error: error.message })
        }
        return
      }
      if (pathname === '/__oc_admin/api/reset-password' && method === 'POST') {
        if (!isAdmin(request)) {
          json(response, 401, { error: 'unauthorized' })
          return
        }
        const body = await readJsonBody(request).catch(() => null)
        const identity = (body?.username || '').trim().toLowerCase()
        const password = body?.password || ''
        const users = await loadUserRegistry()
        if (!users[identity]) {
          json(response, 404, { error: 'user not found' })
          return
        }
        if (password.length < 6) {
          json(response, 400, { error: 'password must be at least 6 characters' })
          return
        }
        const salt = crypto.randomBytes(16).toString('hex')
        users[identity] = { ...users[identity], salt, hash: hashPassword(password, salt), updatedAt: new Date().toISOString() }
        await saveUserRegistry(users)
        json(response, 200, { ok: true, username: identity })
        return
      }
      if (pathname === '/__oc_admin/api/rename' && method === 'POST') {
        if (!isAdmin(request)) {
          json(response, 401, { error: 'unauthorized' })
          return
        }
        const body = await readJsonBody(request).catch(() => null)
        const oldName = (body?.username || '').trim().toLowerCase()
        const newName = (body?.newUsername || '').trim().toLowerCase()
        if (oldName === newName) {
          json(response, 400, { error: 'new username is the same as the current one' })
          return
        }
        if (!/^[a-z0-9._-]{3,64}$/.test(newName)) {
          json(response, 400, { error: 'new username must be 3-64 chars (lowercase letters, digits, . _ -)' })
          return
        }
        const users = await loadUserRegistry()
        if (!users[oldName]) {
          json(response, 404, { error: 'user not found' })
          return
        }
        if (users[newName]) {
          json(response, 409, { error: 'username already exists' })
          return
        }
        users[newName] = users[oldName]
        delete users[oldName]
        await saveUserRegistry(users)
        try {
          await resolveUserEnvironment(newName)
        } catch (error) {
          console.error('admin rename provision failed', error)
        }
        try {
          await deleteUserEnvironment(slugForUser(oldName))
        } catch (error) {
          console.error('admin rename cleanup failed', error)
        }
        json(response, 200, { ok: true, username: newName })
        return
      }

      if (setupUiEnabled && pathname === setupStatusPath) {
        await handleSetupStatus(request, response)
        return
      }

      // Provisioning entry point: after login/register/sso. Ensures the user's
      // pod, shows the loading page while it comes up, then redirects to the pod.
      if (pathname === '/__oc_start') {
        const identity = readSessionIdentity(request)
        if (!identity) {
          response.writeHead(302, { location: '/' })
          response.end()
          return
        }
        try {
          const environment = await resolveUserEnvironment(identity)
          if (setupUiEnabled) {
            if (!(await isEnvironmentReady(environment.names))) {
              startProvisionWatch(environment.names)
              serveSetupPage(response)
              return
            }
          } else {
            await provisionReady(environment.names)
          }
          redirectToPod(response, slugForUser(identity))
        } catch (error) {
          console.error('start request handling failed', error)
          json(response, error.statusCode || 500, { error: error.message })
        }
        return
      }

      // Path-based per-user routing: /u-{slug}/... -> that user's pod nginx (:8082).
      const userPathMatch = pathname.match(/^\/u-([a-f0-9]{12})(\/.*)?$/)
      if (userPathMatch) {
        const pathSlug = userPathMatch[1]
        const identity = readSessionIdentity(request)
        if (!identity || slugForUser(identity) !== pathSlug) {
          response.writeHead(302, { location: '/' })
          response.end()
          return
        }
        try {
          const environment = await resolveUserEnvironment(identity)
          if (setupUiEnabled) {
            if (!(await isEnvironmentReady(environment.names))) {
              startProvisionWatch(environment.names)
              serveSetupPage(response)
              return
            }
          } else {
            await provisionReady(environment.names)
          }
          const target = targetForUserPath(environment.names, stripSlugPrefix(request.url || '/', pathSlug), pathSlug)
          proxyRequest(request, response, target)
        } catch (error) {
          console.error('user path request handling failed', error)
          json(response, error.statusCode || 500, { error: error.message })
        }
        return
      }

      // Session-keyed passthrough: any other path on the main host is served to the
      // signed-in user's pod so in-pod apps that emit root-relative URLs (openchamber,
      // data manager, terminal) keep working without a /u-{slug}/ prefix.
      const sessionIdentity = readSessionIdentity(request)
      if (sessionIdentity && pathname !== '/') {
        try {
          const environment = await resolveUserEnvironment(sessionIdentity)
          const target = targetForPassthrough(environment.names, request.url || '/')
          proxyRequest(request, response, target)
        } catch (error) {
          console.error('session passthrough failed', error)
          json(response, error.statusCode || 500, { error: error.message })
        }
        return
      }

      // Main host always presents the login/account page (with an "Open your
      // environment / Log out" strip when a session already exists).
      serveAuthPage(response, sessionIdentity)
    })

    // WebSocket upgrades for /u-{slug}/... (terminal, ttyd, preview sockets).
    server.on('upgrade', async (request, socket, head) => {
      const pathname = new URL(request.url || '/', 'http://internal').pathname
      const match = pathname.match(/^\/u-([a-f0-9]{12})(\/.*)?$/)
      const reject = (status, message) => {
        socket.write(`HTTP/1.1 ${status} ${message}\r\n\r\n`)
        socket.destroy()
      }
      if (!match) {
        // Root-relative WebSocket from an in-pod app: route to the signed-in user's pod.
        const identity = readSessionIdentity(request)
        if (!identity) {
          reject(401, 'Unauthorized')
          return
        }
        try {
          const environment = await resolveUserEnvironment(identity)
          proxyUpgrade(request, socket, head, targetForPassthrough(environment.names, request.url || '/'))
        } catch (error) {
          console.error('session passthrough upgrade failed', error)
          reject(502, 'Bad Gateway')
        }
        return
      }
      const pathSlug = match[1]
      const identity = readSessionIdentity(request)
      if (!identity || slugForUser(identity) !== pathSlug) {
        reject(401, 'Unauthorized')
        return
      }
      try {
        const environment = await resolveUserEnvironment(identity)
        const target = targetForUserPath(environment.names, stripSlugPrefix(request.url || '/', pathSlug), pathSlug)
        proxyUpgrade(request, socket, head, target)
      } catch (error) {
        console.error('user path upgrade failed', error)
        reject(502, 'Bad Gateway')
      }
    })

    server.listen(8080, '0.0.0.0', () => {
      console.log('opencode router listening on 0.0.0.0:8080')
    })

    recoverOwnerPool()
    reconcilePool()
    if (warmPoolEnabled && warmPoolSize > 0) {
      setInterval(reconcilePool, warmRefreshIntervalMs)
    }
