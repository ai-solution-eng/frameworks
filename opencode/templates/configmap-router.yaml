    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    #card { text-align: center; max-width: 460px; width: 100%; padding: 40px 32px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-panel); }
    #heading { font-size: 20px; font-weight: 600; margin-bottom: 10px; }
    #subtext { color: var(--text-muted); line-height: 1.5; margin-bottom: 24px; }
