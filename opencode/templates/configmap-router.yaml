apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-router-config
  namespace: {{ .Release.Namespace }}
  labels:
    hpe-ezua/type: vendor-service
    hpe-ezua/app: {{ .Chart.Name }}
data:
  server.mjs: |
    import crypto from 'node:crypto'
    import fs from 'node:fs'
    import http from 'node:http'
    import https from 'node:https'
    import net from 'node:net'

    const namespace = process.env.POD_NAMESPACE || '{{ .Release.Namespace }}'
    const sharedWorkspaceClaim = process.env.SHARED_WORKSPACE_CLAIM || '{{ .Release.Name }}-shared-pvc'
    const storageClassName = process.env.STORAGE_CLASS_NAME || '{{ .Values.storageClass }}'
    const previewDomainSuffix = process.env.PREVIEW_DOMAIN_SUFFIX || '{{ .Values.previewDomain }}'
    const userInstanceImage = process.env.USER_INSTANCE_IMAGE || '{{ .Values.images.user }}'
    const userInitImage = process.env.USER_INIT_IMAGE || '{{ .Values.images.init }}'
    const userOpencodeVersion = process.env.USER_INSTANCE_OPENCODE_VERSION || '{{ .Values.opencode.version }}'
    const userOpenChamberVersion = process.env.USER_INSTANCE_OPENCHAMBER_VERSION || '{{ .Values.openchamber.version }}'
    const userUiMode = process.env.USER_INSTANCE_OPENCODE_UI_MODE || '{{ .Values.ui.mode }}'
    const userIsChamber = userUiMode === 'openchamber'
    const userChamberPort = Number(process.env.USER_INSTANCE_OPENCHAMBER_PORT || '{{ .Values.ui.chamberPort }}')
    const userServerPort = Number(process.env.USER_INSTANCE_OPENCODE_SERVER_PORT || '{{ .Values.ui.serverPort }}')
    const workspaceSize = process.env.PERSONAL_WORKSPACE_SIZE || '{{ .Values.storage.workspaceSize }}'
    const stateSize = process.env.PERSONAL_STATE_SIZE || '{{ .Values.storage.stateSize }}'
    const userTemplateVersion = `terminal-tab-v4-opencode-${userOpencodeVersion}`
    const ttydVersion = '1.7.7'
    const usernameHeader = 'x-auth-request-preferred-username'
    const fallbackUserHeader = 'x-auth-request-user'
    const kubeHost = process.env.KUBERNETES_SERVICE_HOST
    const kubePort = process.env.KUBERNETES_SERVICE_PORT_HTTPS || '443'
    const serviceAccountToken = fs.readFileSync('/var/run/secrets/kubernetes.io/serviceaccount/token', 'utf8').trim()
    const serviceAccountCa = fs.readFileSync('/var/run/secrets/kubernetes.io/serviceaccount/ca.crt')
    const basicAuth = `Basic ${Buffer.from(`${process.env.OPENCODE_SERVER_USERNAME}:${process.env.OPENCODE_SERVER_PASSWORD}`).toString('base64')}`
    const activePtyUpgrades = new Map()
    let tunnelSeq = 0
    const warmPoolEnabled = process.env.WARM_POOL_ENABLED === 'true'
    const warmPoolSize = Number(process.env.WARM_POOL_SIZE || '0')
    const warmRefreshIntervalMs = Number(process.env.WARM_REFRESH_INTERVAL_MS || `${warmPoolSize * 15 * 1000}`)
    const ownerMap = new Map() // user slug -> warm poolId
    let poolBusy = false
    const setupUiEnabled = process.env.SETUP_UI_ENABLED === 'true'
    const setupStatusPath = process.env.SETUP_STATUS_PATH || '/__oc_setup_status'
    const setupHeading = process.env.SETUP_HEADING || 'Setting up your account\u2026'
    const setupSubtext = process.env.SETUP_SUBTEXT || 'This usually takes a few minutes on first launch. Please wait.'
    const provisionTasks = new Map() // deployment name -> { promise, error }

    // --- Direct-to-pod routing / identity -------------------------------
    const istioGateway = process.env.ISTIO_GATEWAY || '{{ .Values.ezua.virtualService.istioGateway }}'
    const registrySecretName = process.env.USER_REGISTRY_SECRET || '{{ .Release.Name }}-users'
    const sessionSecret = process.env.SESSION_SECRET || ''
    const sessionCookieName = 'oc_sess'
    const sessionTtlSeconds = 7 * 24 * 60 * 60
    const adminUsername = process.env.ADMIN_USERNAME || ''
    const adminPassword = process.env.ADMIN_PASSWORD || ''
    // Version the per-user PVC names so a new environment provisions a fresh
    // VAST volume instead of colliding with an orphaned quota left behind by a
    // previously-deleted volume (VAST CSI deletes can fail when
    // deletionViewPolicy is not configured to allow local volume deletion).
    const pvcNameVersion = process.env.PVC_NAME_VERSION || '{{ .Values.storage.nameVersion }}'

    function slugForUser(userId) {
      return crypto.createHash('sha256').update(userId.toLowerCase()).digest('hex').slice(0, 12)
    }

    function namesForSlug(slug) {
      const base = `opencode-user-${slug}`
      return {
        deployment: base,
        service: `${base}-svc`,
        workspaceClaim: `${base}-workspace-pvc-${pvcNameVersion}`,
        stateClaim: `${base}-state-pvc-${pvcNameVersion}`,
        virtualService: `opencode-user-vs-${slug}`,
      }
    }

    // --- Admin console ------------------------------------------------
    const adminCookieName = 'oc_admin'
    const adminSessionTtlSeconds = 8 * 60 * 60

    function adminSessionCookieHeader() {
      const payload = { admin: true, exp: Math.floor(Date.now() / 1000) + adminSessionTtlSeconds }
      const payloadB64 = base64url(JSON.stringify(payload))
      const sig = crypto.createHmac('sha256', sessionSecret).update(payloadB64).digest('hex')
      return [
        `${adminCookieName}=${payloadB64}.${sig}`,
        `Domain=${previewDomainSuffix}`,
        'Path=/',
        `Max-Age=${adminSessionTtlSeconds}`,
        'HttpOnly',
        'SameSite=Lax',
        'Secure',
      ].join('; ')
    }

    function clearAdminCookieHeader() {
      return [
        `${adminCookieName}=`,
        `Domain=${previewDomainSuffix}`,
        'Path=/',
        'Max-Age=0',
        'HttpOnly',
        'SameSite=Lax',
        'Secure',
      ].join('; ')
    }

    function adminCookieValid(request) {
      if (!sessionSecret) return false
      const header = request.headers.cookie || ''
      let value = null
      for (const part of header.split(';')) {
        const trimmed = part.trim()
        if (trimmed.startsWith(`${adminCookieName}=`)) {
          value = decodeURIComponent(trimmed.slice(adminCookieName.length + 1))
          break
        }
      }
      if (!value) return false
      const dot = value.lastIndexOf('.')
      if (dot <= 0) return false
      const payloadB64 = value.slice(0, dot)
      const sig = value.slice(dot + 1)
      const expected = crypto.createHmac('sha256', sessionSecret).update(payloadB64).digest('hex')
      if (sig.length !== expected.length) return false
      if (!crypto.timingSafeEqual(Buffer.from(sig, 'hex'), Buffer.from(expected, 'hex'))) return false
      let payload
      try {
        payload = JSON.parse(Buffer.from(payloadB64, 'base64url').toString('utf8'))
      } catch {
        return false
      }
      if (payload.admin !== true) return false
      if (typeof payload.exp === 'number' && payload.exp * 1000 < Date.now()) return false
      return true
    }

    function isAdmin(request) {
      if (adminCookieValid(request)) return true
      if (!adminUsername || !adminPassword) return false
      const auth = request.headers.authorization || ''
      if (!auth.startsWith('Basic ')) return false
      let decoded = ''
      try {
        decoded = Buffer.from(auth.slice(6), 'base64').toString('utf8')
      } catch {
        return false
      }
      const colon = decoded.indexOf(':')
      if (colon < 0) return false
      const user = decoded.slice(0, colon)
      const pass = decoded.slice(colon + 1)
      return user === adminUsername && pass === adminPassword
    }

    async function deleteK8s(apiPath, name) {
      try {
        await k8sRequest('DELETE', `${apiPath}/${name}?propagationPolicy=Background`)
      } catch (error) {
        if (error.statusCode !== 404) throw error
      }
    }

    async function waitForDeploymentGone(name, timeoutMs = 90000) {
      const start = Date.now()
      while (Date.now() - start < timeoutMs) {
        const dep = await k8sRequest('GET', `/apis/apps/v1/namespaces/${namespace}/deployments/${name}`)
        if (!dep || (dep.status?.replicas || 0) === 0) return
        await new Promise((resolve) => setTimeout(resolve, 2000))
      }
    }

    async function deleteUserEnvironment(slug) {
      const names = namesForSlug(slug)
      const deployments = await listUserDeployments()
      let warm = null
      for (const dep of deployments) {
        const labels = dep.metadata?.labels || {}
        if (labels['opencode-user-warmpool'] === 'true' && labels['opencode-user-owner'] === slug) {
          warm = warmNamesForPoolId(Number(labels['opencode-user-pool-id']))
          break
        }
      }
      const target = warm || {
        deployment: names.deployment,
        service: names.service,
        workspaceClaim: names.workspaceClaim,
        stateClaim: names.stateClaim,
      }
      await deleteK8s(`/apis/networking.istio.io/v1/namespaces/${namespace}/virtualservices`, names.virtualService)
      await deleteK8s(`/apis/apps/v1/namespaces/${namespace}/deployments`, target.deployment)
      await waitForDeploymentGone(target.deployment)
      await deleteK8s(`/api/v1/namespaces/${namespace}/services`, target.service)
      await deleteK8s(`/api/v1/namespaces/${namespace}/persistentvolumeclaims`, target.workspaceClaim)
      await deleteK8s(`/api/v1/namespaces/${namespace}/persistentvolumeclaims`, target.stateClaim)
      await deleteK8s(`/apis/coordination.k8s.io/v1/namespaces/${namespace}/leases`, `opencode-user-${slug}`)
    }

    // --- Session cookie --------------------------------------------------
    function base64url(input) {
      return Buffer.from(input).toString('base64url')
    }

    function hmacSign(payloadB64) {
      return crypto.createHmac('sha256', sessionSecret).update(payloadB64).digest('hex')
    }

    function deriveSessionKey(identity) {
      // Per-identity key so a leaked pod key cannot sign another user's slug.
      return crypto.createHmac('sha256', sessionSecret).update(slugForUser(identity)).digest('hex')
    }

    function signSession(identity) {
      const payload = {
        u: identity,
        slug: slugForUser(identity),
        exp: Math.floor(Date.now() / 1000) + sessionTtlSeconds,
      }
      const payloadB64 = base64url(JSON.stringify(payload))
      const key = deriveSessionKey(identity)
      return `${payloadB64}.${crypto.createHmac('sha256', key).update(payloadB64).digest('hex')}`
    }

    function readSessionIdentity(request) {
      if (!sessionSecret) return null
      const header = request.headers.cookie || ''
      let value = null
      for (const part of header.split(';')) {
        const trimmed = part.trim()
        if (trimmed.startsWith(`${sessionCookieName}=`)) {
          value = decodeURIComponent(trimmed.slice(sessionCookieName.length + 1))
          break
        }
      }
      if (!value) return null
      const dot = value.lastIndexOf('.')
      if (dot <= 0) return null
      const payloadB64 = value.slice(0, dot)
      const sig = value.slice(dot + 1)
      let payload
      try {
        payload = JSON.parse(Buffer.from(payloadB64, 'base64url').toString('utf8'))
      } catch {
        return null
      }
      if (!payload || typeof payload.u !== 'string') return null
      if (typeof payload.exp === 'number' && payload.exp * 1000 < Date.now()) return null
      const key = deriveSessionKey(payload.u)
      const expected = crypto.createHmac('sha256', key).update(payloadB64).digest('hex')
      if (sig.length !== expected.length) return null
      const sigBuf = Buffer.from(sig, 'hex')
      const expBuf = Buffer.from(expected, 'hex')
      if (!crypto.timingSafeEqual(sigBuf, expBuf)) return null
      return payload.u
    }

    function sessionCookieHeader(identity, clear) {
      const value = clear ? '' : signSession(identity)
      const parts = [
        `${sessionCookieName}=${value}`,
        `Domain=${previewDomainSuffix}`,
        'Path=/',
        'Max-Age=' + (clear ? '0' : String(sessionTtlSeconds)),
        'HttpOnly',
        'SameSite=Lax',
        'Secure',
      ]
      return parts.join('; ')
    }

    // --- User registry (scrypt-hashed passwords in a Secret) ------------
    function hashPassword(password, salt) {
      return crypto.scryptSync(password, salt, 64).toString('hex')
    }

    async function loadUserRegistry() {
      const path = `/api/v1/namespaces/${namespace}/secrets/${registrySecretName}`
      const existing = await k8sRequest('GET', path)
      if (!existing || !existing.data || !existing.data.users) {
        return {}
      }
      try {
        return JSON.parse(Buffer.from(existing.data.users, 'base64').toString('utf8')) || {}
      } catch {
        return {}
      }
    }

    async function saveUserRegistry(users) {
      const path = `/api/v1/namespaces/${namespace}/secrets/${registrySecretName}`
      const body = {
        metadata: {
          name: registrySecretName,
          labels: {
            app: '{{ .Chart.Name }}',
            'opencode-user-managed': 'true',
          },
        },
        stringData: {
          users: JSON.stringify(users),
        },
      }
      const existing = await k8sRequest('GET', path)
      if (existing) {
        await k8sRequest('PUT', path, { ...existing, metadata: body.metadata, stringData: body.stringData })
        return
      }
      try {
        await k8sRequest('POST', `/api/v1/namespaces/${namespace}/secrets`, { apiVersion: 'v1', kind: 'Secret', metadata: body.metadata, type: 'Opaque', stringData: body.stringData })
      } catch (error) {
        if (error.statusCode !== 409) throw error
      }
    }

    async function registerUser(identity, password) {
      const users = await loadUserRegistry()
      if (users[identity]) {
        const error = new Error('Username already exists')
        error.statusCode = 409
        throw error
      }
      const salt = crypto.randomBytes(16).toString('hex')
      users[identity] = { salt, hash: hashPassword(password, salt), createdAt: new Date().toISOString() }
      await saveUserRegistry(users)
    }

    async function verifyUser(identity, password) {
      const users = await loadUserRegistry()
      const record = users[identity]
      if (!record || !record.salt || !record.hash) return false
      const candidate = hashPassword(password, record.salt)
      const a = Buffer.from(candidate, 'hex')
      const b = Buffer.from(record.hash, 'hex')
      if (a.length !== b.length) return false
      return crypto.timingSafeEqual(a, b)
    }

    function readHeader(headers, name) {
      const value = headers[name]
      if (Array.isArray(value)) {
        return value[0]
      }
      return value
    }

    function userFromHeaders(headers) {
      const primary = readHeader(headers, usernameHeader)
      const fallback = readHeader(headers, fallbackUserHeader)
      const userId = (primary || fallback || '').trim().toLowerCase()
      return userId || null
    }

    function json(response, statusCode, payload) {
      response.writeHead(statusCode, { 'content-type': 'application/json' })
      response.end(JSON.stringify(payload))
    }

    function jsonWithCookie(response, statusCode, payload, cookie) {
      response.writeHead(statusCode, { 'content-type': 'application/json', 'set-cookie': [cookie] })
      response.end(JSON.stringify(payload))
    }

    function text(response, statusCode, payload) {
      response.writeHead(statusCode, { 'content-type': 'text/plain; charset=utf-8' })
      response.end(payload)
    }

    function k8sRequest(method, path, body) {
      return new Promise((resolve, reject) => {
        const request = https.request(
          {
            host: kubeHost,
            port: kubePort,
            method,
            path,
            ca: serviceAccountCa,
            headers: {
              accept: 'application/json',
              authorization: `Bearer ${serviceAccountToken}`,
              ...(body ? { 'content-type': method === 'PATCH' ? 'application/merge-patch+json' : 'application/json' } : {}),
            },
          },
          (response) => {
            let data = ''
            response.setEncoding('utf8')
            response.on('data', (chunk) => {
              data += chunk
            })
            response.on('end', () => {
              const parsed = data ? JSON.parse(data) : null
              if (response.statusCode >= 200 && response.statusCode < 300) {
                resolve(parsed)
                return
              }
              if (response.statusCode === 404) {
                resolve(null)
                return
              }
              const error = new Error(`Kubernetes API ${method} ${path} failed with ${response.statusCode}`)
              error.statusCode = response.statusCode
              error.payload = parsed
              reject(error)
            })
          },
        )
        request.on('error', reject)
        if (body) {
          request.write(JSON.stringify(body))
        }
        request.end()
      })
    }

    async function ensureLease(name) {
      const path = `/apis/coordination.k8s.io/v1/namespaces/${namespace}/leases/${name}`
      const existing = await k8sRequest('GET', path)
      if (existing) {
        return
      }
      const manifest = {
        apiVersion: 'coordination.k8s.io/v1',
        kind: 'Lease',
        metadata: {
          name,
          namespace,
          labels: {
            app: '{{ .Chart.Name }}',
            'opencode-user-managed': 'true',
          },
        },
        spec: {
          holderIdentity: '{{ .Release.Name }}-router',
        },
      }
      try {
        await k8sRequest('POST', `/apis/coordination.k8s.io/v1/namespaces/${namespace}/leases`, manifest)
      } catch (error) {
        if (error.statusCode !== 409) {
          throw error
        }
      }
    }

    async function ensurePersistentVolumeClaim(name, size) {
      const path = `/api/v1/namespaces/${namespace}/persistentvolumeclaims/${name}`
      const existing = await k8sRequest('GET', path)
      if (existing) {
        return
      }
      const manifest = {
        apiVersion: 'v1',
        kind: 'PersistentVolumeClaim',
        metadata: {
          name,
          namespace,
          labels: {
            app: '{{ .Chart.Name }}',
            'opencode-user-managed': 'true',
          },
        },
        spec: {
          accessModes: ['ReadWriteOnce'],
          storageClassName,
          resources: {
            requests: {
              storage: size,
            },
          },
        },
      }
      try {
        await k8sRequest('POST', `/api/v1/namespaces/${namespace}/persistentvolumeclaims`, manifest)
      } catch (error) {
        if (error.statusCode !== 409) {
          throw error
        }
      }
    }

    function servicePortsMatch(existingPorts, desiredPorts) {
      const byName = new Map((existingPorts || []).map((port) => [port.name, port]))
      return desiredPorts.every((desired) => {
        const existing = byName.get(desired.name)
        return existing
          && existing.protocol === desired.protocol
          && existing.port === desired.port
          && existing.targetPort === desired.targetPort
      })
    }

    function userServiceManifest(name, slug) {
      const spec = serviceSpec(userIsChamber ? userChamberPort : userServerPort)
      spec.selector = {
        'opencode-user-slug': slug,
      }
      return {
        apiVersion: 'v1',
        kind: 'Service',
        metadata: {
          name,
          namespace,
          labels: {
            app: 'opencode-user',
            'opencode-user-managed': 'true',
            'opencode-user-slug': slug,
          },
        },
        spec,
      }
    }

    function warmServiceManifest(poolId) {
      const name = warmNamesForPoolId(poolId).service
      const poolIdStr = String(poolId)
      return {
        apiVersion: 'v1',
        kind: 'Service',
        metadata: {
          name,
          namespace,
          labels: {
            app: 'opencode-user',
            'opencode-user-managed': 'true',
            'opencode-user-warmpool': 'true',
            'opencode-user-pool-id': poolIdStr,
          },
        },
        spec: {
          type: 'ClusterIP',
          selector: {
            'opencode-user-pool-id': poolIdStr,
          },
          ports: [
            { name: 'http', protocol: 'TCP', port: 8080, targetPort: userIsChamber ? userChamberPort : userServerPort },
            { name: 'http-preview', protocol: 'TCP', port: 8082, targetPort: 8082 },
            { name: 'ttyd', protocol: 'TCP', port: 7681, targetPort: 7681 },
            { name: 'data-manager', protocol: 'TCP', port: 7682, targetPort: 7682 },
            { name: 'term-mgr', protocol: 'TCP', port: 7683, targetPort: 7683 },
          ],
        },
      }
    }

    function serviceSpec(appPort) {
      return {
        type: 'ClusterIP',
        selector: {
          'opencode-user-slug': 'PLACEHOLDER',
        },
        ports: [
          { name: 'http', protocol: 'TCP', port: 8080, targetPort: appPort },
          { name: 'http-preview', protocol: 'TCP', port: 8082, targetPort: 8082 },
          { name: 'ttyd', protocol: 'TCP', port: 7681, targetPort: 7681 },
          { name: 'data-manager', protocol: 'TCP', port: 7682, targetPort: 7682 },
          { name: 'term-mgr', protocol: 'TCP', port: 7683, targetPort: 7683 },
        ],
      }
    }

    async function upsertService(manifest) {
      const name = manifest.metadata.name
      const path = `/api/v1/namespaces/${namespace}/services/${name}`
      const existing = await k8sRequest('GET', path)
      if (existing) {
        if (!servicePortsMatch(existing.spec?.ports, manifest.spec.ports)) {
          await k8sRequest('PATCH', path, {
            metadata: { labels: manifest.metadata.labels },
            spec: {
              selector: manifest.spec.selector,
              ports: manifest.spec.ports,
            },
          })
        }
        return
      }
      try {
        await k8sRequest('POST', `/api/v1/namespaces/${namespace}/services`, manifest)
      } catch (error) {
        if (error.statusCode !== 409) {
          throw error
        }
      }
    }

    async function ensureService(name, slug) {
      await upsertService(userServiceManifest(name, slug))
    }

    function warmNamesForPoolId(poolId) {
      const base = `opencode-user-warm-${poolId}`
      return {
        deployment: base,
        service: `${base}-svc`,
        workspaceClaim: `${base}-workspace-pvc-${pvcNameVersion}`,
        stateClaim: `${base}-state-pvc-${pvcNameVersion}`,
        slug: `warm-${poolId}`,
      }
    }

    async function userDeploymentManifest({ name, workspaceClaim, stateClaim, slug, isWarmPool, poolId, owner }) {
      slug = owner || (isWarmPool ? `warm-${poolId}` : slug)
      const matchLabels = isWarmPool
        ? { 'opencode-user-pool-id': String(poolId) }
        : { 'opencode-user-slug': slug }
      const podLabels = {
        app: 'opencode-user',
        'opencode-user-managed': 'true',
        'opencode-role': 'preview',
        ...matchLabels,
        ...(isWarmPool ? { 'opencode-user-warmpool': 'true' } : {}),
      }
      const deploymentLabels = {
        app: 'opencode-user',
        'opencode-user-managed': 'true',
        ...matchLabels,
        ...(isWarmPool ? { 'opencode-user-warmpool': 'true' } : {}),
      }
      if (owner) {
        podLabels['opencode-user-owner'] = owner
        deploymentLabels['opencode-user-owner'] = owner
      }
      const initCommandParts = [
        'mkdir -p /workspace/personal /workspace/shared /var/opencode/home/.config/opencode/agents /var/opencode/home/.config/opencode/skills /var/opencode/data /var/opencode/state /var/opencode/cache /var/opencode/bin',
        'ln -sfn /workspace /var/opencode/home/workspace',
        'if ! command -v git >/dev/null 2>&1 || ! command -v curl >/dev/null 2>&1; then apt-get update -qq && apt-get install -y -qq --no-install-recommends git curl ca-certificates && rm -rf /var/lib/apt/lists/*; fi',
        'if [ ! -d /workspace/personal/.git ]; then git init /workspace/personal >/dev/null; fi',
        'if [ ! -f /var/opencode/home/.config/opencode/opencode.json ]; then if [ -f /var/opencode/config/opencode/opencode.json ]; then cp /var/opencode/config/opencode/opencode.json /var/opencode/home/.config/opencode/opencode.json; else cp /opt/opencode-defaults/opencode.json /var/opencode/home/.config/opencode/opencode.json; fi; fi',
        'legacy_agents=/tmp/opencode-legacy-AGENTS.md; printf "%s\n%s\n%s\n" "# HPE AI Essentials (AIE) Platform Assistant" "You are an expert AIE/PCAI platform engineer and advisor. You have access to live Kubernetes cluster tools, indexed product documentation, and web search." "Your mission: **Think deeply. Act decisively. Anticipate what the user needs before they ask.**" > "$legacy_agents"; if [ -f /var/opencode/home/.config/opencode/AGENTS.md ] && cmp -s "$legacy_agents" /var/opencode/home/.config/opencode/AGENTS.md; then rm /var/opencode/home/.config/opencode/AGENTS.md; fi; rm -f "$legacy_agents"',
        {{- range .Values.opencodeSkills }}
        'mkdir -p /var/opencode/home/.config/opencode/skills/{{ .name }} && if [ ! -f /var/opencode/home/.config/opencode/.seeded-skill-{{ .name }} ]; then if [ ! -f /var/opencode/home/.config/opencode/skills/{{ .name }}/SKILL.md ]; then cp /opt/opencode-defaults/skill-{{ .name }}.md /var/opencode/home/.config/opencode/skills/{{ .name }}/SKILL.md; fi; touch /var/opencode/home/.config/opencode/.seeded-skill-{{ .name }}; fi',
        {{- end }}
        {{- range .Values.opencodeAgents }}
        'if [ ! -f /var/opencode/home/.config/opencode/.seeded-agent-{{ .name }} ]; then if [ ! -f /var/opencode/home/.config/opencode/agents/{{ .name }}.md ]; then cp /opt/opencode-defaults/agent-{{ .name }}.md /var/opencode/home/.config/opencode/agents/{{ .name }}.md; fi; touch /var/opencode/home/.config/opencode/.seeded-agent-{{ .name }}; fi',
        {{- end }}
{{- range $path, $_ := $.Files.Glob "personal/**" }}
{{- if not (hasPrefix "." (base $path)) }}
        'mkdir -p /workspace/personal{{ dir $path | trimPrefix "personal" }} && cp /personal-templates/{{ trimPrefix "personal/" $path | replace "/" "." }} /workspace/personal{{ dir $path | trimPrefix "personal" }}/{{ base $path }} || true',
{{- end }}
{{- end }}
{{- range $path, $_ := $.Files.Glob "create-server.sh" }}
        'cp /personal-templates/create-server.sh /var/opencode/bin/create-server.sh && chmod 0755 /var/opencode/bin/create-server.sh || true',
{{- end }}
        "printf 'export PATH=\"$HOME/.local/bin:/var/opencode/bin:/var/opencode/data/npm/bin:$PATH\"\\nexport COLORTERM=truecolor\\nexport LANG=C.UTF-8\\nexport LC_ALL=C.UTF-8\\nexport LC_CTYPE=C.UTF-8\\n' > /var/opencode/home/.bashrc",
        "printf '[ -f \"$HOME/.bashrc\" ] && . \"$HOME/.bashrc\"\\n' > /var/opencode/home/.bash_profile",
        "cp /var/opencode/home/.bash_profile /var/opencode/home/.profile",
        "printf 'export PATH=\"$HOME/.local/bin:/var/opencode/bin:/var/opencode/data/npm/bin:$PATH\"\\nexport COLORTERM=truecolor\\nexport LANG=C.UTF-8\\nexport LC_ALL=C.UTF-8\\nexport LC_CTYPE=C.UTF-8\\n' > /var/opencode/bin/opencode-bashrc",
        "printf '#!/bin/sh\\nexport BASH_ENV=/var/opencode/bin/opencode-bashrc\\nexec /usr/bin/bash \"$@\"\\n' > /var/opencode/bin/opencode-login-shell",
        'chmod 0755 /var/opencode/bin/opencode-login-shell',
{{- if and .Values.certificatesPolicy .Values.certificatesPolicy.enabled }}
        'echo "export NODE_EXTRA_CA_CERTS=/tmp/certs/ca-certificates.crt" >> /var/opencode/home/.bashrc && echo "export NODE_EXTRA_CA_CERTS=/tmp/certs/ca-certificates.crt" >> /var/opencode/home/.profile && echo "export NODE_EXTRA_CA_CERTS=/tmp/certs/ca-certificates.crt" >> /var/opencode/bin/opencode-bashrc',
{{- end }}
        "if [ ! -f /var/opencode/bin/uv ]; then curl -LsSf https://astral.sh/uv/install.sh | UV_INSTALL_DIR=/var/opencode/bin sh && ln -sf /var/opencode/bin/uv /usr/local/bin/uv && ln -sf /var/opencode/bin/uvx /usr/local/bin/uvx; fi",
        "if [ ! -f /var/opencode/data/npm/bin/opencode ] || [ \"$(cat /var/opencode/.opencode-version 2>/dev/null)\" != \"${OPENCODE_VERSION}\" ]; then npm install -g \"opencode-ai@${OPENCODE_VERSION}\" --prefix /var/opencode/data/npm && echo \"${OPENCODE_VERSION}\" > /var/opencode/.opencode-version && ln -sf /var/opencode/data/npm/bin/opencode /usr/local/bin/opencode; fi",
        "if [ ! -x /var/opencode/bin/ttyd ]; then arch=\"$(uname -m)\"; case \"$arch\" in x86_64|amd64) ttyd_asset=ttyd.x86_64 ;; aarch64|arm64) ttyd_asset=ttyd.aarch64 ;; armv7l|armhf) ttyd_asset=ttyd.armhf ;; arm*) ttyd_asset=ttyd.arm ;; *) echo \"unsupported architecture for ttyd: $arch\" >&2; exit 1 ;; esac; curl -fsSL --retry 3 -o /var/opencode/bin/ttyd \"https://github.com/tsl0922/ttyd/releases/download/${TTYD_VERSION}/${ttyd_asset}\" && chmod 0755 /var/opencode/bin/ttyd; fi",
        "printf '#!/bin/bash\nset -e\nexport DEBIAN_FRONTEND=noninteractive\nexport PATH=\"/var/opencode/bin:/var/opencode/data/npm/bin:$PATH\"\nmissing=0\nfor cmd in bash curl git script tmux; do\n  command -v \"$cmd\" >/dev/null 2>&1 || missing=1\ndone\nif [ \"$missing\" = \"1\" ]; then\n  apt-get update -qq\n  apt-get install -y -qq --no-install-recommends {{ .Values.provisioning.aptPackages }}\n  rm -rf /var/lib/apt/lists/*\nfi\nrm -f /usr/lib/python*/EXTERNALLY-MANAGED\nln -sf /usr/bin/vi /usr/local/bin/vim 2>/dev/null || true\nln -sf /usr/bin/fdfind /usr/local/bin/fd 2>/dev/null || true\nln -sf /usr/bin/python3 /usr/local/bin/python 2>/dev/null || true\nln -sf /usr/bin/pip3 /usr/local/bin/pip 2>/dev/null || true\nif ! command -v xdg-open >/dev/null 2>&1; then\n  printf \"#!/bin/sh\\nexit 0\\n\" > /usr/local/bin/xdg-open\n  chmod 0755 /usr/local/bin/xdg-open\nfi\nln -sf /var/opencode/bin/uv /usr/local/bin/uv 2>/dev/null || true\nln -sf /var/opencode/bin/uvx /usr/local/bin/uvx 2>/dev/null || true\nln -sf /var/opencode/data/npm/bin/opencode /usr/local/bin/opencode 2>/dev/null || true\nln -sf /var/opencode/data/npm/bin/openchamber /usr/local/bin/openchamber 2>/dev/null || true\n/var/opencode/bin/ttyd -p 7681 -i 0.0.0.0 -W -a -T xterm-256color -w /workspace -b /term -t titleFixed=\"OpenCode Terminal\" -t fontSize=14 -t fontFamily=\"menlo,consolas,dejavu sans mono,monospace\" bash /opt/preview/tty-attach-session.sh &\nnode /opt/preview/port_watcher.mjs &\nnode /opt/preview/data_manager.mjs &\nnode /opt/preview/terminal_manager.js &\nexec node /opt/preview/opencode_supervisor.mjs\n' > /var/opencode/bin/opencode-startup.sh",
        "chmod 0755 /var/opencode/bin/opencode-startup.sh",
        'rm -rf /workspace/personal/shared',
      ]
      if (userIsChamber) {
        initCommandParts.push(
          "if [ ! -f /var/opencode/data/npm/bin/openchamber ] || [ \"$(cat /var/opencode/.openchamber-version 2>/dev/null)\" != \"${OPENCHAMBER_VERSION}\" ]; then npm install -g \"@openchamber/web@${OPENCHAMBER_VERSION}\" --prefix /var/opencode/data/npm && echo \"${OPENCHAMBER_VERSION}\" > /var/opencode/.openchamber-version && ln -sf /var/opencode/data/npm/bin/openchamber /usr/local/bin/openchamber; fi",
        )
      }
      const initCommand = initCommandParts.join(' && ')

      const appCommand = [
        'cp /var/opencode/bin/create-server.sh /workspace/create-server.sh 2>/dev/null || true',
        '/var/opencode/bin/opencode-startup.sh',
      ].join(' && ')

      const manifest = {
        apiVersion: 'apps/v1',
        kind: 'Deployment',
        metadata: {
          name,
          namespace,
          labels: deploymentLabels,
        },
        spec: {
          replicas: 1,
          selector: {
            matchLabels,
          },
          template: {
            metadata: {
              labels: podLabels,
              annotations: {
                'sidecar.istio.io/inject': 'false',
                'opencode-web-helm/user-template-version': userTemplateVersion,
              },
            },
            spec: {
              securityContext: {
                fsGroup: 1000,
                fsGroupChangePolicy: 'OnRootMismatch',
              },
              initContainers: [
                {{- if and .Values.certificatesPolicy .Values.certificatesPolicy.enabled }}
                {
                  name: 'build-ca-bundle',
                  image: '{{ .Values.certificatesPolicy.initContainer.image }}',
                  imagePullPolicy: 'IfNotPresent',
                  command: {{ toJson .Values.certificatesPolicy.initContainer.command }},
                  volumeMounts: [
                    {{- range .Values.certificatesPolicy.initVolumeMounts }}
                    { name: '{{ .name }}', mountPath: '{{ .mountPath }}'{{ if .subPath }}, subPath: '{{ .subPath }}'{{ end }}{{ if hasKey . "readOnly" }}, readOnly: {{ .readOnly }}{{ end }} },
                    {{- end }}
                  ],
                },
                {{- end }}
                {
                  name: 'init-opencode-storage',
                  image: userInitImage,
                  imagePullPolicy: 'Always',
                  command: ['/bin/sh', '-lc', initCommand],
                  env: [
                    { name: 'OPENCODE_VERSION', value: userOpencodeVersion },
                    { name: 'TTYD_VERSION', value: ttydVersion },
                    { name: 'OPENCHAMBER_VERSION', value: userOpenChamberVersion },
                    {{- if and .Values.proxy .Values.proxy.enabled }}
                    {{- range .Values.proxy.env }}
                    { name: '{{ .name }}', value: '{{ .value }}' },
                    {{- end }}
                    {{- end }}
                    {{- if and .Values.no_proxy .Values.no_proxy.enabled }}
                    {{- range .Values.no_proxy.env }}
                    { name: '{{ .name }}', value: '{{ .value }}' },
                    {{- end }}
                    {{- end }}
                  ],
                  volumeMounts: [
                    { name: 'personal-workspace', mountPath: '/workspace/personal' },
                    { name: 'shared-workspace', mountPath: '/workspace/shared' },
                    { name: 'state', mountPath: '/var/opencode' },
                    { name: 'project-config', mountPath: '/opt/opencode-defaults', readOnly: true },
                    { name: 'personal-content', mountPath: '/personal-templates', readOnly: true },
                  ],
                },
              ],
              containers: [
                {
                  name: 'opencode-web',
                  image: userInstanceImage,
                  imagePullPolicy: 'Always',
                  workingDir: '/workspace',
                  command: ['/bin/sh', '-lc', appCommand],
                  stdin: true,
                  tty: true,
                  securityContext: {
                    capabilities: { add: ['SYS_PTRACE'] },
                  },
                  env: [
                    { name: 'HOME', value: '/var/opencode/home' },
                    { name: 'SHELL', value: '/usr/bin/bash' },
                    { name: 'TERM', value: 'xterm-256color' },
                    { name: 'COLORTERM', value: 'truecolor' },
                    { name: 'LANG', value: 'C.UTF-8' },
                    { name: 'LC_ALL', value: 'C.UTF-8' },
                    { name: 'LC_CTYPE', value: 'C.UTF-8' },
                    { name: 'XDG_DATA_HOME', value: '/var/opencode/data' },
                    { name: 'XDG_CONFIG_HOME', value: '/var/opencode/home/.config' },
                    { name: 'XDG_STATE_HOME', value: '/var/opencode/state' },
                    { name: 'XDG_CACHE_HOME', value: '/var/opencode/cache' },
                    { name: 'OPENCODE_CONFIG_PATH', value: '/var/opencode/home/.config/opencode/opencode.json' },
                    { name: 'OPENCODE_WATCH_CONFIG_FILES', value: 'opencode.json,config.json,opencode.jsonc' },
                    { name: 'OPENCODE_WATCH_CONFIG_DIRS', value: 'skills,agents' },
                    {
                      name: 'OPENCODE_SERVER_USERNAME',
                      valueFrom: {
                        secretKeyRef: {
                          name: '{{ .Release.Name }}-auth',
                          key: 'OPENCODE_SERVER_USERNAME',
                        },
                      },
                    },
                    {
                      name: 'OPENCODE_SERVER_PASSWORD',
                      valueFrom: {
                        secretKeyRef: {
                          name: '{{ .Release.Name }}-auth',
                          key: 'OPENCODE_SERVER_PASSWORD',
                        },
                      },
                    },
                    { name: 'PREVIEW_DOMAIN_SUFFIX', value: previewDomainSuffix },
                    { name: 'PREVIEW_STATE_FILE', value: '/var/opencode/state/preview-ports.txt' },
                    { name: 'PREVIEW_MIN_PORT', value: '3000' },
                    { name: 'PREVIEW_MAX_PORT', value: '9999' },
                    { name: 'PREVIEW_EXCLUDE_PORTS', value: '3000,4096,8082,7681,7682,7683,7684' },
                    { name: 'OPENCODE_VERSION', value: userOpencodeVersion },
                    { name: 'TTYD_VERSION', value: ttydVersion },
                    { name: 'OPENCODE_UI_MODE', value: userUiMode },
                    { name: 'OPENCHAMBER_VERSION', value: userOpenChamberVersion },
                    { name: 'OPENCHAMBER_PORT', value: String(userChamberPort) },
                    { name: 'OPENCHAMBER_ALLOW_UNAUTHENTICATED_LAN', value: 'true' },
                    { name: 'OPENCODE_SERVER_PORT', value: String(userServerPort) },
                    { name: 'PREVIEW_USER_SLUG', value: slug },
                    { name: 'TTYD_DOMAIN', value: previewDomainSuffix },
                    { name: 'TTYD_SLUG', value: slug },

                    {{- if and .Values.proxy .Values.proxy.enabled }}
                    {{- range .Values.proxy.env }}
                    { name: '{{ .name }}', value: '{{ .value }}' },
                    {{- end }}
                    {{- end }}
                    {{- if and .Values.no_proxy .Values.no_proxy.enabled }}
                    {{- range .Values.no_proxy.env }}
                    { name: '{{ .name }}', value: '{{ .value }}' },
                    {{- end }}
                    {{- end }}
                    {{- if and .Values.certificatesPolicy .Values.certificatesPolicy.enabled }}
                    {{- range .Values.certificatesPolicy.env }}
                    { name: '{{ .name }}', value: '{{ .value }}' },
                    {{- end }}
                    {{- end }}
                  ],
                  ports: [
                    { name: 'http', containerPort: userIsChamber ? userChamberPort : userServerPort, protocol: 'TCP' },
                    ...(userIsChamber ? [{ name: 'server', containerPort: userServerPort, protocol: 'TCP' }] : []),
                    { name: 'ttyd', containerPort: 7681, protocol: 'TCP' },
                    { name: 'data-manager', containerPort: 7682, protocol: 'TCP' },
                    { name: 'term-mgr', containerPort: 7683, protocol: 'TCP' },
                  ],
                  readinessProbe: {
                    tcpSocket: { port: userIsChamber ? userChamberPort : userServerPort },
                    initialDelaySeconds: 10, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 6,
                  },
                  livenessProbe: {
                    tcpSocket: { port: userIsChamber ? userChamberPort : userServerPort },
                    initialDelaySeconds: 30, periodSeconds: 20, timeoutSeconds: 3, failureThreshold: 3,
                  },
                  startupProbe: {
                    tcpSocket: { port: userIsChamber ? userChamberPort : userServerPort },
                    periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 18,
                  },
                  resources: {
                    requests: { cpu: '250m', memory: '512Mi' },
                    limits: { cpu: '2', memory: '2Gi' },
                  },
                  volumeMounts: [
                    { name: 'personal-workspace', mountPath: '/workspace/personal' },
                    { name: 'shared-workspace', mountPath: '/workspace/shared' },
                    { name: 'state', mountPath: '/var/opencode' },
                    { name: 'project-config', mountPath: '/opt/opencode-defaults', readOnly: true },
                    { name: 'preview-config', mountPath: '/usr/local/bin/preview-url', subPath: 'preview-url' },
                    { name: 'preview-config', mountPath: '/opt/preview/port_watcher.mjs', subPath: 'port_watcher.mjs' },
                    { name: 'preview-config', mountPath: '/opt/preview/opencode_supervisor.mjs', subPath: 'opencode_supervisor.mjs' },
                    { name: 'preview-config', mountPath: '/opt/preview/data_manager.mjs', subPath: 'data_manager.mjs' },
                    { name: 'preview-config', mountPath: '/opt/preview/data_manager.html', subPath: 'data_manager.html' },
                    { name: 'preview-config', mountPath: '/opt/preview/terminal_manager.js', subPath: 'terminal_manager.js' },
                    { name: 'preview-config', mountPath: '/opt/preview/terminal_manager.html', subPath: 'terminal_manager.html' },
                    { name: 'preview-config', mountPath: '/opt/preview/tty-attach-session.sh', subPath: 'tty-attach-session.sh' },
                    {{- if and .Values.certificatesPolicy .Values.certificatesPolicy.enabled }}
                    {{- range .Values.certificatesPolicy.volumeMounts }}
                    { name: '{{ .name }}', mountPath: '{{ .mountPath }}'{{ if .subPath }}, subPath: '{{ .subPath }}'{{ end }}{{ if hasKey . "readOnly" }}, readOnly: {{ .readOnly }}{{ end }} },
                    {{- end }}
                    {{- end }}
                  ],
                },
                {
                  name: 'opencode-preview-proxy',
                  image: 'nginx:1.27-alpine',
                  imagePullPolicy: 'IfNotPresent',
                  ports: [
                    { name: 'http-preview', containerPort: 8082, protocol: 'TCP' },
                  ],
                  volumeMounts: [
                    { name: 'preview-config', mountPath: '/etc/nginx/nginx.conf', subPath: 'nginx.conf' },
                  ],
                },
                {
                  name: 'opencode-auth',
                  image: userInstanceImage,
                  imagePullPolicy: 'Always',
                  command: ['node', '/opt/preview/auth_validator.mjs'],
                  env: [
                    { name: 'SESSION_KEY', value: crypto.createHmac('sha256', sessionSecret).update(slug).digest('hex') },
                    { name: 'USER_SLUG', value: slug },
                  ],
                  ports: [
                    { name: 'auth', containerPort: 7684, protocol: 'TCP' },
                  ],
                  volumeMounts: [
                    { name: 'preview-config', mountPath: '/opt/preview/auth_validator.mjs', subPath: 'auth_validator.mjs' },
                  ],
                },
              ],
              volumes: [
                { name: 'personal-workspace', persistentVolumeClaim: { claimName: workspaceClaim } },
                { name: 'shared-workspace', persistentVolumeClaim: { claimName: sharedWorkspaceClaim } },
                { name: 'state', persistentVolumeClaim: { claimName: stateClaim } },
                { name: 'project-config', configMap: { name: '{{ .Release.Name }}-project-config' } },
                { name: 'personal-content', configMap: { name: '{{ .Release.Name }}-personal-content' } },
                { name: 'preview-config', configMap: { name: '{{ .Release.Name }}-preview-config', defaultMode: 365 } },
                {{- if and .Values.certificatesPolicy .Values.certificatesPolicy.enabled }}
                {{- range .Values.certificatesPolicy.volumes }}
                { name: '{{ .name }}', {{ if hasKey . "emptyDir" }}emptyDir: {}{{ else }}configMap: { name: '{{ .configMap.name }}', {{- if .configMap.items }} items: [ {{- range .configMap.items }} { key: '{{ .key }}', path: '{{ .path }}' }, {{- end }} ] {{- end }} }{{ end }} },
                {{- end }}
                {{- end }}
              ],
            },
          },
        },
      }
      return manifest
    }

    async function upsertUserDeployment(name, manifest) {
      const existing = await k8sRequest('GET', `/apis/apps/v1/namespaces/${namespace}/deployments/${name}`)
      if (existing) {
        const version = existing.spec?.template?.metadata?.annotations?.['opencode-web-helm/user-template-version']
        if (version !== userTemplateVersion) {
          await k8sRequest('PATCH', `/apis/apps/v1/namespaces/${namespace}/deployments/${name}`, {
            metadata: { labels: manifest.metadata.labels },
            spec: { template: manifest.spec.template },
          })
        }
        return
      }
      try {
        await k8sRequest('POST', `/apis/apps/v1/namespaces/${namespace}/deployments`, manifest)
      } catch (error) {
        if (error.statusCode !== 409) {
          throw error
        }
      }
    }

    async function ensureDeployment(name, workspaceClaim, stateClaim, slug) {
      const manifest = await userDeploymentManifest({ name, workspaceClaim, stateClaim, slug, isWarmPool: false })
      await upsertUserDeployment(name, manifest)
    }

    async function ensureWarmDeployment(poolId) {
      const names = warmNamesForPoolId(poolId)
      const manifest = await userDeploymentManifest({ name: names.deployment, workspaceClaim: names.workspaceClaim, stateClaim: names.stateClaim, slug: names.slug, isWarmPool: true, poolId })
      await upsertUserDeployment(names.deployment, manifest)
    }

    async function ensureWarmUnit(poolId) {
      const names = warmNamesForPoolId(poolId)
      await ensurePersistentVolumeClaim(names.workspaceClaim, workspaceSize)
      await ensurePersistentVolumeClaim(names.stateClaim, stateSize)
      await upsertService(warmServiceManifest(poolId))
      await ensureWarmDeployment(poolId)
    }

    async function listUserDeployments() {
      const result = await k8sRequest('GET', `/apis/apps/v1/namespaces/${namespace}/deployments?labelSelector=${encodeURIComponent('opencode-user-managed=true')}`)
      return (result && result.items) || []
    }

    async function recoverOwnerPool() {
      ownerMap.clear()
      if (!warmPoolEnabled || warmPoolSize <= 0) return
      try {
        const deployments = await listUserDeployments()
        for (const dep of deployments) {
          const labels = dep.metadata?.labels || {}
          const owner = labels['opencode-user-owner']
          if (!owner) continue
          const poolId = Number(labels['opencode-user-pool-id'])
          if (Number.isFinite(poolId) && poolId > 0) ownerMap.set(owner, poolId)
        }
        console.log(`[warmpool] recovered ${ownerMap.size} owned warm unit(s)`)
      } catch (error) {
        console.error('[warmpool] owner recovery failed', error)
      }
    }

    function warmUnitState(dep) {
      const labels = dep.metadata?.labels || {}
      const poolId = Number(labels['opencode-user-pool-id'])
      const ready = (dep.status?.availableReplicas || 0) >= 1 && (dep.status?.updatedReplicas || 0) >= 1
      return {
        labels,
        isWarm: labels['opencode-user-warmpool'] === 'true',
        poolId,
        ready,
        owned: !!labels['opencode-user-owner'],
      }
    }

    async function reconcilePool() {
      if (!warmPoolEnabled || warmPoolSize <= 0) return
      if (poolBusy) return
      poolBusy = true
      try {
        const deployments = await listUserDeployments()
        let maxPoolId = 0
        let free = 0
        let pending = 0
        for (const dep of deployments) {
          const state = warmUnitState(dep)
          if (Number.isFinite(state.poolId) && state.poolId > maxPoolId) maxPoolId = state.poolId
          if (state.isWarm && !state.owned) {
            if (state.ready) free += 1
            else pending += 1
          }
        }
        const need = warmPoolSize - free - pending
        if (need <= 0) return
        for (let i = 0; i < need; i++) {
          const poolId = maxPoolId + 1 + i
          console.log(`[warmpool] ensuring warm unit poolId=${poolId}`)
          await ensureWarmUnit(poolId)
          await waitForDeployment(warmNamesForPoolId(poolId).deployment)
          console.log(`[warmpool] warm unit ready poolId=${poolId}`)
        }
      } catch (error) {
        console.error('[warmpool] reconcile failed', error)
      } finally {
        poolBusy = false
      }
    }

    async function claimWarmForUser(slug) {
      const deployments = await listUserDeployments()
      let mine = null
      let best = null
      for (const dep of deployments) {
        const state = warmUnitState(dep)
        if (!state.isWarm) continue
        if (state.owned && state.labels['opencode-user-owner'] === slug) {
          if (mine === null || state.poolId < mine) mine = state.poolId
        } else if (!state.owned && state.ready && (best === null || state.poolId < best)) {
          best = state.poolId
        }
      }
      if (mine !== null) {
        const poolId = mine
        const names = warmNamesForPoolId(poolId)
        ownerMap.set(slug, poolId)
        return { slug, names }
      }
      if (best === null) {
        return null
      }
      const poolId = best
      const names = warmNamesForPoolId(poolId)
      const manifest = await userDeploymentManifest({ name: names.deployment, workspaceClaim: names.workspaceClaim, stateClaim: names.stateClaim, slug, isWarmPool: true, poolId, owner: slug })
      await k8sRequest('PATCH', `/apis/apps/v1/namespaces/${namespace}/deployments/${names.deployment}`, {
        metadata: { labels: manifest.metadata.labels },
        spec: { template: manifest.spec.template },
      })
      ownerMap.set(slug, poolId)
      console.log(`[warmpool] claimed poolId=${poolId} owner=${slug}`)
      reconcilePool()
      return { slug, names }
    }

    async function waitForDeployment(name, timeoutMs = 300000) {
      const start = Date.now()
      while (Date.now() - start < timeoutMs) {
        const deployment = await k8sRequest('GET', `/apis/apps/v1/namespaces/${namespace}/deployments/${name}`)
        const desiredReplicas = deployment?.spec?.replicas || 1
        if (
          deployment?.status?.observedGeneration >= deployment?.metadata?.generation
          && deployment?.status?.updatedReplicas >= desiredReplicas
          && deployment?.status?.availableReplicas >= desiredReplicas
        ) {
          return
        }
        await new Promise((resolve) => setTimeout(resolve, 2000))
      }
      throw new Error(`Timed out waiting for deployment ${name}`)
    }

    async function isEnvironmentReady(names) {
      const deployment = await k8sRequest('GET', `/apis/apps/v1/namespaces/${namespace}/deployments/${names.deployment}`)
      if (!deployment) return false
      const desiredReplicas = deployment?.spec?.replicas || 1
      return (
        deployment?.status?.observedGeneration >= deployment?.metadata?.generation
        && (deployment?.status?.updatedReplicas || 0) >= desiredReplicas
        && (deployment?.status?.availableReplicas || 0) >= desiredReplicas
      )
    }

    function startProvisionWatch(names) {
      const key = names.deployment
      const existing = provisionTasks.get(key)
      if (existing) return existing
      const task = { promise: null, error: null }
      task.promise = waitForDeployment(key).catch((error) => {
        task.error = error
        throw error
      })
      provisionTasks.set(key, task)
      return task
    }

    async function provisionReady(names) {
      await startProvisionWatch(names).promise
    }

    async function resolveUserEnvironment(userId) {
      const slug = slugForUser(userId)
      const names = namesForSlug(slug)
      // Sticky: if the user already has a dedicated (non-warm) environment, keep
      // serving them there. Prevents a user who fell back to a dedicated
      // deployment during a pool shortage from being silently moved to a warm
      // unit later when the pool recovers.
      const existingDedicated = await k8sRequest('GET', `/apis/apps/v1/namespaces/${namespace}/deployments/${names.deployment}`)
      if (existingDedicated) {
        await ensureLease(`opencode-user-${slug}`)
        await ensurePersistentVolumeClaim(names.workspaceClaim, workspaceSize)
        await ensurePersistentVolumeClaim(names.stateClaim, stateSize)
        await ensureService(names.service, slug)
        await ensureDeployment(names.deployment, names.workspaceClaim, names.stateClaim, slug)
        return { slug, names }
      }
      if (warmPoolEnabled && warmPoolSize > 0) {
        const claimed = await claimWarmForUser(slug)
        if (claimed) {
          return claimed
        }
      }
      await ensureLease(`opencode-user-${slug}`)
      await ensurePersistentVolumeClaim(names.workspaceClaim, workspaceSize)
      await ensurePersistentVolumeClaim(names.stateClaim, stateSize)
      await ensureService(names.service, slug)
      await ensureDeployment(names.deployment, names.workspaceClaim, names.stateClaim, slug)
      return { slug, names }
    }

    function targetForUserPath(names, path, slug) {
      return {
        host: `${names.service}.${namespace}.svc.cluster.local`,
        port: 8082,
        injectBasicAuth: false,
        preserveHost: true,
        path,
        forwardedPrefix: `/u-${slug}`,
      }
    }

    function targetForPassthrough(names, path) {
      return {
        host: `${names.service}.${namespace}.svc.cluster.local`,
        port: 8082,
        injectBasicAuth: false,
        preserveHost: true,
        path,
      }
    }

    function stripSlugPrefix(requestUrl, slug) {
      const prefix = `/u-${slug}`
      if (!requestUrl.startsWith(prefix)) return requestUrl
      const rest = requestUrl.slice(prefix.length)
      if (rest === '') return '/'
      if (rest.startsWith('?')) return '/' + rest
      return rest
    }

    function proxyHeaders(request, target) {
      const headers = { ...request.headers }
      const originalHost = request.headers.host
      headers.host = target.preserveHost ? request.headers.host : `${target.host}:${target.port}`
      if (originalHost) headers['x-forwarded-host'] = originalHost
      if (!headers['x-forwarded-proto']) headers['x-forwarded-proto'] = 'https'
      if (request.socket?.remoteAddress) {
        const prior = headers['x-forwarded-for']
        headers['x-forwarded-for'] = prior ? `${prior}, ${request.socket.remoteAddress}` : request.socket.remoteAddress
      }
      if (target.injectBasicAuth) {
        headers.authorization = basicAuth
      }
      if (target.forwardedPrefix) {
        headers['x-forwarded-prefix'] = target.forwardedPrefix
      }
      return headers
    }

    function ptyUpgradeKey(request, target) {
      const pathname = new URL(target.path || request.url || '/', 'http://internal').pathname
      const match = pathname.match(/^\/pty\/([^/]+)\/connect$/)
      if (!match) return null
      return `${target.host}:${target.port}:${match[1]}`
    }

    function proxyRequest(request, response, target) {
      const upstream = http.request(
        {
          host: target.host,
          port: target.port,
          method: request.method,
          path: target.path || request.url,
          headers: proxyHeaders(request, target),
        },
        (upstreamResponse) => {
          response.writeHead(upstreamResponse.statusCode || 502, upstreamResponse.headers)
          upstreamResponse.pipe(response)
        },
      )
      upstream.on('error', (error) => {
        console.error('proxy request failed', error)
        if (!response.headersSent) {
          json(response, 502, { error: 'upstream request failed' })
          return
        }
        response.destroy(error)
      })
      request.pipe(upstream)
    }

    function proxyUpgrade(request, socket, head, target) {
      const ptyKey = ptyUpgradeKey(request, target)
      const tunnelId = ++tunnelSeq
      let upgraded = false
      let closed = false
      let upstreamSocket

      console.log(`[tunnel ${tunnelId}] upgrade start url=${request.url} ptyKey=${ptyKey}`)

      const cleanup = () => {
        if (closed) return
        closed = true
        upstreamSocket?.unpipe(socket)
        socket.unpipe(upstreamSocket)
        if (ptyKey && activePtyUpgrades.get(ptyKey) === cleanup) {
          activePtyUpgrades.delete(ptyKey)
          console.log(`[tunnel ${tunnelId}] removed from activePtyUpgrades ptyKey=${ptyKey}`)
        }
        upstreamSocket?.destroy()
        socket.destroy()
        console.log(`[tunnel ${tunnelId}] cleanup done ptyKey=${ptyKey} upgraded=${upgraded}`)
      }

      const failUpgrade = (error) => {
        if (closed) return
        console.error('proxy upgrade failed', error)
        if (!upgraded && !socket.destroyed) {
          socket.write('HTTP/1.1 502 Bad Gateway\r\n\r\n')
        }
        cleanup()
      }

      upstreamSocket = net.connect(target.port, target.host, () => {
        const method = request.method || 'GET'
        const reqLine = `${method} ${target.path || request.url} HTTP/1.1\r\n`
        const headers = proxyHeaders(request, target)
        headers.host = request.headers.host
        const headerStr = Object.entries(headers)
          .flatMap(([key, value]) => {
            if (Array.isArray(value)) return value.map((entry) => `${key}: ${entry}\r\n`)
            return [`${key}: ${value}\r\n`]
          })
          .join('')
        upstreamSocket.write(reqLine + headerStr + '\r\n')
        if (head.length > 0) upstreamSocket.write(head)
      })

      socket.on('close', cleanup)
      socket.on('end', cleanup)
      socket.on('error', cleanup)
      upstreamSocket.on('close', cleanup)
      upstreamSocket.on('end', cleanup)
      upstreamSocket.on('error', (error) => {
        if (upgraded) {
          cleanup()
          return
        }
        failUpgrade(error)
      })

      let buffer = Buffer.alloc(0)

      upstreamSocket.on('data', (chunk) => {
        buffer = Buffer.concat([buffer, chunk])
        const headerEnd = buffer.indexOf('\r\n\r\n')
        if (headerEnd === -1) return

        upstreamSocket.removeAllListeners('data')

        const headerSection = buffer.slice(0, headerEnd).toString('utf8')
        const lines = headerSection.split('\r\n')
        const statusMatch = lines[0].match(/^HTTP\/\d\.\d\s+(\d+)\s+(.+)$/)
        if (!statusMatch) {
          socket.destroy()
          upstreamSocket.destroy()
          return
        }

        const statusCode = parseInt(statusMatch[1], 10)
        const statusMessage = statusMatch[2]

        const responseHeaders = {}
        for (let i = 1; i < lines.length; i++) {
          const colonIdx = lines[i].indexOf(':')
          if (colonIdx > 0) {
            const key = lines[i].slice(0, colonIdx).trim()
            const value = lines[i].slice(colonIdx + 1).trim()
            responseHeaders[key] = value
          }
        }

        if (statusCode !== 101) {
          socket.write(buffer)
          socket.destroy()
          upstreamSocket.destroy()
          return
        }

        upgraded = true
        if (ptyKey) {
          const previous = activePtyUpgrades.get(ptyKey)
          if (previous && previous !== cleanup) {
            console.log(`[tunnel ${tunnelId}] replacing previous tunnel for ptyKey=${ptyKey}`)
            previous()
          }
          activePtyUpgrades.set(ptyKey, cleanup)
          console.log(`[tunnel ${tunnelId}] registered in activePtyUpgrades ptyKey=${ptyKey}`)
        }

        const statusLine = `HTTP/1.1 ${statusCode} ${statusMessage}\r\n`
        const headerLines = Object.entries(responseHeaders)
          .map(([key, value]) => `${key}: ${value}\r\n`)
          .join('')
        socket.write(statusLine + headerLines + '\r\n')

        const upstreamHead = buffer.slice(headerEnd + 4)
        if (upstreamHead.length > 0) socket.write(upstreamHead)

        upstreamSocket.pipe(socket, { end: false })
        socket.pipe(upstreamSocket, { end: false })
        console.log(`[tunnel ${tunnelId}] pipes established ptyKey=${ptyKey} upstream=${target.host}:${target.port}`)
      })
    }

    async function handleSetupStatus(request, response) {
      const userId = readSessionIdentity(request)
      if (!userId) {
        json(response, 401, { error: 'Missing session' })
        return
      }
      const url = new URL(request.url || '/', 'http://internal')
      try {
        const environment = await resolveUserEnvironment(userId)
        if (url.searchParams.get('reset') === 'retry') {
          provisionTasks.delete(environment.names.deployment)
          json(response, 200, { ready: false, retried: true })
          return
        }
        const ready = await isEnvironmentReady(environment.names)
        if (ready) {
          json(response, 200, { ready: true })
          return
        }
        const task = provisionTasks.get(environment.names.deployment)
        if (task?.error) {
          json(response, 200, { ready: false, failed: true, error: task.error.message || 'Provisioning failed' })
          return
        }
        json(response, 200, { ready: false })
      } catch (error) {
        console.error('setup status failed', error)
        json(response, 200, { ready: false, failed: true, error: error.message || 'Provisioning failed' })
      }
    }

