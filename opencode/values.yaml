# ============================================================
# EZUA settings
# ============================================================
ezua:
  domainName: "${DOMAIN_NAME}"
  virtualService:
    endpoint: "opencode-web-k8s.${DOMAIN_NAME}"
    istioGateway: "istio-system/ezaf-gateway"
  authorizationPolicy:
    namespace: "istio-system"
    providerName: "oauth2-proxy"

# ============================================================
# General configuration
# ============================================================
domain: "opencode-web-helm.${DOMAIN_NAME}"
previewDomain: "${DOMAIN_NAME}"

# Opt-in per system. Set to true only where the cluster's gateway supports the
# preview wildcard subdomains (e.g. g2 has a "*" catch-all gateway). On systems
# without wildcard host/cert coverage (e.g. dc15), keep false so the preview
# VirtualService is not created and the chart installs cleanly.
preview:
  enabled: false

storageClass: gl4f-filesystem
storage:
  sharedSize: 20Gi
  workspaceSize: 5Gi
  stateSize: 2Gi

images:
  user: node:22-bookworm-slim
  init: node:22-bookworm-slim
  ttyd: tsl0922/ttyd:latest

opencode:
  version: 1.18.11

# Browser-facing UI. "opencode" uses the built-in opencode web UI; "openchamber"
# serves OpenChamber on chamberPort with a headless opencode server on serverPort.
openchamber:
  version: "1.17.2"

ui:
  mode: openchamber
  chamberPort: 3000
  serverPort: 4096

provisioning:
  aptPackages: "bash ca-certificates curl dnsutils fd-find gh git jq less make nano ncurses-term openssh-client python3 python3-pip python3-venv procps ripgrep tini tmux tree unzip util-linux vim-tiny zip zstd xz-utils lsof"
  # Loading screen shown while a user's pod is being provisioned/assigned.
  # When disabled the router reverts to the original blocking behavior.
  loadingUI:
    enabled: true
    heading: "Setting up your environment\u2026"
    subtext: "This usually takes a few minutes on first launch. Please wait."

# ============================================================
# Warm pool: pre-provisioned, always-ready per-user units.
# When enabled, the router keeps `size` fully-initialized user pods
# warm so a new user's first launch proxies in ~seconds instead of
# waiting 3-5 minutes for the per-user install. A warm unit = its own
# Deployment + Service + workspace PVC + state PVC (the state PVC holds
# the installed toolchain, so claiming only restarts the pod, it does
# not reinstall opencode/uv/ttyd).
#
# Tradeoff: each warm unit is an idle user pod consuming resources
# (up to user.resources.limits). Set size: 0 or enabled: false to keep
# the original on-demand cold spin-up behavior (exact same as before).
#
# Versions are NOT baked into an image: tools are installed at runtime
# into the pooled state PVCs, so opencode.version / openchamber.version
# still upgrade via a values.yaml bump - pooled units re-init on the
# existing template-version annotation check.
# ============================================================
warmPool:
  enabled: false
  size: 2
  refreshIntervalSeconds: 15

auth:
  username: opencode
  password: "7Vf9mQ2xKp8tL4nR6wY1cB3hDz5sUa0N"

# ============================================================
# Opencode config (model, provider, MCP servers)
# ============================================================
opencodeConfig: |
    {
      "$schema": "https://opencode.ai/config.json",
      "permission": {
        "*": "ask",
        "bash": {
          "*": "ask",
          "ls *": "allow",
          "grep *": "allow",
          "glob *": "allow",
          "rm *": "deny"
        },
        "edit": "ask",
        "read": "allow",
        "glob": "allow",
        "question": "allow",
        "webfetch": "ask",
        "websearch": "ask",
        "codesearch": "allow",
        "external_directory": "allow",
        "doom_loop": "deny"
      }
    }

opencodeSkills:
  - name: pcai-platform
    content: |
      ---
      name: pcai-platform
      description: Use for PCAI/AIE Kubernetes, routing, model-serving, and deployment troubleshooting.
      compatibility: opencode
      ---

      ## Guidance

      - Start with read-only inspection.
      - Check pods, services, endpoints, VirtualServices, and logs before changing anything.
      - Prefer the smallest safe fix.

opencodeAgents:
  - name: pcai-platform-assistant
    content: |
      ---
      description: Expert HPE AIE/PCAI platform engineer and advisor.
      mode: subagent
      ---

      # HPE AI Essentials (AIE) Platform Assistant

      You are an expert AIE/PCAI platform engineer and advisor. You have access to live Kubernetes cluster tools, indexed product documentation, and web search.

      Your mission: **Think deeply. Act decisively. Anticipate what the user needs before they ask.**

  - name: pcai-debugger
    content: |
      ---
      description: Diagnose PCAI/AIE Kubernetes, Istio routing, PVC, and opencode deployment issues.
      mode: subagent
      ---

      Start with read-only inspection. Check pods, events, services, endpoints, VirtualServices, PVCs, and logs before recommending changes.

      Prefer the smallest safe fix and call out any destructive operation before suggesting it.

router:
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

user:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

# ============================================================
# Pre-delete cleanup hook (removes dynamically-created per-user
# resources on helm uninstall so the namespace and shared PVC
# don't hang in Terminating)
# ============================================================
cleanup:
  image: node:22-bookworm-slim
  podTimeout: 180  # seconds to wait for user pods to terminate
  pvcTimeout: 120  # seconds to wait for user PVCs to be deleted

# ============================================================
# Certificate policy (for clusters with private/internal CA)
# ============================================================

certificatesPolicy:
  enabled: false 
  
# ============================================================
# Proxy configuration 
# ============================================================
proxy:
  enabled: false 
  
# ============================================================ 
no_proxy:
  enabled: false

# ============================================================
# Shared workspace content (populates the shared PVC)
# ============================================================
sharedContent:
  enabled: true
