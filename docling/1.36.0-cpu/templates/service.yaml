apiVersion: v1
kind: Service
metadata:
  name: {{ include "docling.fullname" . }}
  namespace: {{ include "docling.namespace" . }}
  labels:
    {{- include "docling.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "docling.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
