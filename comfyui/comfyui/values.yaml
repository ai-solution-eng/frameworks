# Default values for ComfyUI.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
ezua:
  virtualService:
    endpoint: "comfyui.${DOMAIN_NAME}"
    istioGateway: "istio-system/ezaf-gateway"

clusterDomain: cluster.local
annotations: {}

#env:
#- name: http_proxy
#  value: ""
#- name: https_proxy
#  value: ""

modelsPVC:
  enabled: true
  size: 200Gi
  accessMode: ReadWriteMany
  
outputPVC:
  enabled: true
  size: 50Gi
  accessMode: ReadWriteMany

userPVC:
  enabled: true
  size: 10Gi
  accessMode: ReadWriteMany

customNodesPVC:
  enabled: true
  size: 5Gi
  accessMode: ReadWriteMany

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
#
# Set this to 0 when the app is not in use. Because a GPU is declared under
# `resources` below, every replica holds an entire accelerator for its whole
# lifetime - whether or not it is serving a single request. ComfyUI also caches
# model weights in VRAM and never gives them back on its own, so an idle replica
# can sit on most of a card indefinitely. Scaling to 0 releases the card back to
# the cluster; the next scale-up takes a card again (and waits in Pending if
# none is free, which is a queue rather than a crash).
#
# Note: this value is ignored when `autoscaling.enabled` is true - the HPA owns
# the replica count in that case. Do not enable autoscaling for this chart: each
# replica needs its own whole GPU, so scaling out consumes accelerators.
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: tpomas/comfyui
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent 
  # Overrides the image tag whose default is the chart appVersion.
  tag: 0.0.1

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8188
  containerPort: 8188
  nodePort: ""
  labels: {}
  loadBalancerClass: ""

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  additionalHosts: []
  tls: false
  existingSecret: ""

# We usually recommend not to specify default resources and to leave this as a conscious
# choice for the user. This also increases chances charts run on environments with little
# resources, such as Minikube. If you do want to specify resources, uncomment the following
# lines, adjust them as necessary, and remove the curly braces after 'resources:'.
#
# GPU NOTES - please read before changing nvidia.com/gpu.
#
# 1. requests MUST equal limits. nvidia.com/gpu is an *extended* resource and
#    Kubernetes does not allow extended resources to be overcommitted. Setting
#    requests: 0 with limits: 1 is rejected at admission with HTTP 422
#    ("must be equal to nvidia.com/gpu limit of 1") and the pod is never created.
#    This is not a soft failure and there is no way to express "allocated by the
#    scheduler but still visible as all devices" - allocation IS the pin.
#
# 2. Declaring the GPU is what reserves the card. The device plugin allocates one
#    whole accelerator to this pod for as long as it runs, so no other workload
#    can be scheduled onto that card. That reservation is the point of this block.
#
# 3. Setting nvidia.com/gpu to 0 is NOT a safe way to avoid taking a card. With 0
#    the device plugin allocates nothing and no NVIDIA_VISIBLE_DEVICES pin is
#    injected, so the container sees EVERY GPU on the node and ComfyUI attaches to
#    cuda:0 - while the scheduler still believes that card is free. Any pod that
#    requests a whole GPU can then be placed on it and will fail to start with
#    "Free memory on device cuda:0 ... is less than desired GPU memory
#    utilization", because ComfyUI is holding the memory. Since ComfyUI never
#    releases cached weights, this persists for the lifetime of the pod.
#
# 4. If sharing a card is genuinely required, keep 0 but pin the card explicitly
#    via an NVIDIA_VISIBLE_DEVICES=<GPU-UUID> entry in `env` below. Be aware this
#    still leaves the card unaccounted to the scheduler, so it only confines the
#    pod - it does not protect the card from being handed to another pod.
resources:
  limits:
    cpu: 8
    memory: 30Gi
    nvidia.com/gpu: 1
  requests:
    cpu: 4
    memory: 5Gi
    nvidia.com/gpu: 1

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# volumes and volumeMounts removed in favor of PVCs
# Additional volumes on the output Deployment definition
#volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
#volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# Pin the pod to a specific node - normally the GPU node that has spare capacity.
# Uncomment and replace the placeholder with a real node name, for example:
#
#   nodeSelector:
#     kubernetes.io/hostname: <gpu-node-name>
#
# Pinning is optional but recommended for a GPU workload: it keeps the pod off
# nodes whose accelerators are already committed, and combined with
# `replicaCount: 0` it makes it predictable which card gets reclaimed when the
# app is scaled back up. Leave as {} to let the scheduler choose any node.
nodeSelector: {}

tolerations: []

affinity: {}
