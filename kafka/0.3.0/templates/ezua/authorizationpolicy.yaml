{{- if .Values.kafkaUi.enabled }}
{{- if .Values.ezua.authorizationPolicy }}
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ printf "%s-%s-auth-policy" .Release.Name .Chart.Name }}
  namespace: {{ .Values.ezua.authorizationPolicy.namespace | default "istio-system" }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
spec:
  action: CUSTOM
  provider:
    name: {{ .Values.ezua.authorizationPolicy.providerName | default "oauth2-proxy" }}
  rules:
    - to:
        - operation:
            hosts:
              - {{ .Values.ezua.virtualService.endpoint | required "ezua.virtualService.endpoint is required" }}
  selector:
    matchLabels:
      {{- toYaml .Values.ezua.authorizationPolicy.matchLabels | nindent 6 }}
{{- end }}
{{- end }}
