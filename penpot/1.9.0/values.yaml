    # -- Penpot objects persistent Volume storage class.
    # If defined, storageClassName: <storageClass>.
    # If undefined (the default) or set to null, no storageClassName spec is set, choosing the default provisioner.
    # @section -- Persistence parameters
    storageClass: ""
    # -- Penpot objects persistent Volume size.
    # @section -- Persistence parameters
    size: 20Gi
    # -- The name of an existing PVC to use for Penpot objects persistence.
    # @section -- Persistence parameters
    existingClaim: ""
    # -- Penpot objects persistent Volume access modes.
    # @section -- Persistence parameters
    accessModes:
      - ReadWriteOnce
    # -- Penpot objects persistent Volume Claim annotations.
    # @section -- Persistence parameters
    annotations: {}

# ---------------------------------------------------------------------------
# Bundled Bitnami subcharts (PostgreSQL + Redis) - PCAI port.
# Set postgresql.enabled / redis.enabled to false to point config.postgresql /
# config.redis at external services instead.
postgresql:
  enabled: true
  # Pin the service name so config.postgresql.host stays valid regardless of
  # the Helm release name chosen in the PCAI Import Framework wizard.
  fullnameOverride: "penpot-postgresql"
  # Broadcom removed old Bitnami images from docker.io/bitnami (Aug 2025);
  # this chart version's tags only exist in the bitnamilegacy organization.
  image:
    repository: bitnamilegacy/postgresql
    tag: 14.5.0-debian-11-r21
  # HPE EZUA labels required by the PCAI Import Framework.
  commonLabels:
    hpe-ezua/app: penpot
    hpe-ezua/type: vendor-service
  auth:
    # Must match config.postgresql.username / password / database above.
    enablePostgresUser: true
    postgresPassword: "penpot"
    username: "penpot"
    password: "penpot"
    database: "penpot"
  primary:
    persistence:
      # Leave empty to use the cluster default StorageClass.
      # PCAI: "nfs-csi" (Dev Kit) or "gl4f-filesystem" (S/M/L clusters).
      storageClass: ""
      size: 8Gi
    resources:
      limits:
        cpu: 1
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi

redis:
  enabled: true
  fullnameOverride: "penpot-redis"
  # See the postgresql.image note above: use the bitnamilegacy organization
  # (the original 6.2.7-debian-10-r23 tag was deleted entirely).
  image:
    repository: bitnamilegacy/redis
    tag: 6.2.9-debian-11-r0
  # Single-node topology keeps the PCAI footprint small (no replicas StatefulSet).
  architecture: standalone
  # HPE EZUA labels required by the PCAI Import Framework.
  commonLabels:
    hpe-ezua/app: penpot
    hpe-ezua/type: vendor-service
  auth:
    # Disabled for the in-cluster demo topology; config.redis has no password.
    enabled: false
  master:
    # redis 16.x does not propagate commonLabels to the pod template, set them here.
    podLabels:
      hpe-ezua/app: penpot
      hpe-ezua/type: vendor-service
    persistence:
      # Leave empty to use the cluster default StorageClass.
      # PCAI: "nfs-csi" (Dev Kit) or "gl4f-filesystem" (S/M/L clusters).
      storageClass: ""
      size: 8Gi
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi

gateway:
  # -- Enable Gateway API HTTPRoute support.
  # @section -- Gateway API parameters
  enabled: false

  # -- Extra annotations for the HTTPRoute.
  # @section -- Gateway API parameters
  annotations: {}

  # -- Hostnames exposed by the HTTPRoute.
  # @section -- Gateway API parameters
  hostnames:
    - penpot.example.com

  # -- ParentRefs for attaching the HTTPRoute to one or more Gateways.
  # Example:
  # parentRefs:
  #   - name: shared-gateway
  #     namespace: infra
  #     sectionName: http
  # @section -- Gateway API parameters
  parentRefs: []

  # -- Path match type for the HTTPRoute.
  # Common values: PathPrefix, Exact
  # @section -- Gateway API parameters
  pathMatchType: PathPrefix

  # -- Path value for the HTTPRoute match.
  # @section -- Gateway API parameters
  path: /

  # -- Optional filters for the HTTPRoute rules.
  # Example:
  # filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #         - name: X-Forwarded-Proto
  #           value: https
  # @section -- Gateway API parameters
  filters: []

ingress:
  # -- Enable (frontend) Ingress Controller.
  # @section -- Ingress parameters
  enabled: false
  # -- The Ingress className.
  # @section -- Ingress parameters
  className: ""
  # -- Mapped annotations for the ingress crontroller.
  # E.g.
  # annotations:
  #   kubernetes.io/ingress.class: nginx
  #   kubernetes.io/tls-acme: "true"
  # @section -- Ingress parameters
  annotations: {}
  # -- Root path for every hosts.
  # @section -- Ingress parameters
  path: "/"
  # -- Array style hosts for the (frontend) ingress crontroller.
  # @section -- Ingress parameters
  hosts:
    # -- The default external hostname to access to the penpot app.
    # @section -- Ingress parameters
    - "penpot.example.com"
  # -- Array style TLS secrets for the (frontend) ingress crontroller.
  # E.g.
  # tls:
  #   - secretName: penpot.example.com-tls
  #     hosts:
  #       - penpot.example.com
  # @section -- Ingress parameters
  tls: []

route:
  # -- Enable Openshift/OKD Route. Check [the official doc](https://docs.openshift.com/container-platform/4.16/networking/routes/route-configuration.html). When it is enabled, all fsGroup and runAsUser must be changed to null.
  # @section -- Route parameters
  enabled: false
  # -- An optional map of annotations to be applied to the route.
  # @section -- Route parameters
  annotations: {}
  # -- The default external hostname to access to the penpot app.
  # @section -- Route parameters
  host: penpot.example.com
  # -- Define a path to use Path-based routes.
  # @section -- Route parameters
  path: null
  # -- A Map with TLS configuration for the route.
  # E.g.
  # tls:
  #   terminationType: edge
  #   terminationPolicy: Redirect
  # @section -- Route parameters
  tls: {}
  # -- Define the wildcard policy (None, Subdomain, ...)
  # @section -- Route parameters
  wildcardPolicy: None

# ============================================================
# Corporate CA certificates (for clusters behind corporate proxies / TLS MITM)
# ============================================================
# When enabled, an init container copies the CA bundle baked into the init image
# (use a corporate-baked alpine) into a shared emptyDir that every container
# mounts at /tmp/certs; SSL_CERT_FILE points the apps at it.
certificatesPolicy:
  enabled: false
  env: []
  initContainer: {}
  initVolumeMounts: []
  volumeMounts: []
  volumes: []

# ============================================================
# Proxy configuration (for clusters behind corporate proxy)
# ============================================================
# Set proxy.enabled to true to enable proxy settings for the user container. The init container will also inherit these settings.
proxy:
  enabled: true # Set to false if the cluster is not behind a corporate proxy (e.g. HT evironments)
  env: []

# ============================================================
no_proxy:
  enabled: true # Set to false if the cluster is not behind a corporate proxy (e.g. HT evironments)
  env: []