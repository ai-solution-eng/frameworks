apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nemoclaw.fullname" . }}-gateway-token
  labels:
    {{- include "nemoclaw.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.gateway.token | quote }}
  {{- if .Values.telegram.enabled }}
  telegram-bot-token: {{ .Values.telegram.botToken | quote }}
  {{- end }}
  {{- if eq .Values.agent "hermes" }}
  hermes-api-key: {{ .Values.hermes.apiServerKey | quote }}
  litellm-api-key: {{ .Values.litellm.apiKey | quote }}
  {{- if .Values.hermes.dashboardAuth.enabled }}
  # Dashboard basic-auth password. Pin hermes.dashboardAuth.password to keep
  # it stable; empty -> a random 24-char value generated at install (read it
  # back with `helm get values <release> -o yaml`). The dashboard_auth plugin
  # hashes it in-memory at load — no scrypt hash needed in values.
  hermes-dashboard-password: {{ .Values.hermes.dashboardAuth.password | default (randAlphaNum 24) | quote }}
  {{- end }}
  {{- end }}
