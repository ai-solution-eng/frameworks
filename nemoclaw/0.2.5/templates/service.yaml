apiVersion: v1
kind: Service
metadata:
  name: {{ include "nemoclaw.serviceName" . }}
  labels:
    {{- include "nemoclaw.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "nemoclaw.selectorLabels" . | nindent 4 }}
  ports:
    {{- if eq .Values.agent "openclaw" }}
    - name: dashboard
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
    {{- else if eq .Values.agent "hermes" }}
    # Two named Service ports so the VirtualService can route by path:
    #   /v1/  -> api  (OpenAI-compatible, hermes.apiPort)
    #   /     -> dashboard (basic-auth web UI, hermes.dashboardPort)
    - name: hermes-api
      port: {{ .Values.service.hermesApiPort }}
      targetPort: {{ .Values.hermes.apiPort }}
      protocol: TCP
    - name: hermes-dashboard
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.hermes.dashboardPort }}
      protocol: TCP
    {{- end }}
